name: Active Workout Primary Editor Selector Repair

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/active-workout-full-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Preserve primary editor selector
        run: node scripts/repair-active-workout-primary-editor-selector.mjs
      - name: Remove temporary repair authority and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/active-workout-primary-editor-selector-repair.yml scripts/repair-active-workout-primary-editor-selector.mjs
          git config user.name "plaivra-implementation"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "Preserve Active Workout primary editor QA selector"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
