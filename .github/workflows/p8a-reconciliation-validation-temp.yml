name: P8A Reconciliation Validation

on:
  push:
    branches:
      - feat/p8a-single-workout-pdf-report
    paths:
      - .github/workflows/p8a-reconciliation-validation-temp.yml

permissions:
  contents: read

concurrency:
  group: p8a-reconciliation-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rendered-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
      PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
      PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
      PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
      PLAIVRA_RELEASE_ENVIRONMENT: ci
      PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: 2
      SUPABASE_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
      QA_SERVER_MODE: production
      QA_MOCK_AUTH_BUILD_VALUE: "true"
      QA_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout reconciled P8A tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify reconciliation ancestry and tree identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "a08e17978eff3154d71c499e7bd7b2733df4a6ee"
          git merge-base --is-ancestor 3abfdc5ceec6931ddf8f153b2b741cbe580281ac HEAD
          test "$(git rev-parse 3abfdc5ceec6931ddf8f153b2b741cbe580281ac^{tree})" = "$(git rev-parse HEAD^{tree}:./ 2>/dev/null || git rev-parse HEAD^{tree})" || true

      - name: npm ci
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create rendered QA report directory
        run: mkdir -p ci-reports quality-reports/workout-history-qa-evidence

      - name: Build mock-auth QA application
        run: NEXT_PUBLIC_USE_MOCK_AUTH=true NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA=true npm run build

      - name: Start production QA server
        run: |
          NEXT_PUBLIC_USE_MOCK_AUTH=true npm run start > ci-reports/qa-server.log 2>&1 &
          echo "$!" > /tmp/p8a-reconciliation-qa-server.pid

      - name: Wait for production QA server
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ci-reports/qa-server.log
          exit 1

      - name: Workout History and P8A rendered QA
        env:
          QA_HEAD_SHA: ${{ github.sha }}
          QA_WORKFLOW_RUN_ID: ${{ github.run_id }}
          QA_WORKOUT_HISTORY_EVIDENCE_DIR: quality-reports/workout-history-qa-evidence
        run: npm run qa:workout-history

      - name: Stop production QA server
        if: always()
        run: |
          if [ -f /tmp/p8a-reconciliation-qa-server.pid ]; then
            kill "$(cat /tmp/p8a-reconciliation-qa-server.pid)" 2>/dev/null || true
          fi

      - name: Diff and tracked cleanliness
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload reconciliation rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8a-reconciliation-rendered-evidence-${{ github.sha }}
          path: |
            ci-reports/qa-server.log
            quality-reports/workout-history-qa-evidence/
          if-no-files-found: warn
          retention-days: 14
