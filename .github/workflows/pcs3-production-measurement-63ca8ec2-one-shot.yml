name: PCS3 Production Measurement 63ca8ec2 Safe Diagnostic

on:
  push:
    branches:
      - ops/pcs3-production-measurement-63ca8ec2
    paths:
      - ".github/workflows/pcs3-production-measurement-63ca8ec2-one-shot.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Checkout exact Production source
        uses: actions/checkout@v4
        with:
          ref: 63ca8ec2bf8e430b7e8ca87befccb6ff2a093b5c
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Add ephemeral safe Server-Timing shape diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/measure-pcs3-production.mjs")
          source = path.read_text()
          needle = "export function parseServerTiming(value) {\n"
          diagnostic = """export function parseServerTiming(value) {
            const safeShape = String(value ?? \"\")
              .split(\",\")
              .map((part) => part.trim().split(\";\").map((segment, index) =>
                index === 0
                  ? segment.replace(/[^A-Za-z0-9_-]/g, \"?\")
                  : segment.split(\"=\")[0].trim().replace(/[^A-Za-z0-9_-]/g, \"?\")
              ).join(\";\"))
              .join(\", \" );
            console.log(\"PCS3_SAFE_SERVER_TIMING_SHAPE\", safeShape);
          """
          if needle not in source:
              raise SystemExit("parseServerTiming authority not found")
          path.write_text(source.replace(needle, diagnostic, 1))
          PY

      - name: Run canonical PCS3 Production measurement
        env:
          PLAIVRA_SMOKE_POPULATED_EMAIL: ${{ secrets.PLAIVRA_SMOKE_POPULATED_EMAIL }}
          PLAIVRA_SMOKE_POPULATED_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_POPULATED_PASSWORD }}
          PLAIVRA_SMOKE_EMPTY_EMAIL: ${{ secrets.PLAIVRA_SMOKE_EMPTY_EMAIL }}
          PLAIVRA_SMOKE_EMPTY_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_EMPTY_PASSWORD }}
        run: |
          npm run measure:pcs3-production -- \
            --mode production \
            --url https://app.plaivra.com \
            --expected-commit 63ca8ec2bf8e430b7e8ca87befccb6ff2a093b5c \
            --expected-migration 20260724232734 \
            --samples 20 \
            --warmups 2 \
            --account both \
            --output quality-reports/pcs3-production-measurement

      - name: Upload sanitized PCS3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcs3-production-measurement-63ca8ec2-safe-diagnostic
          path: quality-reports/pcs3-production-measurement
          if-no-files-found: error
          retention-days: 1
