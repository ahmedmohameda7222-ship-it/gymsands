name: Plan 6 Plan 4 Ledger Contract Fix Temp
on:
  push:
    branches:
      - feat/food-catalog-governance-plan6
    paths:
      - .github/workflows/plan6-plan4-ledger-contract-fix-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align Plan 4 ledger contract with pending Plan 6
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'lib/product/food-catalog-ingestion-v2-authority-migration.test.ts';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace(
            `const PLAN5_SERVING_CORRECTION = "20260907165500_food_catalog_search_serving_semantics_correction.sql";\n`,
            `const PLAN5_SERVING_CORRECTION = "20260907165500_food_catalog_search_serving_semantics_correction.sql";\nconst PLAN6_MIGRATION_FILE = "20260908100000_food_catalog_governance_control_plane.sql";\n`
          );
          text = text.replace(
            `  it("records the verified Plan 4 alias while the Plan 5 serving correction is reconciled", () => {\n    expect(ledger.productionMigrationCount).toBe(63);\n    expect(ledger.productionRecordCount).toBe(121);\n    expect(ledger.pendingCount).toBe(0);\n    expect(ledger.unresolvedCount).toBe(0);\n    expect(ledger.historyRepair.state).toBe("reconciled");\n    expect(ledger.historyRepair.pendingCount).toBe(0);\n    expect(ledger.historyRepair.unresolvedCount).toBe(0);\n    expect(ledger.historyRepair.schemaAppliedUntrackedCount).toBe(0);\n    expect(releaseCompatibility.databaseMigrationMarkerVersion).toBe("20260724232734");\n\n    const pendingEntries = ledger.entries.filter((entry) => entry.state === "pending");\n    expect(pendingEntries).toEqual([]);\n`,
            `  it("records the verified Plan 4/5 aliases while Plan 6 remains explicitly pending", () => {\n    expect(ledger.productionMigrationCount).toBe(63);\n    expect(ledger.productionRecordCount).toBe(121);\n    expect(ledger.pendingCount).toBe(1);\n    expect(ledger.unresolvedCount).toBe(1);\n    expect(ledger.historyRepair.state).toBe("pending");\n    expect(ledger.historyRepair.pendingCount).toBe(1);\n    expect(ledger.historyRepair.unresolvedCount).toBe(1);\n    expect(ledger.historyRepair.schemaAppliedUntrackedCount).toBe(0);\n    expect(releaseCompatibility.databaseMigrationMarkerVersion).toBe("20260724232734");\n\n    const pendingEntries = ledger.entries.filter((entry) => entry.state === "pending");\n    expect(pendingEntries).toEqual([\n      expect.objectContaining({\n        localFile: PLAN6_MIGRATION_FILE,\n        state: "pending",\n      }),\n    ]);\n`
          );
          text = text.replace(
            `    expect(reconciliationDoc).toContain("pending repository migrations: **0**");\n    expect(reconciliationDoc).toContain("\`unresolvedcount = 0\`");\n`,
            `    expect(reconciliationDoc).toContain("pending repository migrations: **1**");\n    expect(reconciliationDoc).toContain("\`unresolvedcount = 1\`");\n    expect(reconciliationDoc).toContain(PLAN6_MIGRATION_FILE);\n`
          );
          if (!text.includes('const PLAN6_MIGRATION_FILE = "20260908100000_food_catalog_governance_control_plane.sql";')) throw new Error('Plan 6 constant patch failed');
          if (!text.includes('expect(ledger.pendingCount).toBe(1);')) throw new Error('pendingCount patch failed');
          if (!text.includes('pending repository migrations: **1**')) throw new Error('reconciliation doc expectation patch failed');
          fs.writeFileSync(path, text);
          NODE
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/product/food-catalog-ingestion-v2-authority-migration.test.ts
          git commit -m "test: preserve Plan 4 aliases with pending Plan 6"
          git push origin HEAD:feat/food-catalog-governance-plan6
