name: AW3B Evidence Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw3b-evidence-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export-and-clean:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Package reconciliation sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aw3b-evidence-export/docs/architecture aw3b-evidence-export/docs/reports aw3b-evidence-export/supabase
          cp supabase/migration-ledger.json aw3b-evidence-export/supabase/
          cp docs/architecture/migration-ledger-reconciliation.md aw3b-evidence-export/docs/architecture/
          cp docs/reports/active-workout-aw3b-implementation-report.md aw3b-evidence-export/docs/reports/
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > aw3b-evidence-export/source-commit.txt

      - name: Upload reconciliation sources
        uses: actions/upload-artifact@v4
        with:
          name: aw3b-reconciliation-sources-${{ github.event.pull_request.head.sha }}
          path: aw3b-evidence-export/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary evidence workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/aw3b-evidence-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(aw3b): remove evidence export workflow'
          git push origin HEAD:feat/active-workout-aw3b-structured-set-details
