name: Plan 6 Re-review Root Fix One Shot

on:
  push:
    branches:
      - feat/food-catalog-governance-plan6

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct fixer literals to the binding TypeScript evidence policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/plan6_rereview_apply.py')
          s=p.read_text()
          s=s.replace('text2, count = pattern.subn(replacement.strip(), text, count=1)', 'text2, count = pattern.subn(lambda _match: replacement.strip(), text, count=1)')
          s=s.replace('manufacturer_document','manufacturer').replace('barcode_lookup','barcode').replace('canonical_registry','canonical')
          replacements={
            "'missing_nutrition',jsonb_build_array('source_record','product_label')":"'missing_nutrition',jsonb_build_array('source_record','product_label','manufacturer','curator_reason')",
            "'wrong_serving',jsonb_build_array('source_record','product_label')":"'wrong_serving',jsonb_build_array('source_record','product_label','manufacturer')",
            "'missing_serving',jsonb_build_array('source_record','product_label')":"'missing_serving',jsonb_build_array('source_record','product_label','manufacturer','curator_reason')",
            "'wrong_name',jsonb_build_array('source_record','product_label','manufacturer')":"'wrong_name',jsonb_build_array('source_record','product_label','manufacturer','canonical')",
            "'wrong_translation',jsonb_build_array('source_record','product_label','manufacturer')":"'wrong_translation',jsonb_build_array('source_record','product_label','manufacturer','canonical')",
            "'duplicate_food',jsonb_build_array('source_record','product_label','barcode','canonical','curator_reason')":"'duplicate_food',jsonb_build_array('source_record','product_label','manufacturer','barcode','canonical')",
            "'wrong_variant',jsonb_build_array('source_record','product_label','manufacturer','barcode','curator_reason')":"'wrong_variant',jsonb_build_array('source_record','product_label','manufacturer','barcode')",
            "'outdated_product',jsonb_build_array('source_record','product_label','manufacturer','curator_reason')":"'outdated_product',jsonb_build_array('source_record','manufacturer','canonical')",
            "'source_conflict',jsonb_build_array('source_record','product_label','manufacturer','barcode','canonical','curator_reason')":"'source_conflict',jsonb_build_array('source_record','product_label','manufacturer','canonical')",
            "'other',jsonb_build_array('source_record','product_label','manufacturer','canonical','curator_reason')":"'other',jsonb_build_array('source_record','product_label','manufacturer','barcode','canonical','curator_reason')",
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          s=s.replace(
            'r"create or replace function private\\.food_catalog_governance_case_evidence_required\\([\\s\\S]*?\\n\\$function\\$;\\n"',
            'r"create or replace function private\\.food_catalog_governance_case_evidence_required\\(p_category text\\)[\\s\\S]*?\\n\\$function\\$;\\n"'
          )
          s=s.replace("p_policy_version text default 'plan6-v1'","p_policy_version text default null")
          s=s.replace("if btrim(coalesce(p_policy_version,''))<>v_policy then","if p_policy_version is not null and btrim(p_policy_version)<>v_policy then")
          p.write_text(s)
          PY
      - name: Apply root-fix patch
        run: python3 .github/scripts/plan6_rereview_apply.py
      - name: Commit root fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/scripts/plan6_rereview_apply.py \
            lib/product/food-catalog-governance-plan6-rereview.test.ts \
            scripts/run-database-verification.mjs \
            supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql \
            supabase/verification/food-catalog-governance-control-plane.sql
          if git diff --cached --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          git commit -m "fix(plan6): harden governance re-review authorities"
          git push origin HEAD:feat/food-catalog-governance-plan6
