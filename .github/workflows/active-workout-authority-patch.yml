name: Active Workout Authority Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/active-workout-full-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply deterministic repository patches
        run: |
          node scripts/apply-active-workout-authority.mjs
          node scripts/apply-active-workout-core-authority-v2.mjs
          node scripts/apply-active-workout-i18n.mjs
          node scripts/apply-active-workout-replacement-ui.mjs
      - name: Commit implementation patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "plaivra-implementation"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "Integrate Active Workout localized replacement experience"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
