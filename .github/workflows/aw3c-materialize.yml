name: AW-3C Script Diagnostic

on:
  pull_request:
    branches:
      - feat/active-workout-aw3b-structured-set-details
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: aw3c-script-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw3c-prescription-snapshots
          fetch-depth: 0

      - name: Materialize checksum-bound permanent tree
        shell: bash
        run: |
          set -euo pipefail
          cat .aw3c-transport/part00 .aw3c-transport/part01 .aw3c-transport/part02 .aw3c-transport/part03 .aw3c-transport/part04 .aw3c-transport/part05 .aw3c-transport/part06 .aw3c-transport/part07 > /tmp/aw3c-old.b64
          test "$(sha256sum /tmp/aw3c-old.b64 | cut -d' ' -f1)" = "af65dfa4f9f658782f7215eb9961767e2e15e760cbb0e390b5890aa5b787dbe8"
          base64 -d /tmp/aw3c-old.b64 > /tmp/aw3c-old.tar.gz
          test "$(sha256sum /tmp/aw3c-old.tar.gz | cut -d' ' -f1)" = "646fe5036900afd0de3bf1567d0796d303a415ec322ab17d70c7c62743390ce1"
          tar -xzf /tmp/aw3c-old.tar.gz
          rm -rf .aw3c-bundle
          mv aw3c-bundle .aw3c-bundle
          test "$(sha256sum .aw3c-transport/corrected-apply.py.gz.b64 | cut -d' ' -f1)" = "a709137090139cd82cab806e3ba8cb63864f89dc18b1d43e1de99ec5ac8a238d"
          base64 -d .aw3c-transport/corrected-apply.py.gz.b64 > /tmp/corrected-apply.py.gz
          test "$(sha256sum /tmp/corrected-apply.py.gz | cut -d' ' -f1)" = "888e0bfb1d4971f01a93b918d0df57bc2b6aeaaa91505df55206046c07b3ad6a"
          gzip -dc /tmp/corrected-apply.py.gz > .aw3c-bundle/apply.py
          python .aw3c-bundle/apply.py
          test "$(sha256sum .aw3c-transport/incremental.patch.gz.b64 | cut -d' ' -f1)" = "b4aba1f7cc4e94a890c6d59c524374959cbd0c3cf44f728787d5e307aee9357f"
          base64 -d .aw3c-transport/incremental.patch.gz.b64 > /tmp/aw3c-incremental.patch.gz
          test "$(sha256sum /tmp/aw3c-incremental.patch.gz | cut -d' ' -f1)" = "19f3490caa492bcb585a40ca6fa5dade4c8e26a1ea15284fb7c476ec1d5200c3"
          gzip -dc /tmp/aw3c-incremental.patch.gz > /tmp/aw3c-incremental.patch
          git apply /tmp/aw3c-incremental.patch
          test "$(sha256sum .aw3c-transport/testfix.patch.gz.b64 | cut -d' ' -f1)" = "ae0b74f1342536b209d2ebdaf505dd55b13dc5212b3a142ac15595a269951581"
          base64 -d .aw3c-transport/testfix.patch.gz.b64 > /tmp/aw3c-testfix.patch.gz
          test "$(sha256sum /tmp/aw3c-testfix.patch.gz | cut -d' ' -f1)" = "4078b696a930c821807bf8ec2c07651ea19dc5d3af1a9772b1c4916cea84d9f7"
          gzip -dc /tmp/aw3c-testfix.patch.gz > /tmp/aw3c-testfix.patch
          git apply /tmp/aw3c-testfix.patch
          sha256sum -c .aw3c-transport/final.sha256
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository script tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:scripts 2>&1 | tee /tmp/aw3c-script.log

      - name: Upload script-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aw3c-script-evidence-${{ github.run_id }}
          path: /tmp/aw3c-script.log
          if-no-files-found: error
          retention-days: 1
