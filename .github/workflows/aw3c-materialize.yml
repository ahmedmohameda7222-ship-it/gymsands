name: AW-3C Deterministic Preflight

on:
  pull_request:
    branches:
      - feat/active-workout-aw3b-structured-set-details
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: aw3c-deterministic-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_USE_MOCK_AUTH: "true"
      PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
      PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
      PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
      PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
      PLAIVRA_RELEASE_ENVIRONMENT: ci
      PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: "2"
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PLAIVRA_AW2A_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw3c-prescription-snapshots
          fetch-depth: 0

      - name: Materialize checksum-bound permanent tree
        shell: bash
        run: |
          set -euo pipefail
          cat .aw3c-transport/part00 .aw3c-transport/part01 .aw3c-transport/part02 .aw3c-transport/part03 .aw3c-transport/part04 .aw3c-transport/part05 .aw3c-transport/part06 .aw3c-transport/part07 > /tmp/aw3c-old.b64
          test "$(sha256sum /tmp/aw3c-old.b64 | cut -d' ' -f1)" = "af65dfa4f9f658782f7215eb9961767e2e15e760cbb0e390b5890aa5b787dbe8"
          base64 -d /tmp/aw3c-old.b64 > /tmp/aw3c-old.tar.gz
          test "$(sha256sum /tmp/aw3c-old.tar.gz | cut -d' ' -f1)" = "646fe5036900afd0de3bf1567d0796d303a415ec322ab17d70c7c62743390ce1"
          tar -xzf /tmp/aw3c-old.tar.gz
          rm -rf .aw3c-bundle
          mv aw3c-bundle .aw3c-bundle

          test "$(sha256sum .aw3c-transport/corrected-apply.py.gz.b64 | cut -d' ' -f1)" = "a709137090139cd82cab806e3ba8cb63864f89dc18b1d43e1de99ec5ac8a238d"
          base64 -d .aw3c-transport/corrected-apply.py.gz.b64 > /tmp/corrected-apply.py.gz
          test "$(sha256sum /tmp/corrected-apply.py.gz | cut -d' ' -f1)" = "888e0bfb1d4971f01a93b918d0df57bc2b6aeaaa91505df55206046c07b3ad6a"
          gzip -dc /tmp/corrected-apply.py.gz > .aw3c-bundle/apply.py
          python .aw3c-bundle/apply.py

          test "$(sha256sum .aw3c-transport/incremental.patch.gz.b64 | cut -d' ' -f1)" = "b4aba1f7cc4e94a890c6d59c524374959cbd0c3cf44f728787d5e307aee9357f"
          base64 -d .aw3c-transport/incremental.patch.gz.b64 > /tmp/aw3c-incremental.patch.gz
          test "$(sha256sum /tmp/aw3c-incremental.patch.gz | cut -d' ' -f1)" = "19f3490caa492bcb585a40ca6fa5dade4c8e26a1ea15284fb7c476ec1d5200c3"
          gzip -dc /tmp/aw3c-incremental.patch.gz > /tmp/aw3c-incremental.patch
          git apply --check /tmp/aw3c-incremental.patch
          git apply /tmp/aw3c-incremental.patch

          test "$(sha256sum .aw3c-transport/testfix.patch.gz.b64 | cut -d' ' -f1)" = "ae0b74f1342536b209d2ebdaf505dd55b13dc5212b3a142ac15595a269951581"
          base64 -d .aw3c-transport/testfix.patch.gz.b64 > /tmp/aw3c-testfix.patch.gz
          test "$(sha256sum /tmp/aw3c-testfix.patch.gz | cut -d' ' -f1)" = "4078b696a930c821807bf8ec2c07651ea19dc5d3af1a9772b1c4916cea84d9f7"
          gzip -dc /tmp/aw3c-testfix.patch.gz > /tmp/aw3c-testfix.patch
          git apply --check /tmp/aw3c-testfix.patch
          git apply /tmp/aw3c-testfix.patch

          test "$(sha256sum .aw3c-transport/scriptfix.patch.gz.b64 | cut -d' ' -f1)" = "4230dcbc33806d21b0ae644856443de159bd7d5c57083b01d34391ce32e7673e"
          base64 -d .aw3c-transport/scriptfix.patch.gz.b64 > /tmp/aw3c-scriptfix.patch.gz
          test "$(sha256sum /tmp/aw3c-scriptfix.patch.gz | cut -d' ' -f1)" = "d7182b4094fdbcda067a63a26b6ce9ce2887718666482ffaa74062fb061d8698"
          gzip -dc /tmp/aw3c-scriptfix.patch.gz > /tmp/aw3c-scriptfix.patch
          git apply --check /tmp/aw3c-scriptfix.patch
          git apply /tmp/aw3c-scriptfix.patch

          sha256sum -c .aw3c-transport/final.sha256
          git diff --check
          git add -A
          git diff --cached --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Establish diagnostic build identity
        shell: bash
        run: |
          set -euo pipefail
          build_timestamp="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          {
            echo "PLAIVRA_COMMIT_SHA=$(git rev-parse HEAD)"
            echo "PLAIVRA_BUILD_TIMESTAMP=$build_timestamp"
            echo "PLAIVRA_QUALITY_BUILD_TIMESTAMP=$build_timestamp"
          } >> "$GITHUB_ENV"
          node scripts/quality-ledger-target.mjs >> "$GITHUB_ENV"

      - name: Run complete AW-3C preflight
        shell: bash
        run: |
          set -o pipefail
          test "$(sha256sum .aw3c-transport/preflight.sh.gz.b64 | cut -d' ' -f1)" = "340c1fabc35a77cd0485800dc6c8fd142ad061ce54efa571a45eedcd420f88a0"
          base64 -d .aw3c-transport/preflight.sh.gz.b64 > /tmp/aw3c-preflight.sh.gz
          test "$(sha256sum /tmp/aw3c-preflight.sh.gz | cut -d' ' -f1)" = "31c7407d699ad7d2a86e5e8530214e1cbe4dbbc12e2d734720e01061d3926e69"
          gzip -dc /tmp/aw3c-preflight.sh.gz > /tmp/aw3c-preflight.sh
          test "$(sha256sum /tmp/aw3c-preflight.sh | cut -d' ' -f1)" = "2098547ad049e4c23cc57b7b1685bfcf1ebfb2ebae55047b5d30ba65d22305cf"
          bash /tmp/aw3c-preflight.sh 2>&1 | tee /tmp/aw3c-preflight.log

      - name: Upload preflight failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aw3c-preflight-failure-${{ github.run_id }}
          path: |
            /tmp/aw3c-preflight.log
            /tmp/aw3c-database-validation.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit permanent validated tree
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c .aw3c-transport/final.sha256
          rm -rf .aw3c-transport .aw3c-bundle
          test ! -e .github/workflows/aw3c-materialize.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(workouts): implement AW-3C immutable prescription snapshots'
          git push origin HEAD:feat/active-workout-aw3c-prescription-snapshots
