name: AW-3C Permanent Tree Materialization

on:
  pull_request:
    branches:
      - feat/active-workout-aw3b-structured-set-details
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: aw3c-permanent-materialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-permanent-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw3c-prescription-snapshots
          fetch-depth: 0

      - name: Materialize checksum-bound AW-3C tree
        shell: bash
        run: |
          set -euo pipefail
          cat .aw3c-transport/part00 .aw3c-transport/part01 .aw3c-transport/part02 .aw3c-transport/part03 .aw3c-transport/part04 .aw3c-transport/part05 .aw3c-transport/part06 .aw3c-transport/part07 > /tmp/aw3c-old.b64
          test "$(sha256sum /tmp/aw3c-old.b64 | cut -d' ' -f1)" = "af65dfa4f9f658782f7215eb9961767e2e15e760cbb0e390b5890aa5b787dbe8"
          base64 -d /tmp/aw3c-old.b64 > /tmp/aw3c-old.tar.gz
          test "$(sha256sum /tmp/aw3c-old.tar.gz | cut -d' ' -f1)" = "646fe5036900afd0de3bf1567d0796d303a415ec322ab17d70c7c62743390ce1"
          tar -xzf /tmp/aw3c-old.tar.gz
          rm -rf .aw3c-bundle
          mv aw3c-bundle .aw3c-bundle

          test "$(sha256sum .aw3c-transport/corrected-apply.py.gz.b64 | cut -d' ' -f1)" = "a709137090139cd82cab806e3ba8cb63864f89dc18b1d43e1de99ec5ac8a238d"
          base64 -d .aw3c-transport/corrected-apply.py.gz.b64 > /tmp/corrected-apply.py.gz
          test "$(sha256sum /tmp/corrected-apply.py.gz | cut -d' ' -f1)" = "888e0bfb1d4971f01a93b918d0df57bc2b6aeaaa91505df55206046c07b3ad6a"
          gzip -dc /tmp/corrected-apply.py.gz > .aw3c-bundle/apply.py
          python .aw3c-bundle/apply.py

          for patch in incremental testfix scriptfix markerfix functionfix; do
            base64 -d ".aw3c-transport/${patch}.patch.gz.b64" > "/tmp/aw3c-${patch}.patch.gz"
            gzip -dc "/tmp/aw3c-${patch}.patch.gz" > "/tmp/aw3c-${patch}.patch"
            git apply --check "/tmp/aw3c-${patch}.patch"
            git apply "/tmp/aw3c-${patch}.patch"
          done

          sha256sum -c .aw3c-transport/final.sha256

      - name: Correct the future-phase AW-3B verification boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/verification/active-workout-aw3b-structured-set-details.sql')
          text = path.read_text(encoding='utf-8')
          old = """  select migration_version into strict v_marker from public.release_schema_compatibility where singleton=true;\n  if v_marker<>'20260722161542' then\n    raise exception 'AW-3B compatibility marker differs from the released AW-3A baseline.';\n  end if;\n"""
          if old not in text:
              raise SystemExit('Expected stale AW-3B post-chain marker assertion was not found.')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit the permanent AW-3C implementation tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aw3c-transport .aw3c-bundle
          ! grep -qx '__PLACEHOLDER__' supabase/migrations/20260725013000_active_workout_aw3c_immutable_prescription_snapshots.sql
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(workouts): materialize AW-3C immutable prescription snapshots'
          git push origin HEAD:feat/active-workout-aw3c-prescription-snapshots
