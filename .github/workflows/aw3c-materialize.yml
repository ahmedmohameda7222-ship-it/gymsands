name: AW-3C checkout capture

on:
  pull_request:
    branches:
      - feat/active-workout-aw3b-structured-set-details
    types:
      - synchronize

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw3c-prescription-snapshots
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: aw3c-branch-checkout-${{ github.event.pull_request.head.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
