name: AW-3C deterministic materialization

on:
  push:
    branches:
      - feat/active-workout-aw3c-prescription-snapshots

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw3c-prescription-snapshots
          fetch-depth: 0
      - name: Materialize reviewed AW-3C patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/aw3c-bundle.b64 <<'B64'
[... ELLIPSIZATION ...]
B64
          base64 -d /tmp/aw3c-bundle.b64 > /tmp/aw3c-bundle.tar.gz
          tar -xzf /tmp/aw3c-bundle.tar.gz
          python .aw3c-bundle/apply.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(workouts): implement AW-3C immutable prescription snapshots'
          git push origin HEAD:feat/active-workout-aw3c-prescription-snapshots
