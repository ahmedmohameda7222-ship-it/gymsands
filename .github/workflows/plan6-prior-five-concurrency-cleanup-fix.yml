name: Plan 6 Prior Five Concurrency Cleanup Fix

on:
  push:
    branches:
      - feat/food-catalog-governance-plan6

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.head_commit.message == 'chore(plan6): stage final P1 green finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Make prior-five concurrency fixture cleanup repeatable and self-remove
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-food-catalog-governance-plan6-concurrency.mjs')
          s=p.read_text()
          needle="    truncate table public.food_items cascade;\n    delete from public.food_catalog_governance_capability_assignments"
          replacement="    truncate table public.food_items cascade;\n    delete from public.account_deletion_jobs where id='6a000000-0000-4000-8000-000000000812';\n    delete from public.food_catalog_governance_capability_assignments"
          if "account_deletion_jobs where id='6a000000-0000-4000-8000-000000000812'" not in s:
              if s.count(needle) != 1:
                  raise SystemExit(f'expected one prior-five cleanup marker, found {s.count(needle)}')
              p.write_text(s.replace(needle,replacement,1))
          PY
          rm -f .github/workflows/plan6-prior-five-concurrency-cleanup-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(plan6): stage final P1 green finalizer"
          git push origin HEAD:feat/food-catalog-governance-plan6
