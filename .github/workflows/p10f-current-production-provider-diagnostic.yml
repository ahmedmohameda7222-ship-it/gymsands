name: P10F Current Production Provider Diagnostic
run-name: P10F Current Production Provider Diagnostic / ${{ github.sha }}

on:
  push:
    branches:
      - fix/activity-catalog-v2-runtime-cutover

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PLAIVRA_PRODUCTION_URL: https://app.plaivra.com
      PLAIVRA_SMOKE_POPULATED_EMAIL: ${{ secrets.PLAIVRA_SMOKE_POPULATED_EMAIL }}
      PLAIVRA_SMOKE_POPULATED_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_POPULATED_PASSWORD }}
      PLAIVRA_P10F_DIAGNOSTIC_OUTPUT: p10f-current-production-library.json
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Deterministic dependency install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Read-only current Production provider diagnostic
        run: node scripts/diagnose-p10f-current-production-library.mjs
      - name: Verify exact head and no repository mutation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload sanitized provider evidence
        uses: actions/upload-artifact@v4
        with:
          name: p10f-current-production-provider-${{ github.sha }}
          path: p10f-current-production-library.json
          if-no-files-found: error
          retention-days: 30
