name: Train QA Autosave Fixture Materialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: train-qa-autosave-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Materialize deterministic owner lookup fixture
        run: |
          python scripts/materialize-train-qa-autosave-fixture.py
          node --check scripts/run-train-layout-qa.mjs

      - name: Create exact source blob
        shell: bash
        run: |
          set -euo pipefail
          base64 -w0 scripts/run-train-layout-qa.mjs > /tmp/source.b64
          jq -n --rawfile content /tmp/source.b64 '{content:$content,encoding:"base64"}' > /tmp/blob-request.json
          sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob-request.json --jq .sha)"
          printf 'scripts/run-train-layout-qa.mjs=%s\n' "$sha" > /tmp/blobs.txt

      - name: Upload materialized source evidence
        uses: actions/upload-artifact@v4
        with:
          name: train-qa-autosave-fixture-${{ github.event.pull_request.head.sha }}
          path: |
            scripts/run-train-layout-qa.mjs
            /tmp/blobs.txt
          if-no-files-found: error
          retention-days: 1
