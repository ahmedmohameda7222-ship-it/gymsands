name: Active Workout Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/active-workout-full-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded typecheck repairs
        run: node scripts/repair-active-workout-typecheck.mjs
      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "plaivra-implementation"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git commit -m "Repair Active Workout integration contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
