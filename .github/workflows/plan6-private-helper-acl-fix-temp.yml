name: Plan 6 Private Helper ACL Fix Temp
on:
  push:
    branches:
      - feat/food-catalog-governance-plan6
    paths:
      - .github/workflows/plan6-private-helper-acl-fix-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Lock down Plan 6 private helpers and verifier
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const migrationPath = 'supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql';
          let migration = fs.readFileSync(migrationPath, 'utf8');
          const migrationAnchor = `do $do$\ndeclare r record;\nbegin\n  for r in select p.oid::regprocedure as signature from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'`;
          if (!migration.includes(migrationAnchor)) throw new Error('Plan 6 public ACL anchor missing.');
          const privateAcl = `do $private_acl$\ndeclare r record;\nbegin\n  for r in\n    select p.oid::regprocedure as signature\n    from pg_proc p\n    join pg_namespace n on n.oid=p.pronamespace\n    where n.nspname='private'\n      and (\n        p.proname like 'food_catalog_governance_%'\n        or p.proname in ('food_catalog_change_lifecycle','reject_food_catalog_governance_immutable_mutation')\n      )\n  loop\n    execute format('revoke all on function %s from public, anon, authenticated, service_role',r.signature);\n  end loop;\nend\n$private_acl$;\n\n`;
          migration = migration.replace(migrationAnchor, privateAcl + migrationAnchor);
          fs.writeFileSync(migrationPath, migration);

          const verifierPath = 'supabase/verification/food-catalog-governance-control-plane.sql';
          let verifier = fs.readFileSync(verifierPath, 'utf8');
          const verifierAnchor = `-- Database-owner fixtures. Runtime application roles cannot perform these direct inserts.`;
          if (!verifier.includes(verifierAnchor)) throw new Error('Plan 6 verifier fixture anchor missing.');
          const verifierBlock = `do $private_acl$\ndeclare r record;\nbegin\n  for r in\n    select p.oid as function_oid, p.oid::regprocedure as signature\n    from pg_proc p\n    join pg_namespace n on n.oid=p.pronamespace\n    where n.nspname='private'\n      and (\n        p.proname like 'food_catalog_governance_%'\n        or p.proname in ('food_catalog_change_lifecycle','reject_food_catalog_governance_immutable_mutation')\n      )\n  loop\n    perform pg_temp.plan6_assert(\n      not has_function_privilege('anon',r.function_oid,'EXECUTE')\n      and not has_function_privilege('authenticated',r.function_oid,'EXECUTE')\n      and not has_function_privilege('service_role',r.function_oid,'EXECUTE'),\n      'Plan 6 private helper executable by application role: '||r.signature::text\n    );\n  end loop;\nend\n$private_acl$;\n\n`;
          verifier = verifier.replace(verifierAnchor, verifierBlock + verifierAnchor);
          fs.writeFileSync(verifierPath, verifier);
          NODE
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql supabase/verification/food-catalog-governance-control-plane.sql
          git commit -m "fix: lock down Plan 6 private governance helpers"
          git push origin HEAD:feat/food-catalog-governance-plan6
