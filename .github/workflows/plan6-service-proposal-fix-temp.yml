name: Plan 6 Service Proposal Fix Temp
on:
  push:
    branches:
      - feat/food-catalog-governance-plan6
    paths:
      - .github/workflows/plan6-service-proposal-fix-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct Service proposal migration dependency order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql';
          let sql = fs.readFileSync(path, 'utf8');
          const start = sql.indexOf('\ncreate table public.food_catalog_service_proposals (');
          if (start < 0) throw new Error('Service proposal table block missing.');
          const endMarker = 'create index food_catalog_service_proposals_food_idx on public.food_catalog_service_proposals(food_id,created_at,id);\n';
          const end = sql.indexOf(endMarker, start);
          if (end < 0) throw new Error('Service proposal table block terminator missing.');
          const blockEnd = end + endMarker.length;
          const block = sql.slice(start, blockEnd);
          sql = sql.slice(0, start) + sql.slice(blockEnd);
          const auditAnchor = '\ncreate table public.food_catalog_governance_audit_events (';
          const auditIndex = sql.indexOf(auditAnchor);
          if (auditIndex < 0) throw new Error('Governance audit table anchor missing.');
          sql = sql.slice(0, auditIndex) + block + '\n' + sql.slice(auditIndex);
          const operationsIndex = sql.indexOf('create table public.food_catalog_governance_operations (');
          const proposalIndex = sql.indexOf('create table public.food_catalog_service_proposals (');
          if (operationsIndex < 0 || proposalIndex <= operationsIndex) throw new Error('Service proposal table still precedes operations authority.');
          fs.writeFileSync(path, sql);
          NODE
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql
          git commit -m "fix: order Service proposal after operation authority"
          git push origin HEAD:feat/food-catalog-governance-plan6
