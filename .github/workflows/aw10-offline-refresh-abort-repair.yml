name: AW10 Offline Refresh Abort Classification Repair

on:
  push:
    branches:
      - feat/active-workout-full-implementation
    paths:
      - .github/workflows/aw10-offline-refresh-abort-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - name: Repair exact AW10 classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-aw10-active-workout-closure-qa.mjs')
          text = path.read_text()
          start_marker = '  const unexpectedRequests = failedRequests.filter((item) => !('
          end_marker = '  if (unexpectedRequests.length)'
          if text.count(start_marker) != 1:
              raise SystemExit(f'expected one AW10 baseline classifier start, found {text.count(start_marker)}')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = "\n".join([
              '  const unexpectedRequests = failedRequests.filter((item) => {',
              '    if (item.error !== "net::ERR_ABORTED") return true;',
              '    const url = new URL(item.url);',
              '    if (url.searchParams.has("_rsc")) return false;',
              '    if (scenario.action !== "offline-refresh") return true;',
              '    return !(',
              '      url.pathname === "/api/workouts/active/previous-performance"',
              '      || /^\\/api\\/workouts\\/sessions\\/[^/]+\\/muscle-analysis$/.test(url.pathname)',
              '    );',
              '  });',
              ''
          ])
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit clean result
        shell: bash
        run: |
          rm .github/workflows/aw10-offline-refresh-abort-repair.yml
          git config user.name "Plaivra Repository Delivery"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/run-aw10-active-workout-closure-qa.mjs .github/workflows/aw10-offline-refresh-abort-repair.yml
          git commit -m "test: classify intentional offline refresh aborts"
          git push origin HEAD:feat/active-workout-full-implementation
