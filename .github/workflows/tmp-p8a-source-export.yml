name: Temporary P8A Source Export

on:
  push:
    branches:
      - feat/p8a-single-workout-pdf-report
    paths:
      - .github/workflows/tmp-p8a-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify expected correction baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8a2c08c3e43e756b7cdfeef8f4422ad84c4273ee"
      - name: Archive exact checkout
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/p8a-source-${GITHUB_SHA}.tar.gz .
      - name: Upload exact checkout
        uses: actions/upload-artifact@v4
        with:
          name: temporary-p8a-source-${{ github.sha }}
          path: /tmp/p8a-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
