name: Temporary Nutrition Cooking Auth Correction

on:
  push:
    branches:
      - feat/nutrition-v1-implementation
    paths:
      - .github/workflows/tmp-nutrition-cooking-auth-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nutrition-v1-implementation
          fetch-depth: 0

      - name: Verify bounded lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2609aaeaf60fc58cdca558aff6dd643f3231ed77"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Confirm focused RED
        run: |
          set +e
          ./node_modules/.bin/vitest run lib/product/nutrition-v1-rendered-qa-auth.test.ts > /tmp/nutrition-qa-owner-red.log 2>&1
          code=$?
          set -e
          cat /tmp/nutrition-qa-owner-red.log
          if [ "$code" -eq 0 ]; then
            echo "Expected owner-scoped rendered-QA cooking fixture contract to be RED before implementation." >&2
            exit 1
          fi
          grep -q "seeds Cooking rendered-QA recovery only under the authenticated owner scope" /tmp/nutrition-qa-owner-red.log

      - name: Apply bounded rendered-QA fixture correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/run-nutrition-v1-qa.mjs")
          text = path.read_text()
          old = 'plaivra:nutrition:cooking:${recipeId}:active'
          new = 'plaivra:nutrition:cooking:${mockAuthUserId}:${recipeId}:active'
          if text.count(old) != 1:
            raise SystemExit(f"Expected one legacy rendered-QA cooking key, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- scripts/run-nutrition-v1-qa.mjs

      - name: Focused GREEN
        run: ./node_modules/.bin/vitest run lib/product/nutrition-v1-rendered-qa-auth.test.ts

      - name: Syntax check
        run: node --check scripts/run-nutrition-v1-qa.mjs

      - name: Repository script contracts
        run: npm run test:scripts

      - name: Commit verified QA correction
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain | grep -v '^ M scripts/run-nutrition-v1-qa.mjs$')"
          git config user.name "Plaivra Implementation Engineer"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/run-nutrition-v1-qa.mjs
          git commit -m "fix(nutrition): scope rendered cooking fixture by owner"
          git push origin HEAD:feat/nutrition-v1-implementation
