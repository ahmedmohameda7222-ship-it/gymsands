name: Temporary Nutrition SQL Repair

on:
  push:
    branches:
      - feat/nutrition-v1-implementation
    paths:
      - .github/workflows/tmp-nutrition-review-db-diagnostics.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_USE_MOCK_AUTH: true
      PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
      PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
      PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
      PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
      PLAIVRA_RELEASE_ENVIRONMENT: ci
      PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: 2
      PLAIVRA_ACTIVITY_CATALOG_MODE: library_v2_with_legacy_fallback
      PLAIVRA_ACTIVITY_CATALOG_BASE_URL: https://plaivra-activity-catalog-api.vercel.app
      PLAIVRA_ACTIVITY_CATALOG_API_KEY: ci-placeholder-catalog-key-long-enough
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nutrition-v1-implementation
          fetch-depth: 0

      - name: Verify RED regression lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 58cb5e257b5e73be2a1258a159a98b4395f55f43 HEAD
          test "$(git merge-base HEAD origin/main)" = "b00b8205ed87aa53b7e76731f99156d58e989d0f"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Convert escaped line separators to executable SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('supabase/migrations/20260827060000_nutrition_v1_review_atomicity_corrections.sql'),
              Path('supabase/verification/nutrition-v1-review-atomicity.sql'),
          ]
          for path in paths:
              text = path.read_text()
              escaped = text.count('\\n')
              real = text.count('\n')
              if escaped <= 50 or real > 1:
                  raise SystemExit(f'{path}: unexpected pre-repair shape escaped={escaped} real={real}')
              repaired = text.replace('\\n', '\n')
              if repaired.count('\n') <= 50 or '\\ncreate or replace function' in repaired.lower():
                  raise SystemExit(f'{path}: repair did not produce executable multiline SQL')
              path.write_text(repaired)
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "supabase/migrations/20260827060000_nutrition_v1_review_atomicity_corrections.sql"
          test "${changed[1]}" = "supabase/verification/nutrition-v1-review-atomicity.sql"

      - name: Focused GREEN regression
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vitest run --config vitest.unit.config.mjs \
            lib/product/nutrition-v1-review-atomicity-migration.test.ts \
            lib/product/nutrition-v1-review-corrections.test.ts \
            services/nutrition-v1/server/review-corrections.test.ts

      - name: Migration ledger precheck
        run: npm run migration:ledger:check

      - name: Chronological disposable migration replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          node scripts/replay-local-migration-chain.mjs --log ci-reports/database-validation.log --prove-future-order

      - name: Supabase DB lint
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Database verification
        run: node scripts/run-database-verification.mjs

      - name: Migration ledger postcheck
        run: npm run migration:ledger:check

      - name: Commit executable SQL repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260827060000_nutrition_v1_review_atomicity_corrections.sql \
            supabase/verification/nutrition-v1-review-atomicity.sql
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "fix(nutrition): make atomicity SQL executable"
          git push origin HEAD:feat/nutrition-v1-implementation
