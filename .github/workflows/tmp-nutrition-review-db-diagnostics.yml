name: Temporary Nutrition Review Correction Finalizer

on:
  push:
    branches:
      - feat/nutrition-v1-implementation
    paths:
      - .github/workflows/tmp-nutrition-review-db-diagnostics.yml

permissions:
  contents: write

jobs:
  finalize-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_USE_MOCK_AUTH: true
      PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
      PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
      PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
      PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
      PLAIVRA_RELEASE_ENVIRONMENT: ci
      PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: 2
      PLAIVRA_ACTIVITY_CATALOG_MODE: library_v2_with_legacy_fallback
      PLAIVRA_ACTIVITY_CATALOG_BASE_URL: https://plaivra-activity-catalog-api.vercel.app
      PLAIVRA_ACTIVITY_CATALOG_API_KEY: ci-placeholder-catalog-key-long-enough
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nutrition-v1-implementation
          fetch-depth: 0

      - name: Verify bounded RED lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 10ae048b48661ceca12621418508ef1073c0bf95 HEAD
          test "$(git merge-base HEAD origin/main)" = "b00b8205ed87aa53b7e76731f99156d58e989d0f"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Reuse exact staged GREEN patch and reconcile documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tmp-nutrition-review-corrections.yml')
          lines = path.read_text().splitlines()
          name_index = next(i for i, line in enumerate(lines) if line.strip() == '- name: Apply bounded GREEN corrections')
          run_index = next(i for i in range(name_index + 1, len(lines)) if lines[i].strip() == 'run: |')
          body = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:') or line.startswith('      - uses:'):
                  break
              if line.startswith('          '):
                  line = line[10:]
              body.append(line)
          script = '\n'.join(body) + '\n'
          if '20260827060000_nutrition_v1_review_atomicity_corrections.sql' not in script:
              raise SystemExit('Failed to extract exact staged GREEN patch block')
          Path('/tmp/apply-green.sh').write_text(script)
          PY
          bash /tmp/apply-green.sh
          python3 - <<'PY'
          from pathlib import Path

          doc_path = Path('docs/architecture/migration-ledger-reconciliation.md')
          text = doc_path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'reconciliation doc expected one replacement, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          replace_once(
              '**Status:** Applied Production history reconciled; twelve repository migrations intentionally pending',
              '**Status:** Applied Production history reconciled; thirteen repository migrations intentionally pending',
          )
          replace_once('- Repository-only pending migrations: **12**', '- Repository-only pending migrations: **13**')
          replace_once('- `pendingCount = 12`', '- `pendingCount = 13`')
          replace_once('- `unresolvedCount = 12`', '- `unresolvedCount = 13`')
          replace_once(
              'Nutrition V1 Meal Plan week-start authority migration `20260825120350_nutrition_v1_meal_plan_week_start_authority.sql`, and Nutrition V1 privacy-purge authority migration `20260825120400_nutrition_v1_privacy_purge_authority.sql` are intentionally classified `pending`.',
              'Nutrition V1 Meal Plan week-start authority migration `20260825120350_nutrition_v1_meal_plan_week_start_authority.sql`, Nutrition V1 privacy-purge authority migration `20260825120400_nutrition_v1_privacy_purge_authority.sql`, and Nutrition V1 review atomicity correction migration `20260827060000_nutrition_v1_review_atomicity_corrections.sql` are intentionally classified `pending`.',
          )
          marker = '## Authority and verification\n'
          section = '''## Nutrition V1 review atomicity correction pending migration authority\n\n- `20260827060000_nutrition_v1_review_atomicity_corrections.sql` is the additive transactional authority for owner-derived Cooking Session synchronization and Recipe Working Draft autosave introduced by the final Nutrition V1 review correction.\n- Ledger state: `pending`; Production version/name: intentionally absent.\n- It adds SECURITY DEFINER RPCs with fixed search paths and authenticated/service-role execution only; it was validated by chronological replay, DB lint, and executable rollback verification before Production application.\n- Do not replay or apply it before explicit Product Owner/Planner approval of the Nutrition V1 migration sequence.\n\n'''
          if marker not in text:
              raise SystemExit('reconciliation doc authority marker missing')
          text = text.replace(marker, section + marker, 1)
          doc_path.write_text(text)
          PY
          git diff --check

      - name: Enforce bounded correction diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf '%s\n' "${changed[@]}"
          allowed='^(components/nutrition/cooking/cooking-mode\.tsx|components/nutrition/diary/logging-session\.tsx|docs/architecture/migration-ledger-reconciliation\.md|lib/nutrition-v1/cooking-local-store\.ts|services/nutrition-v1/server/(cooking-sessions|cooking-sessions\.test|food-library|recipes|recipes\.test)\.ts|scripts/run-database-verification\.mjs|supabase/migration-ledger\.json|supabase/migrations/20260827060000_nutrition_v1_review_atomicity_corrections\.sql|supabase/verification/nutrition-v1-review-atomicity\.sql)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected correction path: $path"; exit 1; }
          done

      - name: Focused GREEN unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vitest run --config vitest.unit.config.mjs \
            lib/product/nutrition-v1-review-corrections.test.ts \
            services/nutrition-v1/server/review-corrections.test.ts \
            lib/product/nutrition-v1-review-atomicity-migration.test.ts \
            lib/nutrition-v1/cooking-local-store.test.ts \
            services/nutrition-v1/server/cooking-sessions.test.ts \
            services/nutrition-v1/server/recipes.test.ts \
            services/nutrition-v1/server/food-library.test.ts

      - name: Lint and typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck

      - name: Migration ledger precheck
        shell: bash
        run: |
          set -euo pipefail
          npm run migration:ledger:check

      - name: Chronological disposable migration replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          node scripts/replay-local-migration-chain.mjs --log ci-reports/database-validation.log --prove-future-order

      - name: Supabase DB lint
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --schema public --level error --fail-on error

      - name: Database verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-database-verification.mjs

      - name: Migration ledger postcheck
        shell: bash
        run: |
          set -euo pipefail
          npm run migration:ledger:check

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/nutrition/cooking/cooking-mode.tsx \
            components/nutrition/diary/logging-session.tsx \
            docs/architecture/migration-ledger-reconciliation.md \
            lib/nutrition-v1/cooking-local-store.ts \
            services/nutrition-v1/server/cooking-sessions.ts \
            services/nutrition-v1/server/cooking-sessions.test.ts \
            services/nutrition-v1/server/food-library.ts \
            services/nutrition-v1/server/recipes.ts \
            services/nutrition-v1/server/recipes.test.ts \
            scripts/run-database-verification.mjs \
            supabase/migration-ledger.json \
            supabase/migrations/20260827060000_nutrition_v1_review_atomicity_corrections.sql \
            supabase/verification/nutrition-v1-review-atomicity.sql
          git diff --cached --check
          git commit -m "fix(nutrition): resolve review privacy and atomicity blockers"
          git push origin HEAD:feat/nutrition-v1-implementation
