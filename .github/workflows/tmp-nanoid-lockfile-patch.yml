name: Temporary NanoID Lockfile Patch Validation

on:
  push:
    branches:
      - ci/production-dependency-audit-isolation
    paths:
      - .github/workflows/tmp-nanoid-lockfile-patch.yml

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/production-dependency-audit-isolation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact reviewed starting identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "d8a6d757425163683b98f3f546749aeffe003bb8"
          test "$(git merge-base HEAD origin/main)" = "d8a6d757425163683b98f3f546749aeffe003bb8"
          git merge-base --is-ancestor 991d4fec7958bc25520c00ea3716ca2932a45f55 HEAD
          test "$(git diff --name-only 991d4fec7958bc25520c00ea3716ca2932a45f55...HEAD)" = ".github/workflows/tmp-nanoid-lockfile-patch.yml"
          git diff --exit-code d8a6d757425163683b98f3f546749aeffe003bb8 -- package.json

      - name: Generate exact NanoID lockfile patch with npm
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          npm update nanoid@3.3.17 --package-lock-only --ignore-scripts

      - name: Reject unrelated lockfile drift
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const allowed = 'packages.node_modules/nanoid';
          const diffs = [];
          function walk(a, b, path = '') {
            if (path === allowed) return;
            if (Object.is(a, b)) return;
            if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') {
              diffs.push(path || '<root>');
              return;
            }
            const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
            for (const key of [...keys].sort()) {
              const next = path ? `${path}.${key}` : key;
              if (!(key in a) || !(key in b)) {
                if (next !== allowed) diffs.push(next);
                continue;
              }
              walk(a[key], b[key], next);
            }
          }
          walk(before, after);
          if (diffs.length) {
            console.error('Unexpected semantic lockfile drift:', diffs);
            process.exit(1);
          }
          const oldNode = before.packages?.['node_modules/nanoid'];
          const newNode = after.packages?.['node_modules/nanoid'];
          if (oldNode?.version !== '3.3.16') throw new Error(`Expected prior nanoid 3.3.16, got ${oldNode?.version}`);
          if (newNode?.version !== '3.3.17') throw new Error(`Expected final nanoid 3.3.17, got ${newNode?.version}`);
          if (!String(newNode?.resolved || '').startsWith('https://registry.npmjs.org/nanoid/-/nanoid-3.3.17.tgz')) throw new Error('NanoID resolved URL is not official npm registry 3.3.17 tarball');
          if (!newNode?.integrity) throw new Error('NanoID 3.3.17 registry integrity is missing');
          if (after.packages?.['']?.dependencies?.nanoid || after.packages?.['']?.devDependencies?.nanoid) throw new Error('Root NanoID dependency was added');
          if (after.packages?.['node_modules/next']?.version !== '16.2.11') throw new Error('Next version changed');
          if (after.packages?.['node_modules/postcss']?.version !== '8.5.23') throw new Error('PostCSS version changed');
          console.log(JSON.stringify({oldNanoid: oldNode.version, newNanoid: newNode.version, next: after.packages['node_modules/next'].version, postcss: after.packages['node_modules/postcss'].version, unrelatedSemanticDrift: diffs.length}));
          NODE
          git diff -- package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Prove dependency identity
        shell: bash
        run: |
          set -euo pipefail
          npm ls nanoid postcss next --all
          npm ls nanoid --omit=dev --all --json > /tmp/nanoid-production-tree.json
          node <<'NODE'
          const fs = require('node:fs');
          const tree = JSON.parse(fs.readFileSync('/tmp/nanoid-production-tree.json', 'utf8'));
          const versions = [];
          function visit(node) {
            if (!node || typeof node !== 'object') return;
            if (node.dependencies?.nanoid?.version) versions.push(node.dependencies.nanoid.version);
            for (const dep of Object.values(node.dependencies || {})) visit(dep);
          }
          visit(tree);
          if (!versions.includes('3.3.17')) throw new Error(`Production NanoID 3.3.17 missing: ${versions.join(',')}`);
          if (versions.some(v => v === '3.3.16' || /^3\.3\.(?:[0-9]|1[0-6])$/.test(v))) throw new Error(`Vulnerable Production NanoID remains: ${versions.join(',')}`);
          console.log(`Production NanoID versions: ${[...new Set(versions)].join(', ')}`);
          NODE

      - name: Corrected Production lockfile audit
        run: npm audit --package-lock-only --omit=dev --audit-level=moderate

      - name: Script contracts
        run: npm run test:scripts

      - name: Telemetry contracts
        run: npm run test:telemetry

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        env:
          NEXT_PUBLIC_USE_MOCK_AUTH: "false"
        run: npm run build

      - name: Final bounded diff proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code d8a6d757425163683b98f3f546749aeffe003bb8 -- package.json
          test "$(node -p "require('./package-lock.json').packages['node_modules/next'].version")" = "16.2.11"
          test "$(node -p "require('./package-lock.json').packages['node_modules/postcss'].version")" = "8.5.23"
          test "$(node -p "require('./package-lock.json').packages['node_modules/nanoid'].version")" = "3.3.17"
          changed=$(git diff --name-only)
          test "$changed" = "package-lock.json"

      - name: Upload validated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: validated-nanoid-3.3.17-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
