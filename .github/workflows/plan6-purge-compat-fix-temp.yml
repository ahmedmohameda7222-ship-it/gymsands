name: Plan 6 Purge Compatibility Fix Temp
on:
  push:
    branches:
      - feat/food-catalog-governance-plan6
    paths:
      - .github/workflows/plan6-purge-compat-fix-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve Nutrition purge authority while extending Plan 6
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const migrationPath = 'supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql';
          let migration = fs.readFileSync(migrationPath, 'utf8');
          const oldBlock = `-- Extend the canonical Nutrition account-deletion lifecycle to Plan 6 personal overrides.\nalter function public.purge_account_application_data_atomic(uuid) set schema private;\nalter function private.purge_account_application_data_atomic(uuid)\n  rename to food_catalog_governance_core_purge_account_application_data_atomic;\n\ncreate function public.purge_account_application_data_atomic(p_user_id uuid)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $function$\ndeclare\n  v_result jsonb;\n  v_food_personal_overrides integer := 0;\n  v_food_personal_override_revisions integer := 0;\nbegin\n  -- Delete the current pointer first because it RESTRICT-references the revision history.\n  delete from public.food_personal_overrides where user_id = p_user_id;\n  get diagnostics v_food_personal_overrides = row_count;\n\n  delete from public.food_personal_override_revisions where user_id = p_user_id;\n  get diagnostics v_food_personal_override_revisions = row_count;\n\n  if exists (\n    select 1 from public.food_personal_overrides where user_id = p_user_id\n    union all\n    select 1 from public.food_personal_override_revisions where user_id = p_user_id\n  ) then\n    raise exception 'Food Catalog Plan 6 personal override purge left owner rows behind.' using errcode='23514';\n  end if;\n\n  v_result := private.food_catalog_governance_core_purge_account_application_data_atomic(p_user_id);\n  return v_result || jsonb_build_object(\n    'food_personal_overrides_deleted', v_food_personal_overrides,\n    'food_personal_override_revisions_deleted', v_food_personal_override_revisions\n  );\nend\n$function$;\n\nrevoke all on function public.purge_account_application_data_atomic(uuid) from public, anon, authenticated, service_role;\ngrant execute on function public.purge_account_application_data_atomic(uuid) to service_role;\n`;
          if (!migration.includes(oldBlock)) throw new Error('Plan 6 purge wrapper block not found.');
          const newBlock = `-- Extend the canonical Nutrition account-deletion lifecycle in place so the reviewed\n-- public purge authority remains verifier-visible while adding Plan 6 owner data.\ncreate or replace function public.purge_account_application_data_atomic(p_user_id uuid)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $function$\ndeclare\n  v_result jsonb;\n  v_saved_meal_creation_operations integer := 0;\n  v_food_personal_overrides integer := 0;\n  v_food_personal_override_revisions integer := 0;\nbegin\n  -- Existing reviewed top-level Nutrition V1 replay cleanup remains explicit.\n  delete from private.nutrition_saved_meal_creation_operations where user_id = p_user_id;\n  get diagnostics v_saved_meal_creation_operations = row_count;\n\n  -- Delete the current Plan 6 pointer first because it RESTRICT-references revision history.\n  delete from public.food_personal_overrides where user_id = p_user_id;\n  get diagnostics v_food_personal_overrides = row_count;\n\n  delete from public.food_personal_override_revisions where user_id = p_user_id;\n  get diagnostics v_food_personal_override_revisions = row_count;\n\n  -- Preserve the reviewed Nutrition V1 delegated purge graph directly.\n  v_result := private.nutrition_v1_final_review_core_purge_account_application_data_atomic(p_user_id);\n\n  if exists (select 1 from private.nutrition_saved_meal_creation_operations where user_id = p_user_id) then\n    raise exception 'Nutrition V1 account-data purge left Saved Meal creation replay rows behind.' using errcode='23514';\n  end if;\n  if exists (\n    select 1 from public.food_personal_overrides where user_id = p_user_id\n    union all\n    select 1 from public.food_personal_override_revisions where user_id = p_user_id\n  ) then\n    raise exception 'Food Catalog Plan 6 personal override purge left owner rows behind.' using errcode='23514';\n  end if;\n\n  return v_result || jsonb_build_object(\n    'nutrition_saved_meal_creation_operations_deleted', v_saved_meal_creation_operations,\n    'food_personal_overrides_deleted', v_food_personal_overrides,\n    'food_personal_override_revisions_deleted', v_food_personal_override_revisions\n  );\nend\n$function$;\n\nrevoke all on function public.purge_account_application_data_atomic(uuid) from public, anon, authenticated, service_role;\ngrant execute on function public.purge_account_application_data_atomic(uuid) to service_role;\n`;
          migration = migration.replace(oldBlock, newBlock);
          fs.writeFileSync(migrationPath, migration);

          const dbTestPath = 'lib/product/food-catalog-governance-plan6-database.test.ts';
          let dbTest = fs.readFileSync(dbTestPath, 'utf8');
          dbTest = dbTest.replace(
            `    expect(sql).toContain("alter function public.purge_account_application_data_atomic(uuid) set schema private");\n    expect(sql).toContain("food_catalog_governance_core_purge_account_application_data_atomic");\n`,
            `    expect(sql).toContain("create or replace function public.purge_account_application_data_atomic");\n    expect(sql).toContain("private.nutrition_saved_meal_creation_operations");\n    expect(sql).toContain("private.nutrition_v1_final_review_core_purge_account_application_data_atomic");\n`
          );
          fs.writeFileSync(dbTestPath, dbTest);

          const boundaryPath = 'lib/product/food-catalog-ingestion-boundary.test.ts';
          let boundary = fs.readFileSync(boundaryPath, 'utf8');
          boundary = boundary.replace(
            `const PLAN5_SERVING_CORRECTION = "20260907165500_food_catalog_search_serving_semantics_correction.sql";\n`,
            `const PLAN5_SERVING_CORRECTION = "20260907165500_food_catalog_search_serving_semantics_correction.sql";\nconst PLAN6_MIGRATION = "20260908100000_food_catalog_governance_control_plane.sql";\n`
          );
          boundary = boundary.replace(
            `    expect(currentPendingEntries).toEqual([]);\n    expect(current.pendingCount).toBe(0);\n    expect(current.unresolvedCount).toBe(0);\n    expect(current.historyRepair).toEqual(\n      expect.objectContaining({\n        state: "reconciled",\n        pendingCount: 0,\n        unresolvedCount: 0,\n      })\n    );\n`,
            `    expect(currentPendingEntries).toEqual([\n      expect.objectContaining({\n        localFile: PLAN6_MIGRATION,\n        state: "pending",\n      }),\n    ]);\n    expect(current.pendingCount).toBe(1);\n    expect(current.unresolvedCount).toBe(1);\n    expect(current.historyRepair).toEqual(\n      expect.objectContaining({\n        state: "pending",\n        pendingCount: 1,\n        unresolvedCount: 1,\n      })\n    );\n`
          );
          fs.writeFileSync(boundaryPath, boundary);
          NODE
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql lib/product/food-catalog-governance-plan6-database.test.ts lib/product/food-catalog-ingestion-boundary.test.ts
          git commit -m "fix: preserve Nutrition purge authority in Plan 6"
          git push origin HEAD:feat/food-catalog-governance-plan6
