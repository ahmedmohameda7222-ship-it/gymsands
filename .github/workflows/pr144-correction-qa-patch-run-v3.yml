name: PR144 Correction QA Patch Run V3

on:
  push:
    branches:
      - feat/active-workout-full-implementation
    paths:
      - .github/workflows/pr144-correction-qa-patch-run-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Preserve canonical identities and correct QA-only locator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr144-correction-qa-patch.py')
          text = path.read_text()
          replacements = [
              ('name: "transient-menu-mutual-exclusion-keyboard-390x844"', 'name: "transient-menu-mutual-exclusion-390x844-keyboard"'),
              ('name: "optimistic-complete-network-delay-interaction-390x844"', 'name: "optimistic-complete-network-delay-390x844-interaction"'),
              ('await visible(page, "[data-aw10-paused-state]").getByRole("button").click();', 'await visible(page, "[data-aw10-paused-state]").getByRole("button", { name: /resume/i }).click();'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one staged QA marker, found {text.count(old)}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python scripts/pr144-correction-qa-patch.py
      - name: Syntax check
        run: node --check scripts/run-active-workout-full-authority-qa.mjs
      - name: Deterministic dependency install
        run: npm ci
      - name: Correction and canonical source contracts
        run: npx vitest run lib/product/active-workout-pr144-correction-authority.test.ts lib/product/active-workout-aw10-closure.test.ts
      - name: Commit strengthened QA source and retire patch script
        shell: bash
        run: |
          rm scripts/pr144-correction-qa-patch.py
          git config user.name "Plaivra Repository Delivery"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/run-active-workout-full-authority-qa.mjs scripts/pr144-correction-qa-patch.py
          git diff --cached --check
          git commit -m "test: strengthen PR144 correction rendered authority"
          git push origin HEAD:feat/active-workout-full-implementation
