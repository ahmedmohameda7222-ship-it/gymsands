name: Active Workout Final Compatibility Repair

on:
  push:
    branches:
      - feat/active-workout-full-implementation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'ahmedmohameda7222-ship-it'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - name: Apply bounded compatibility corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shell_path = Path('components/workouts/active-workout/active-workout-execution-shell.tsx')
          shell = shell_path.read_text()
          old_shell = '''                  <li key={item.number} className="flex min-w-0 flex-1 items-center last:flex-none">
                    <button
                      type="button"
                      className={cn(
'''
          new_shell = '''                  <li key={item.number} className="flex min-w-0 flex-1 items-center last:flex-none">
                    <button
                      type="button"
                      data-aw5-set-path-number={item.number}
                      className={cn(
'''
          if shell.count(old_shell) != 1:
              raise SystemExit(f'Expected one canonical Set Path button anchor, found {shell.count(old_shell)}')
          shell_path.write_text(shell.replace(old_shell, new_shell, 1))

          test_path = Path('lib/product/train-phase1-approved-ui.test.ts')
          test = test_path.read_text()
          old_decl = '''    const details = source("components/workouts/active-workout/active-workout-details-bridge.tsx");
    const shell = source("components/workouts/active-workout/active-workout-execution-shell.tsx");
'''
          new_decl = '''    const details = source("components/workouts/active-workout/active-workout-details-bridge.tsx");
    const replacement = source("components/workouts/active-workout/active-workout-replacement-recommendations.tsx");
    const shell = source("components/workouts/active-workout/active-workout-execution-shell.tsx");
'''
          if test.count(old_decl) != 1:
              raise SystemExit('Train Phase 1 replacement declaration anchor drifted')
          test = test.replace(old_decl, new_decl, 1)
          old_assert = '''    expect(details).toContain('<option value="machine_taken">{tr("actions.machineOccupied")}</option>');
'''
          new_assert = '''    expect(replacement).toContain('"machine_taken"');
    expect(replacement).toContain('machine_taken: "replacement.reasonMachineTaken"');
    expect(replacement).toContain('tr(reasonTranslationKey[candidateReason])');
'''
          if test.count(old_assert) != 1:
              raise SystemExit('Train Phase 1 legacy replacement assertion anchor drifted')
          test_path.write_text(test.replace(old_assert, new_assert, 1))
          PY
      - name: Remove temporary repair authority and commit
        shell: bash
        run: |
          rm .github/workflows/active-workout-final-compat-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/workouts/active-workout/active-workout-execution-shell.tsx lib/product/train-phase1-approved-ui.test.ts .github/workflows/active-workout-final-compat-repair.yml
          git diff --cached --check
          git commit -m "Repair Active Workout mature QA compatibility"
          git push origin HEAD:feat/active-workout-full-implementation
