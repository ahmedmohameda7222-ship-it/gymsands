name: Onboarding Production Ledger Reconciliation One-Shot

on:
  push:
    branches:
      - docs/onboarding-production-reconciliation
    paths:
      - .github/workflows/ops-onboarding-reconcile-ledger-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/onboarding-production-reconciliation
          fetch-depth: 0

      - name: Reconcile exact Production migration identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const filename = '20260804174500_fix_profiles_update_policy_recursion.sql';
          const productionVersion = '20260804180932';
          const productionName = 'fix_profiles_update_policy_recursion';
          const ledgerPath = 'supabase/migration-ledger.json';
          const readmePath = 'README.md';
          const reconciliationPath = 'docs/architecture/migration-ledger-reconciliation.md';
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const entry = ledger.entries.find((item) => item.localFile === filename);

          if (!entry) throw new Error('Onboarding hotfix migration is missing from the ledger.');
          if (entry.state !== 'pending') throw new Error(`Expected pending state, got ${entry.state}.`);

          Object.assign(entry, {
            state: 'applied_version_alias',
            note: 'differs; applied exactly once to Plaivra Production after PR #112 approval. Do not replay.',
            productionVersion,
            productionName,
          });

          ledger.capturedAt = new Date().toISOString();
          ledger.pendingCount = 0;
          ledger.unresolvedCount = 0;
          ledger.historyRepair.state = 'reconciled';
          ledger.historyRepair.pendingCount = 0;
          ledger.historyRepair.unresolvedCount = 0;
          ledger.productionRecordCount = 87;
          ledger.historyRepair.note = 'Workout History and PCS-2 Production migration history remain reconciled through 20260803173755_private_app_bootstrap_v1. Repository migration 20260804174500_fix_profiles_update_policy_recursion.sql was applied exactly once to Plaivra Production as generated version 20260804180932_fix_profiles_update_policy_recursion and is represented by an applied-version alias. Do not replay. The released compatibility marker remains 20260724232734, Activity Catalog was not modified, and durable Git evidence remains bound to the reachable Workout History squash merge dfa14c3bc2c1524ff185b1ee4e170f4537a80230.';
          fs.writeFileSync(ledgerPath, `${JSON.stringify(ledger)}\n`);

          const appliedSection = `\n## P0 onboarding Production repair\n\n- \`${filename}\` was applied exactly once to Plaivra Production as generated version \`${productionVersion}_${productionName}\`.\n- The repository filename and Production version differ, so the migration ledger preserves the immutable mapping as \`applied_version_alias\`. Do not replay.\n- The compatibility marker remained unchanged and Activity Catalog was not modified.\n`;

          for (const target of [readmePath, reconciliationPath]) {
            const current = fs.readFileSync(target, 'utf8');
            const pendingSection = /\n## Pending P0 onboarding database repair[\s\S]*$/;
            if (!pendingSection.test(current)) {
              throw new Error(`Pending onboarding section not found in ${target}.`);
            }
            fs.writeFileSync(target, `${current.replace(pendingSection, '').trimEnd()}\n${appliedSection}`);
          }
          NODE

      - name: Verify reconciled ledger
        run: npm run migration:ledger:check

      - name: Commit bounded reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            supabase/migration-ledger.json \
            README.md \
            docs/architecture/migration-ledger-reconciliation.md
          test "$(git diff --cached --name-only | wc -l)" = "3"
          git commit -m "docs(onboarding): reconcile Production hotfix migration"
          git push origin HEAD:docs/onboarding-production-reconciliation
