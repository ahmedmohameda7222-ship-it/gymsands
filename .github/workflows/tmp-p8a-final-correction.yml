name: Temporary P8A Final Correction

on:
  push:
    branches:
      - feat/p8a-single-workout-pdf-report
    paths:
      - .github/workflows/tmp-p8a-final-correction.yml

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_USE_MOCK_AUTH: true
  PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
  PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
  PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
  PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
  PLAIVRA_RELEASE_ENVIRONMENT: ci
  PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: 2
  SUPABASE_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  QA_SERVER_MODE: production
  QA_MOCK_AUTH_BUILD_VALUE: true

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact staged head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use repository Node authority
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Materialize bounded correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git merge-base HEAD origin/main)" = "d8a6d757425163683b98f3f546749aeffe003bb8"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected = {
              "00": "b9f819e0f68d1c2edc05494c930e040b8ce9ca5a48b947298fd7f332f158676f",
              "01": "c568c39978de43601373655e87f4e5b7c5f8732066f6e0048d90295cdcbcc64e",
              "02": "a491f2c3bdf17781476d86c79abe44dfe296928c9f4b9242596c757155f8c481",
              "03": "67d4f7f4b8451cd76d841c198492dcb4c1a23b4c38e9eb9363b579ef93766488",
              "04": "1155ab2cb92d6f927db94c55fcdfd094a1585e83a7637c991eaf3ca10abc0e3f",
              "05": "7af7a0f6f62f017cc29c1fbb3fa7555c1f7ca24939face0050e5aec0237aca4f",
          }

          part01 = Path(".p8a-final-correction-payload.part01")
          data01 = part01.read_text(encoding="utf-8")
          if sha256(data01.encode()).hexdigest() != expected["01"]:
              if len(data01) != 8999 or data01[8153:8163] != "x3p6FzweMJ":
                  raise SystemExit("Unexpected staged payload part01 shape")
              part01.write_text(data01[:8158] + "i" + data01[8158:], encoding="utf-8")

          part05 = Path(".p8a-final-correction-payload.part05")
          data05 = part05.read_text(encoding="utf-8")
          if sha256(data05.encode()).hexdigest() != expected["05"]:
              if len(data05) != 7592 or not data05.endswith("A+AIA"):
                  raise SystemExit("Unexpected staged payload part05 shape")
              part05.write_text(data05 + "\n", encoding="utf-8")

          for suffix, digest in expected.items():
              path = Path(f".p8a-final-correction-payload.part{suffix}")
              actual = sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"Payload part{suffix} digest mismatch: {actual}")
          PY
          cat .p8a-final-correction-payload.part0* | base64 --decode > /tmp/p8a-correction-files.tar.gz
          echo "8fb1d51df837549a5b4d4d746d2c075e9f98d448253696d430ce50b930639e67  /tmp/p8a-correction-files.tar.gz" | sha256sum --check
          tar -xzf /tmp/p8a-correction-files.tar.gz
          rm -f \
            lib/reports/pdf/vendor/.gitattributes \
            lib/reports/pdf/vendor/ARTIFACTS.md \
            lib/reports/pdf/vendor/bidi.cjs \
            lib/reports/pdf/vendor/fontkit.cjs
          npm install --save-exact @pdf-lib/fontkit@1.1.1 bidi-js@1.0.3
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.dependencies['@pdf-lib/fontkit'] !== '1.1.1') throw new Error('fontkit manifest version mismatch');
          if (pkg.dependencies['bidi-js'] !== '1.0.3') throw new Error('bidi manifest version mismatch');
          if (lock.packages['node_modules/@pdf-lib/fontkit']?.version !== '1.1.1') throw new Error('fontkit lock version mismatch');
          if (lock.packages['node_modules/bidi-js']?.version !== '1.0.3') throw new Error('bidi lock version mismatch');
          NODE
          test ! -e lib/reports/pdf/vendor/fontkit.cjs
          test ! -e lib/reports/pdf/vendor/bidi.cjs
          test ! -e lib/reports/pdf/vendor/.gitattributes
          test ! -e lib/reports/pdf/vendor/ARTIFACTS.md
          if find lib/reports/pdf/vendor -type f -print -quit 2>/dev/null | grep -q .; then
            echo "Executable or metadata files remain under lib/reports/pdf/vendor" >&2
            exit 1
          fi

      - name: Stage only planner-authorized correction paths
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- \
            package.json package-lock.json next.config.mjs eslint.config.mjs \
            'app/api/workouts/history/performed/[id]/report/route.test.ts' \
            'app/api/workouts/history/performed/[id]/report/route.ts' \
            lib/reports/pdf/THIRD_PARTY_NOTICES.md \
            lib/reports/pdf/assets \
            lib/reports/pdf/document.ts \
            lib/reports/pdf/fonts.test.ts \
            lib/reports/pdf/fonts.ts \
            lib/reports/pdf/text-direction.test.ts \
            lib/reports/pdf/text-direction.ts \
            lib/reports/pdf/types.ts \
            lib/reports/pdf/vendor-modules.d.ts \
            lib/reports/pdf/vendor \
            lib/reports/workout/copy.ts \
            lib/reports/workout/model.test.ts \
            lib/reports/workout/model.ts \
            lib/reports/workout/render-evidence.test.ts \
            lib/reports/workout/render.test.ts \
            lib/reports/workout/render.ts \
            lib/reports/workout/test-fixture.ts \
            lib/reports/workout/types.ts \
            scripts/verify-p8a-runtime-assets.mjs \
            scripts/verify-p8a-runtime-assets.test.mjs \
            scripts/run-workout-report-qa.mjs \
            scripts/workout-report-qa-contract.test.mjs \
            docs/architecture/p8a-single-workout-pdf.md \
            docs/control/PLAIVRA_CURRENT_STATE.md
          git diff --cached --check
          git diff --cached --name-only > /tmp/p8a-correction-paths.txt
          test -s /tmp/p8a-correction-paths.txt
          if grep -E '^(\.github/|\.p8a-final-correction-payload)' /tmp/p8a-correction-paths.txt; then
            echo "Temporary control files entered correction commit" >&2
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json|next.config.mjs|eslint.config.mjs|app/api/workouts/history/performed/\[id\]/report/route.test.ts|app/api/workouts/history/performed/\[id\]/report/route.ts|lib/reports/pdf/THIRD_PARTY_NOTICES.md|lib/reports/pdf/assets/*|lib/reports/pdf/document.ts|lib/reports/pdf/fonts.test.ts|lib/reports/pdf/fonts.ts|lib/reports/pdf/text-direction.test.ts|lib/reports/pdf/text-direction.ts|lib/reports/pdf/types.ts|lib/reports/pdf/vendor-modules.d.ts|lib/reports/pdf/vendor/*|lib/reports/workout/copy.ts|lib/reports/workout/model.test.ts|lib/reports/workout/model.ts|lib/reports/workout/render-evidence.test.ts|lib/reports/workout/render.test.ts|lib/reports/workout/render.ts|lib/reports/workout/test-fixture.ts|lib/reports/workout/types.ts|scripts/verify-p8a-runtime-assets.mjs|scripts/verify-p8a-runtime-assets.test.mjs|scripts/run-workout-report-qa.mjs|scripts/workout-report-qa-contract.test.mjs|docs/architecture/p8a-single-workout-pdf.md|docs/control/PLAIVRA_CURRENT_STATE.md) ;;
              *) echo "Unauthorized correction path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/p8a-correction-paths.txt

      - name: Create exact local correction commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plaivra Implementation Authority"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(p8a): restore runtime and localization authority"
          echo "QA_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git show --stat --oneline --summary HEAD

      - name: Install exact dependencies from lock
        shell: bash
        run: npm ci

      - name: Verify dependency authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports/p8a-final-correction
          npm audit --omit=dev --audit-level=moderate | tee ci-reports/p8a-final-correction/npm-audit.txt
          npm ls @pdf-lib/fontkit bidi-js | tee ci-reports/p8a-final-correction/npm-ls.txt
          node - <<'NODE'
          const fontkit = require('@pdf-lib/fontkit/package.json');
          const bidi = require('bidi-js/package.json');
          if (fontkit.version !== '1.1.1') throw new Error(`Unexpected fontkit ${fontkit.version}`);
          if (bidi.version !== '1.0.3') throw new Error(`Unexpected bidi-js ${bidi.version}`);
          NODE
          if git grep -nE 'lib/reports/pdf/vendor/(fontkit|bidi)|@/lib/reports/pdf/vendor' -- app lib ':!**/*.test.ts' ':!**/*.test.tsx' ':!**/*.md'; then
            echo "Vendored runtime import remains in application source" >&2
            exit 1
          fi

      - name: Run focused P8A tests
        shell: bash
        run: |
          npx vitest run --config vitest.unit.config.mjs \
            'app/api/workouts/history/performed/[id]/report/route.test.ts' \
            components/workouts/history/session-report-download-button.test.ts \
            lib/reports/pdf/fonts.test.ts \
            lib/reports/pdf/text-direction.test.ts \
            lib/reports/workout/download-client.test.ts \
            lib/reports/workout/model.test.ts \
            lib/reports/workout/render.test.ts \
            lib/reports/workout/render-evidence.test.ts
          node --test scripts/verify-p8a-runtime-assets.test.mjs scripts/workout-report-qa-contract.test.mjs

      - name: Run repository validation
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:workout-history
          npm run test:scripts
          npm run test:telemetry

      - name: Build and prove traced runtime assets
        shell: bash
        run: |
          set -euo pipefail
          NEXT_PUBLIC_USE_MOCK_AUTH=true NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA=true npm run build
          node scripts/verify-p8a-runtime-assets.mjs | tee ci-reports/p8a-final-correction/runtime-assets.json

      - name: Install Chromium for rendered QA
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Start exact built QA server
        shell: bash
        run: |
          set -euo pipefail
          NEXT_PUBLIC_USE_MOCK_AUTH=true npm run start > ci-reports/p8a-final-correction/qa-server.log 2>&1 &
          echo "$!" > /tmp/p8a-correction-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ci-reports/p8a-final-correction/qa-server.log
          exit 1

      - name: Run corrected Workout History rendered QA
        shell: bash
        env:
          CI: true
          QA_BASE_URL: http://localhost:3000
          QA_WORKOUT_HISTORY_EVIDENCE_DIR: ci-reports/workout-history-qa-evidence
        run: npm run qa:workout-history

      - name: Stop QA server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p8a-correction-server.pid ]; then
            kill "$(cat /tmp/p8a-correction-server.pid)" 2>/dev/null || true
          fi

      - name: Verify exact correction commit integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${QA_HEAD_SHA}"
          git diff --check HEAD^ HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff-tree --no-commit-id --name-only -r HEAD > ci-reports/p8a-final-correction/correction-paths.txt
          test ! -e lib/reports/pdf/vendor/fontkit.cjs
          test ! -e lib/reports/pdf/vendor/bidi.cjs

      - name: Push validated correction commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/p8a-single-workout-pdf-report

      - name: Upload correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8a-final-correction-${{ env.QA_HEAD_SHA }}
          path: |
            ci-reports/p8a-final-correction/
            ci-reports/workout-history-qa-evidence/
          if-no-files-found: warn
          retention-days: 14
