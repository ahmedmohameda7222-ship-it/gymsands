name: Dependency Lock Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-lock-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate deterministic lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Enforce high-severity dependency audit
        run: npm audit --audit-level=high

      - name: Create exact lockfile blob
        shell: bash
        run: |
          set -euo pipefail
          base64 -w0 package-lock.json > /tmp/package-lock.b64
          jq -n --rawfile content /tmp/package-lock.b64 '{content:$content,encoding:"base64"}' > /tmp/blob-request.json
          sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob-request.json --jq .sha)"
          printf 'package-lock.json=%s\n' "$sha" | tee /tmp/blobs.txt

      - name: Upload generated dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-${{ github.event.pull_request.head.sha }}
          path: |
            package-lock.json
            /tmp/blobs.txt
          if-no-files-found: warn
          retention-days: 1
