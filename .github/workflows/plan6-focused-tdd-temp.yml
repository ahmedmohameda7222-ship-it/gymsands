name: Plan 6 Focused TDD Temp
on:
  push:
    branches:
      - feat/food-catalog-governance-plan6
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Plan 6 focused governance unit contracts
        run: ./node_modules/.bin/vitest run --config vitest.unit.config.mjs lib/food-catalog/governance
