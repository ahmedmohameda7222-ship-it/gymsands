name: Plan 6 Final P1 Fixture Gap Fix

on:
  push:
    branches:
      - feat/food-catalog-governance-plan6

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.head_commit.message == 'chore(plan6): stage final P1 green finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Patch omitted second-owner Auth fixture and self-remove
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/plan6_final_p1_postpatch.py')
          s=p.read_text()
          sentinel='plan6-rereview-second-owner@example.test'
          if sentinel not in s:
              old="  (:'both_uid'::uuid,'authenticated','authenticated','plan6-rereview-both@example.test','','{\\\"provider\\\":\\\"email\\\",\\\"providers\\\":[\\\"email\\\"]}'::jsonb,'{}'::jsonb,now(),now());"
              new="  (:'both_uid'::uuid,'authenticated','authenticated','plan6-rereview-both@example.test','','{\\\"provider\\\":\\\"email\\\",\\\"providers\\\":[\\\"email\\\"]}'::jsonb,'{}'::jsonb,now(),now()),\n  ('67000000-0000-4000-8000-000000000099'::uuid,'authenticated','authenticated','plan6-rereview-second-owner@example.test','','{\\\"provider\\\":\\\"email\\\",\\\"providers\\\":[\\\"email\\\"]}'::jsonb,'{\\\"nickname\\\":\\\"p6rr-owner2\\\"}'::jsonb,now(),now());"
              if s.count(old) != 1:
                  raise SystemExit(f'expected one rereview both-user fixture terminator, found {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/plan6-final-p1-fixture-gap-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(plan6): stage final P1 green finalizer"
          git push origin HEAD:feat/food-catalog-governance-plan6
