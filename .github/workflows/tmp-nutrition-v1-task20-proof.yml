name: Temporary Nutrition V1 Task 20 Proof

on:
  push:
    branches:
      - feat/nutrition-v1-implementation
    paths:
      - .github/workflows/tmp-nutrition-v1-task20-proof.yml

permissions:
  contents: read

jobs:
  task20-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_USE_MOCK_AUTH: "true"
      PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
      PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
      PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
      PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
      PLAIVRA_RELEASE_ENVIRONMENT: ci
      PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: "2"
      PLAIVRA_ACTIVITY_CATALOG_MODE: library_v2_with_legacy_fallback
      PLAIVRA_ACTIVITY_CATALOG_BASE_URL: https://plaivra-activity-catalog-api.vercel.app
      PLAIVRA_ACTIVITY_CATALOG_API_KEY: ci-placeholder-catalog-key-long-enough
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      QA_BASE_URL: http://localhost:3000
      QA_SERVER_MODE: production
      QA_HEAD_SHA: 351f9a792ed2941fd234d00a73acfdfa4f3d1a28
      QA_EVIDENCE_DIR: ci-reports/nutrition-v1-qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 351f9a792ed2941fd234d00a73acfdfa4f3d1a28
          fetch-depth: 0

      - name: Verify pinned implementation identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "351f9a792ed2941fd234d00a73acfdfa4f3d1a28"
          test "$(git merge-base HEAD origin/main)" = "b00b8205ed87aa53b7e76731f99156d58e989d0f"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Create report directories
        run: mkdir -p ci-reports/nutrition-v1-qa

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test authority
        run: npm test

      - name: Chronological disposable migration replay
        env:
          PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/replay-local-migration-chain.mjs --log ci-reports/database-validation.log --prove-future-order

      - name: Database lint
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Database verification SQL
        env:
          PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/run-database-verification.mjs

      - name: Integration tests
        env:
          PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          PLAIVRA_AW2A_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:integration

      - name: Repository script contracts
        run: npm run test:scripts

      - name: Migration ledger
        run: npm run migration:ledger:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production mock-auth build
        env:
          NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA: "true"
        run: npm run build

      - name: Start QA server
        run: |
          npm run start > ci-reports/nutrition-v1-qa/server.log 2>&1 &
          echo "$!" > /tmp/nutrition-v1-qa.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat ci-reports/nutrition-v1-qa/server.log
          exit 1

      - name: Nutrition V1 rendered QA matrix
        env:
          NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA: "true"
        run: node scripts/run-nutrition-v1-qa.mjs

      - name: Stop QA server
        if: always()
        run: |
          if [ -f /tmp/nutrition-v1-qa.pid ]; then
            kill "$(cat /tmp/nutrition-v1-qa.pid)" 2>/dev/null || true
          fi

      - name: Upload Nutrition V1 Task 20 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-v1-task20-proof-351f9a79
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 7
