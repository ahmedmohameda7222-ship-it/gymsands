name: PCS4A Dependency Diagnostic One-Shot

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pcs4a-dependency-diagnostic-one-shot.yml"

permissions:
  contents: read

concurrency:
  group: pcs4a-dependency-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact lockfile graph
        run: npm ci

      - name: Capture sanitized dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-reports
          npm audit --omit=dev --audit-level=moderate --json > diagnostic-reports/npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''] ?? {};
          const audit = JSON.parse(fs.readFileSync('diagnostic-reports/npm-audit.json', 'utf8'));
          const vulnerableNames = Object.keys(audit.vulnerabilities ?? {}).sort();
          const installedEntries = Object.fromEntries(vulnerableNames.map((name) => {
            const entry = lock.packages?.[`node_modules/${name}`];
            return [name, entry ? {
              version: entry.version ?? null,
              dev: entry.dev ?? false,
              optional: entry.optional ?? false,
              peer: entry.peer ?? false,
              dependencies: entry.dependencies ?? {},
              peerDependencies: entry.peerDependencies ?? {},
            } : null];
          }));
          const rootDependencies = Object.fromEntries(vulnerableNames.map((name) => [
            name,
            root.dependencies?.[name] ?? root.devDependencies?.[name] ?? null,
          ]));
          const sanitized = {
            auditReportVersion: audit.auditReportVersion ?? null,
            vulnerableNames,
            rootDependencies,
            installedEntries,
            vulnerabilities: Object.fromEntries(
              Object.entries(audit.vulnerabilities ?? {}).map(([name, value]) => [name, {
                severity: value.severity ?? null,
                isDirect: value.isDirect ?? null,
                via: (value.via ?? []).map((item) => typeof item === 'string' ? item : {
                  source: item.source ?? null,
                  name: item.name ?? null,
                  severity: item.severity ?? null,
                  range: item.range ?? null,
                }),
                effects: value.effects ?? [],
                range: value.range ?? null,
                nodes: value.nodes ?? [],
                fixAvailable: value.fixAvailable ?? null,
              }]),
            ),
            metadata: audit.metadata ?? null,
          };
          fs.writeFileSync('diagnostic-reports/npm-audit-sanitized.json', JSON.stringify(sanitized, null, 2));
          fs.writeFileSync('diagnostic-reports/vulnerable-packages.txt', `${vulnerableNames.join('\n')}\n`);
          NODE
          : > diagnostic-reports/npm-explain-vulnerabilities.txt
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            printf '=== %s ===\n' "$package" >> diagnostic-reports/npm-explain-vulnerabilities.txt
            npm explain "$package" >> diagnostic-reports/npm-explain-vulnerabilities.txt 2>&1 || true
            printf '\n' >> diagnostic-reports/npm-explain-vulnerabilities.txt
          done < diagnostic-reports/vulnerable-packages.txt
          rm diagnostic-reports/npm-audit.json

      - name: Verify diagnostic is read-only
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish concise diagnostic
        run: |
          cat diagnostic-reports/npm-audit-sanitized.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pcs4a-dependency-diagnostic-${{ github.event.pull_request.head.sha }}
          path: diagnostic-reports/
          if-no-files-found: error
          retention-days: 3
