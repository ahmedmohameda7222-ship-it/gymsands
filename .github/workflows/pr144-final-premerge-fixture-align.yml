name: PR144 Final Pre-Merge Fixture Alignment

on:
  push:
    branches:
      - feat/active-workout-full-implementation
    paths:
      - .github/workflows/pr144-final-premerge-fixture-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Align legacy Strength fixture
        run: python scripts/pr144-final-premerge-fixture-align.py
      - name: Deterministic dependency install
        run: npm ci
      - name: Verify intended identity and capability behavior
        run: |
          npx vitest run --config vitest.unit.config.mjs --pool=threads --maxWorkers=1 components/workouts/active-workout/active-workout-core-session.identity.test.tsx
          npx vitest run components/workouts/active-workout/active-workout-execution-capability.test.ts services/database/direct-workout-sessions.test.ts
          git diff --check
      - name: Commit fixture alignment
        run: |
          git config user.name "Plaivra Repository Delivery"
          git config user.email "actions@users.noreply.github.com"
          git add components/workouts/active-workout/active-workout-core-session.identity.test.tsx
          git rm scripts/pr144-final-premerge-fixture-align.py
          git diff --cached --check
          git commit -m "test: mark identity fixture as legacy Strength"
          git push origin HEAD:feat/active-workout-full-implementation
