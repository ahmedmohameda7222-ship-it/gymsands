name: Plan 6 Final P1 Concurrency Cleanup Fix

on:
  push:
    branches:
      - feat/food-catalog-governance-plan6

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.head_commit.message == 'chore(plan6): stage final P1 green finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Make final-P1 concurrency fixture cleanup repeatable and self-remove
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/plan6_final_p1_postpatch.py')
          s=p.read_text()
          if "account_deletion_jobs where id='6d000000-0000-4000-8000-000000000601'" not in s:
              old='''script = script.replace("perform pg_catalog.pg_sleep(3);", "perform pg_catalog.pg_sleep(15);", 1)\nconcurrency.write_text(script)'''
              new='''script = script.replace("perform pg_catalog.pg_sleep(3);", "perform pg_catalog.pg_sleep(15);", 1)\ncleanup_marker = "    truncate table public.food_items cascade;\\n    delete from public.food_catalog_governance_capability_assignments"\ncleanup_replacement = "    truncate table public.food_items cascade;\\n    delete from public.account_deletion_jobs where id='6d000000-0000-4000-8000-000000000601';\\n    delete from public.food_catalog_governance_capability_assignments"\nif script.count(cleanup_marker) != 1:\n    raise SystemExit(f"expected one final-P1 concurrency cleanup marker, found {script.count(cleanup_marker)}")\nscript = script.replace(cleanup_marker, cleanup_replacement, 1)\nconcurrency.write_text(script)'''
              if s.count(old) != 1:
                  raise SystemExit(f'expected one postpatch concurrency-write marker, found {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/plan6-final-p1-concurrency-cleanup-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(plan6): stage final P1 green finalizer"
          git push origin HEAD:feat/food-catalog-governance-plan6
