name: Active Workout AW10 Secondary Read Isolation
on:
  push:
    branches: ["feat/active-workout-full-implementation"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - name: Add deterministic AW10 previous-performance route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/run-aw10-active-workout-closure-qa.mjs')
          s = p.read_text()
          old = '''    }, requestHistory);\n    const consoleErrors = [];'''
          new = '''    }, requestHistory);\n    await context.route(/\\/api\\/workouts\\/active\\/previous-performance(?:\\?.*)?$/, async (route) => {\n      await route.fulfill({\n        status: 200,\n        contentType: "application/json",\n        headers: { "cache-control": "private, no-store" },\n        body: JSON.stringify({ data: null })\n      });\n    });\n    const consoleErrors = [];'''
          if s.count(old) != 1:
              raise SystemExit(f'AW10 fixture insertion anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit clean result
        shell: bash
        run: |
          rm .github/workflows/active-workout-aw10-secondary-read-isolation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Isolate AW10 previous-performance QA read"
          git push origin HEAD:feat/active-workout-full-implementation
