          needle = " and Nutrition V1 privacy-purge authority repository migration 20260825120400_nutrition_v1_privacy_purge_authority.sql are intentionally pending"
          replacement = " and Nutrition V1 privacy-purge authority repository migration 20260825120400_nutrition_v1_privacy_purge_authority.sql, and Nutrition V1 review-atomicity correction repository migration 20260827060000_nutrition_v1_review_atomicity_corrections.sql are intentionally pending"
          if needle not in note:
