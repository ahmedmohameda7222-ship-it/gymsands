          ledger["historyRepair"]["note"] = note.replace(needle, replacement, 1)
          ledger["entries"].append({
              "localFile": "20260827060000_nutrition_v1_review_atomicity_corrections.sql",
              "state": "pending",
              "note": "Nutrition V1 review-atomicity corrective repository-only additive migration; not applied to Plaivra Production and has no Production identity. Do not replay or apply before explicit Product Owner/Planner approval.",
          })
          ledger_path.write_text(json.dumps(ledger, separators=(",", ":")))
          PY
      - name: Enforce bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf '%s\n' "${changed[@]}"
          allowed='^(components/nutrition/cooking/cooking-mode\.tsx|components/nutrition/diary/logging-session\.tsx|lib/nutrition-v1/cooking-local-store\.ts|services/nutrition-v1/server/(cooking-sessions|cooking-sessions\.test|food-library|recipes|recipes\.test)\.ts|scripts/run-database-verification\.mjs|supabase/migration-ledger\.json|supabase/migrations/20260827060000_nutrition_v1_review_atomicity_corrections\.sql|supabase/verification/nutrition-v1-review-atomicity\.sql)$'
          for path in "${changed[@]}"; do
            [[ "$path" =~ $allowed ]] || { echo "Unexpected correction path: $path"; exit 1; }
          done
      - name: Focused GREEN unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/vitest run --config vitest.unit.config.mjs \
            lib/product/nutrition-v1-review-corrections.test.ts \
            services/nutrition-v1/server/review-corrections.test.ts \
            lib/product/nutrition-v1-review-atomicity-migration.test.ts \
            lib/nutrition-v1/cooking-local-store.test.ts \
            services/nutrition-v1/server/cooking-sessions.test.ts \
            services/nutrition-v1/server/recipes.test.ts \
            services/nutrition-v1/server/food-library.test.ts
      - name: Lint and typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
      - name: Replay and verify disposable database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          node scripts/replay-local-migration-chain.mjs --log ci-reports/database-validation.log --prove-future-order
          supabase db lint --local --schema public --level error --fail-on error
          node scripts/run-database-verification.mjs
          npm run migration:ledger:check
      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/nutrition/cooking/cooking-mode.tsx \
            components/nutrition/diary/logging-session.tsx \
            lib/nutrition-v1/cooking-local-store.ts \
            services/nutrition-v1/server/cooking-sessions.ts \
            services/nutrition-v1/server/cooking-sessions.test.ts \
            services/nutrition-v1/server/food-library.ts \
            services/nutrition-v1/server/recipes.ts \
            services/nutrition-v1/server/recipes.test.ts \
            scripts/run-database-verification.mjs \
            supabase/migration-ledger.json \
            supabase/migrations/20260827060000_nutrition_v1_review_atomicity_corrections.sql \
            supabase/verification/nutrition-v1-review-atomicity.sql
          git diff --cached --check
          git commit -m "fix(nutrition): resolve review privacy and atomicity blockers"
          git push origin HEAD:feat/nutrition-v1-implementation
