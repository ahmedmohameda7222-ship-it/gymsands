name: Temporary Nutrition Review Corrections

on:
  push:
    branches:
      - feat/nutrition-v1-implementation
    paths:
      - .github/workflows/tmp-nutrition-review-corrections.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_USE_MOCK_AUTH: true
      PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
      PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
      PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
      PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
      PLAIVRA_RELEASE_ENVIRONMENT: ci
      PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: 2
      PLAIVRA_ACTIVITY_CATALOG_MODE: library_v2_with_legacy_fallback
      PLAIVRA_ACTIVITY_CATALOG_BASE_URL: https://plaivra-activity-catalog-api.vercel.app
      PLAIVRA_ACTIVITY_CATALOG_API_KEY: ci-placeholder-catalog-key-long-enough
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nutrition-v1-implementation
          fetch-depth: 0
      - name: Verify bounded starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "10ae048b48661ceca12621418508ef1073c0bf95"
          test "$(git merge-base HEAD origin/main)" = "b00b8205ed87aa53b7e76731f99156d58e989d0f"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Apply bounded GREEN corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              Path(path).write_text(content)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              write(path, text.replace(old, new, 1))

          def sub_once(path, pattern, replacement):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex replacement, found {count}")
              write(path, updated)

          # Owner-scope Cooking recovery keys.
          replace_once(
              "lib/nutrition-v1/cooking-local-store.ts",
              '''export function cookingLocalStorageKey(recipeId: string) {\n  return `plaivra:nutrition:cooking:${recipeId}:active`;\n}''',
              '''export function cookingLocalStorageKey(ownerId: string, recipeId: string) {\n  return `plaivra:nutrition:cooking:${ownerId}:${recipeId}:active`;\n}''',
          )

          # Normal member Food Library discovery is active catalog only.
          food_path = "services/nutrition-v1/server/food-library.ts"
          food = read(food_path)
          if food.count('.neq("lifecycle_status", "merged")') != 2:
              raise SystemExit("food-library.ts: expected exactly two member lifecycle filters")
          write(food_path, food.replace('.neq("lifecycle_status", "merged")', '.eq("lifecycle_status", "active")'))

          # Recipe autosave becomes one owner-derived transactional command.
          recipes_path = "services/nutrition-v1/server/recipes.ts"
          recipes_replacement = '''export async function autosaveRecipeDraft(\n  supabase: SupabaseClient,\n  _userId: string,\n  recipeId: string,\n  input: RecipeDraftInput,\n) {\n  const result = await supabase.rpc("autosave_nutrition_recipe_draft", {\n    p_recipe_id: recipeId,\n    p_draft: draftPatch(input),\n    p_ingredients: input.ingredients ?? [],\n    p_instructions: input.instructions ?? [],\n    p_equipment: input.equipment ?? [],\n  });\n  throwDb(result.error);\n  const draft = result.data as Record<string, unknown> | null;\n  if (!draft?.id || draft.recipe_id !== recipeId) {\n    throw new Error("Recipe Working Draft autosave returned an invalid result.");\n  }\n  return draft;\n}\n\nexport async function publishRecipeDraft'''
          sub_once(
              recipes_path,
              r'async function replaceDraftChildren\([\s\S]*?export async function publishRecipeDraft',
              recipes_replacement,
          )

          # Cooking parent revision + child rows become one transactional RPC.
          cooking_service = "services/nutrition-v1/server/cooking-sessions.ts"
          cooking_sync = '''export async function syncCookingSessionState(\n  supabase: SupabaseClient,\n  _userId: string,\n  sessionId: string,\n  input: {\n    expectedRevision: number;\n    currentActionKey: string | null;\n    lastActiveAt?: string;\n    actionStates: readonly SyncCookingActionState[];\n    timers: readonly SyncCookingTimer[];\n  },\n) {\n  if (!Number.isInteger(input.expectedRevision) || input.expectedRevision < 0) throw new Error("Invalid Cooking Session revision.");\n  const result = await supabase.rpc("sync_nutrition_cooking_session_state", {\n    p_session_id: sessionId,\n    p_expected_revision: input.expectedRevision,\n    p_current_action_key: input.currentActionKey,\n    p_last_active_at: input.lastActiveAt ?? new Date().toISOString(),\n    p_action_states: input.actionStates.map((item) => ({\n      id: item.id,\n      action_key: item.actionKey,\n      state: item.state,\n      state_revision: item.stateRevision,\n      activated_at: item.activatedAt ?? null,\n      completed_at: item.completedAt ?? null,\n      deferred_at: item.deferredAt ?? null,\n      skipped_at: item.skippedAt ?? null,\n    })),\n    p_timers: input.timers.map((item) => ({\n      id: item.id,\n      action_state_id: item.actionStateId,\n      timer_name: item.timerName,\n      duration_seconds: Math.max(1, Math.ceil(item.durationSeconds)),\n      status: item.status,\n      started_at: item.startedAt ?? null,\n      target_at: item.targetAt ?? null,\n      paused_at: item.pausedAt ?? null,\n      paused_remaining_seconds: item.pausedRemainingSeconds ?? null,\n      completed_at: item.completedAt ?? null,\n      cancelled_at: item.cancelledAt ?? null,\n    })),\n  });\n  dbError(result.error);\n  const data = result.data as Record<string, unknown> | null;\n  const stateRevision = Number(data?.stateRevision ?? data?.state_revision);\n  if (!Number.isInteger(stateRevision) || stateRevision !== input.expectedRevision + 1) {\n    throw new Error("Cooking Session synchronization returned an invalid revision.");\n  }\n  return { stateRevision };\n}\n\nasync function updateTerminalStatus'''
          sub_once(
              cooking_service,
              r'export async function syncCookingSessionState\([\s\S]*?async function updateTerminalStatus',
              cooking_sync,
          )

          # Authenticate first, bind recovery to owner, and reconcile terminal mutations.
          mode_path = "components/nutrition/cooking/cooking-mode.tsx"
          mode = read(mode_path)
          old_flush_pattern = r'\n  const flushPending = useCallback\(async \(candidate: CookingLocalSession\) => \{[\s\S]*?\n  \}, \[userId, writeLocal\]\);\n'
          mode, count = re.subn(old_flush_pattern, '\n', mode, count=1)
          if count != 1:
              raise SystemExit(f"cooking-mode.tsx: expected one legacy flushPending block, found {count}")
          old_storage = '''  const storageKey = useMemo(() => cookingLocalStorageKey(recipeId), [recipeId]);\n\n  const writeLocal = useCallback((next: CookingLocalSession) => {\n    window.localStorage.setItem(storageKey, serializeCookingLocalSession(next));\n  }, [storageKey]);'''
          new_storage = '''  const storageKey = useMemo(() => userId ? cookingLocalStorageKey(userId, recipeId) : null, [recipeId, userId]);\n\n  const writeLocalForOwner = useCallback((ownerId: string, next: CookingLocalSession) => {\n    window.localStorage.setItem(cookingLocalStorageKey(ownerId, recipeId), serializeCookingLocalSession(next));\n  }, [recipeId]);\n\n  const writeLocal = useCallback((next: CookingLocalSession) => {\n    if (!userId || !storageKey) return;\n    window.localStorage.setItem(storageKey, serializeCookingLocalSession(next));\n  }, [storageKey, userId]);'''
          if mode.count(old_storage) != 1:
              raise SystemExit("cooking-mode.tsx: storage block drifted")
          mode = mode.replace(old_storage, new_storage, 1)
          init_pattern = r'  const initialize = useCallback\(async \(\) => \{[\s\S]*?\n  \}, \[materialize, nt, recipeId, storageKey, writeLocal\]\);'
          new_init = '''  const flushPending = useCallback(async (candidate: CookingLocalSession, ownerId: string) => {\n    if (!candidate.pendingMutations.length || !supabase || !navigator.onLine) return candidate;\n    let next = candidate;\n    const stateOperationIds = next.pendingMutations\n      .filter((item) => item.type === "action_state" || item.type === "timer")\n      .map((item) => item.operationId);\n    if (stateOperationIds.length) {\n      try {\n        const result = await syncCookingSessionState(supabase, ownerId, next.sessionId, {\n          expectedRevision: next.stateRevision,\n          currentActionKey: next.currentActionKey,\n          lastActiveAt: next.lastActiveAt,\n          actionStates: actionSyncRows(next),\n          timers: timerSyncRows(next),\n        });\n        next = acknowledgeCookingMutations({ ...next, stateRevision: result.stateRevision }, stateOperationIds);\n        writeLocalForOwner(ownerId, next);\n      } catch {\n        return next;\n      }\n    }\n\n    const completeOperation = next.pendingMutations.find((item) => item.type === "complete_session");\n    if (completeOperation) {\n      try {\n        await completeCookingSession(supabase, ownerId, next.sessionId, next.completedAt ?? next.lastActiveAt);\n        next = acknowledgeCookingMutations(next, [completeOperation.operationId]);\n        writeLocalForOwner(ownerId, next);\n      } catch {\n        return next;\n      }\n    }\n\n    const endOperation = next.pendingMutations.find((item) => item.type === "end_session");\n    if (endOperation) {\n      try {\n        await endCookingSession(supabase, ownerId, next.sessionId, next.endedAt ?? next.lastActiveAt);\n        next = acknowledgeCookingMutations(next, [endOperation.operationId]);\n        writeLocalForOwner(ownerId, next);\n      } catch {\n        return next;\n      }\n    }\n    return next;\n  }, [writeLocalForOwner]);\n\n  const initialize = useCallback(async () => {\n    setLoading(true);\n    setError(null);\n    setDirection(document.documentElement.dir === "rtl" ? "rtl" : "ltr");\n    if (!supabase) {\n      setError(nt("cookingUnavailable"));\n      setLoading(false);\n      return;\n    }\n    try {\n      const auth = await supabase.auth.getUser();\n      if (auth.error) throw auth.error;\n      if (!auth.data.user) throw new Error(nt("cookingSignIn"));\n      const ownerId = auth.data.user.id;\n      setUserId(ownerId);\n      const ownerStorageKey = cookingLocalStorageKey(ownerId, recipeId);\n      window.localStorage.removeItem(`plaivra:nutrition:cooking:${recipeId}:active`);\n      const recovered = recoverCookingLocalSession(window.localStorage.getItem(ownerStorageKey), new Date());\n      if (recovered?.session.recipeId === recipeId) {\n        const reconciled = recovered.session.pendingMutations.length\n          ? await flushPending(recovered.session, ownerId)\n          : recovered.session;\n        if (reconciled.status === "active") {\n          writeLocalForOwner(ownerId, reconciled);\n          setResumeCandidate(reconciled);\n          setLoading(false);\n          return;\n        }\n        if (reconciled.status === "completed") {\n          writeLocalForOwner(ownerId, reconciled);\n          setSession(reconciled);\n          setLoading(false);\n          return;\n        }\n        window.localStorage.removeItem(ownerStorageKey);\n        router.back();\n        setLoading(false);\n        return;\n      }\n      const active = await getActiveCookingSession(supabase, ownerId, recipeId);\n      if (active) {\n        const local = materialize(active);\n        if (!local) throw new Error(nt("cookingRecoveryFailed"));\n        writeLocalForOwner(ownerId, local);\n        setResumeCandidate(local);\n        setLoading(false);\n        return;\n      }\n      const started = await startCookingSession(supabase, ownerId, { recipeId });\n      const created = await getActiveCookingSession(supabase, ownerId, recipeId);\n      if (!created) throw new Error(`${nt("cookingLoadFailed")} ${started.sessionId}`);\n      const local = materialize(created);\n      if (!local) throw new Error(nt("cookingMaterializeFailed"));\n      writeLocalForOwner(ownerId, local);\n      setSession(local);\n    } catch (cause) {\n      setError(cause instanceof Error ? cause.message : nt("cookingStartFailed"));\n    } finally {\n      setLoading(false);\n    }\n  }, [flushPending, materialize, nt, recipeId, router, writeLocalForOwner]);'''
          mode, count = re.subn(init_pattern, new_init, mode, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"cooking-mode.tsx: initialize block drifted ({count})")
          old_resume = '''  const onResume = useCallback(() => {\n    if (!resumeCandidate) return;\n    setSession(resumeCandidate);\n    setResumeCandidate(null);\n    void flushPending(resumeCandidate).then((next) => setSession(next));\n  }, [flushPending, resumeCandidate]);'''
          new_resume = '''  const onResume = useCallback(() => {\n    if (!resumeCandidate || !userId) return;\n    setSession(resumeCandidate);\n    setResumeCandidate(null);\n    void flushPending(resumeCandidate, userId).then((next) => setSession(next));\n  }, [flushPending, resumeCandidate, userId]);'''
          if mode.count(old_resume) != 1:
              raise SystemExit("cooking-mode.tsx: onResume block drifted")
          mode = mode.replace(old_resume, new_resume, 1)
          old_complete = '''      const completed = completeLocalCookingSession(persisted, now);\n      writeLocal(completed);\n      setSession(completed);\n      if (supabase && userId && navigator.onLine) {\n        try { await completeCookingSession(supabase, userId, completed.sessionId, now); } catch { /* local completion remains recoverable */ }\n      }'''
          new_complete = '''      const completed = completeLocalCookingSession(persisted, now);\n      writeLocal(completed);\n      setSession(completed);\n      if (userId && navigator.onLine) {\n        const reconciled = await flushPending(completed, userId);\n        setSession(reconciled);\n      }'''
          if mode.count(old_complete) != 1:
              raise SystemExit("cooking-mode.tsx: completion block drifted")
          mode = mode.replace(old_complete, new_complete, 1)
          mode = mode.replace(
              '''  }, [facts, persistAndSync, recoveredTimers, session, timeline, userId, writeLocal]);''',
              '''  }, [facts, flushPending, persistAndSync, recoveredTimers, session, timeline, userId, writeLocal]);''',
              1,
          )
          old_end = '''  const onEndCooking = useCallback(async () => {\n    if (!session) return;\n    const now = nowIso();\n    const ended = endLocalCookingSession(session, now);\n    writeLocal(ended);\n    setSession(ended);\n    if (supabase && userId && navigator.onLine) {\n      try { await endCookingSession(supabase, userId, session.sessionId, now); } catch { /* local End Cooking truth is retained */ }\n    }\n    router.back();\n  }, [router, session, userId, writeLocal]);'''
          new_end = '''  const onEndCooking = useCallback(async () => {\n    if (!session) return;\n    const now = nowIso();\n    const ended = endLocalCookingSession(session, now);\n    writeLocal(ended);\n    setSession(ended);\n    if (userId && navigator.onLine) {\n      const reconciled = await flushPending(ended, userId);\n      setSession(reconciled);\n    }\n    router.back();\n  }, [flushPending, router, session, userId, writeLocal]);'''
          if mode.count(old_end) != 1:
              raise SystemExit("cooking-mode.tsx: End Cooking block drifted")
          mode = mode.replace(old_end, new_end, 1)
          write(mode_path, mode)

          # Diary drafts are owner-scoped; purge the legacy unscoped key without reading it.
          diary_path = "components/nutrition/diary/logging-session.tsx"
          replace_once(
              diary_path,
              '''function draftKey(date: string, meal: string, plannedOccurrenceId?: string | null) { return `plaivra:nutrition-v1:diary-draft:${date}:${meal}${plannedOccurrenceId ? `:planned:${plannedOccurrenceId}` : ""}`; }''',
              '''function draftKey(userId: string, date: string, meal: string, plannedOccurrenceId?: string | null) { return `plaivra:nutrition-v1:diary-draft:${userId}:${date}:${meal}${plannedOccurrenceId ? `:planned:${plannedOccurrenceId}` : ""}`; }\nfunction legacyDraftKey(date: string, meal: string, plannedOccurrenceId?: string | null) { return `plaivra:nutrition-v1:diary-draft:${date}:${meal}${plannedOccurrenceId ? `:planned:${plannedOccurrenceId}` : ""}`; }''',
          )
          replace_once(
              diary_path,
              '''  const { session } = useAuth();\n  const token = session?.access_token;''',
              '''  const { session } = useAuth();\n  const userId = session?.user.id;\n  const token = session?.access_token;''',
          )
          diary = read(diary_path)
          old_draft_hooks = '''  const key = useMemo(() => draftKey(date, meal, plannedOccurrence?.id), [date, meal, plannedOccurrence?.id]);\n\n  useEffect(() => { const stored = localStorage.getItem(key); if (!stored) return; try { const draft = JSON.parse(stored) as DraftPayload; if (Date.now() - draft.savedAt <= DIARY_DRAFT_TTL_MS && Array.isArray(draft.plate)) setPlate(draft.plate); else localStorage.removeItem(key); } catch { localStorage.removeItem(key); } }, [key]);'''
          new_draft_hooks = '''  const key = useMemo(() => userId ? draftKey(userId, date, meal, plannedOccurrence?.id) : null, [date, meal, plannedOccurrence?.id, userId]);\n\n  useEffect(() => {\n    if (!userId) return;\n    const scopedKey = draftKey(userId, date, meal, plannedOccurrence?.id);\n    localStorage.removeItem(legacyDraftKey(date, meal, plannedOccurrence?.id));\n    setPlate([]);\n    const stored = localStorage.getItem(scopedKey);\n    if (!stored) return;\n    try {\n      const draft = JSON.parse(stored) as DraftPayload;\n      if (Date.now() - draft.savedAt <= DIARY_DRAFT_TTL_MS && Array.isArray(draft.plate)) setPlate(draft.plate);\n      else localStorage.removeItem(scopedKey);\n    } catch {\n      localStorage.removeItem(scopedKey);\n    }\n  }, [date, meal, plannedOccurrence?.id, userId]);'''
          if diary.count(old_draft_hooks) != 1:
              raise SystemExit("logging-session.tsx: draft recovery block drifted")
          diary = diary.replace(old_draft_hooks, new_draft_hooks, 1)
          old_write_hooks = '''  useEffect(() => { if (plate.length) localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), plate } satisfies DraftPayload)); }, [key, plate]);\n  const clearConfirmedDraft = useCallback(() => { localStorage.removeItem(key); }, [key]);'''
          new_write_hooks = '''  useEffect(() => {\n    if (!userId) return;\n    if (plate.length) localStorage.setItem(draftKey(userId, date, meal, plannedOccurrence?.id), JSON.stringify({ savedAt: Date.now(), plate } satisfies DraftPayload));\n  }, [date, meal, plannedOccurrence?.id, plate, userId]);\n  const clearConfirmedDraft = useCallback(() => { if (key) localStorage.removeItem(key); }, [key]);'''
          if diary.count(old_write_hooks) != 1:
              raise SystemExit("logging-session.tsx: draft persistence block drifted")
          diary = diary.replace(old_write_hooks, new_write_hooks, 1)
          write(diary_path, diary)

          # Update existing unit expectations to the new RPC authority.
          cooking_test_path = "services/nutrition-v1/server/cooking-sessions.test.ts"
          cooking_tests = read(cooking_test_path)
          old_fake = '''function fakeSupabase(tableQueries: Record<string, Query[]> = {}) {\n  const queues = Object.fromEntries(Object.entries(tableQueries).map(([table, values]) => [table, [...values]])) as Record<string, Query[]>;\n  const seen: Record<string, Query[]> = {};\n  const from = vi.fn((table: string) => {\n    const next = queues[table]?.shift();\n    if (!next) throw new Error(`Unexpected table query: ${table}`);\n    (seen[table] ??= []).push(next);\n    return next;\n  });\n  return { client: { from } as unknown as SupabaseClient, from, seen };\n}'''
          new_fake = '''function fakeSupabase(tableQueries: Record<string, Query[]> = {}, rpcResult: Result = { data: null, error: null }) {\n  const queues = Object.fromEntries(Object.entries(tableQueries).map(([table, values]) => [table, [...values]])) as Record<string, Query[]>;\n  const seen: Record<string, Query[]> = {};\n  const from = vi.fn((table: string) => {\n    const next = queues[table]?.shift();\n    if (!next) throw new Error(`Unexpected table query: ${table}`);\n    (seen[table] ??= []).push(next);\n    return next;\n  });\n  const rpc = vi.fn(async () => rpcResult);\n  return { client: { from, rpc } as unknown as SupabaseClient, from, rpc, seen };\n}'''
          if cooking_tests.count(old_fake) != 1:
              raise SystemExit("cooking-sessions.test.ts: fakeSupabase block drifted")
          cooking_tests = cooking_tests.replace(old_fake, new_fake, 1)
          sync_success_pattern = r'  it\("syncs local state with optimistic session revision authority and owner-scoped child upserts", async \(\) => \{[\s\S]*?\n  \}\);\n\n  it\("rejects a stale sync revision before child state is written"'
          sync_success_replacement = '''  it("syncs local state with optimistic session revision authority through one owner-derived transactional RPC", async () => {\n    const db = fakeSupabase({}, { data: { stateRevision: 5 }, error: null });\n\n    const synced = await syncCookingSessionState(db.client, userId, sessionId, {\n      expectedRevision: 4,\n      currentActionKey: action2,\n      lastActiveAt: "2026-08-26T07:12:00.000Z",\n      actionStates: [\n        { id: actionState1, actionKey: action1, state: "completed", stateRevision: 4, completedAt: "2026-08-26T07:08:00.000Z" },\n        { id: actionState2, actionKey: action2, state: "running_background", stateRevision: 5 },\n      ],\n      timers: [\n        { id: "a1a1a1a1-a1a1-41a1-81a1-a1a1a1a1a1a1", actionStateId: actionState2, timerName: "Sauce", durationSeconds: 300, status: "running", startedAt: "2026-08-26T07:06:00.000Z", targetAt: "2026-08-26T07:11:00.000Z" },\n      ],\n    });\n\n    expect(synced.stateRevision).toBe(5);\n    expect(db.rpc).toHaveBeenCalledWith("sync_nutrition_cooking_session_state", expect.objectContaining({\n      p_session_id: sessionId,\n      p_expected_revision: 4,\n      p_current_action_key: action2,\n      p_action_states: expect.arrayContaining([\n        expect.objectContaining({ id: actionState1, action_key: action1 }),\n        expect.objectContaining({ id: actionState2, action_key: action2 }),\n      ]),\n      p_timers: expect.arrayContaining([\n        expect.objectContaining({ action_state_id: actionState2, timer_name: "Sauce" }),\n      ]),\n    }));\n    expect(db.from).not.toHaveBeenCalled();\n  });\n\n  it("rejects a stale sync revision before child state is written"'''
          cooking_tests, count = re.subn(sync_success_pattern, sync_success_replacement, cooking_tests, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("cooking-sessions.test.ts: sync test block drifted")
          stale_pattern = r'  it\("rejects a stale sync revision before child state is written", async \(\) => \{[\s\S]*?\n  \}\);\n\n  it\("keeps completion and explicit End Cooking separate from food consumption"'
          stale_replacement = '''  it("rejects a stale sync revision before child state is written", async () => {\n    const db = fakeSupabase({}, { data: null, error: { message: "Cooking Session revision conflict: local state is stale.", code: "40001" } });\n\n    await expect(syncCookingSessionState(db.client, userId, sessionId, {\n      expectedRevision: 4,\n      currentActionKey: action2,\n      actionStates: [],\n      timers: [],\n    })).rejects.toThrow(/revision|conflict|stale/i);\n\n    expect(db.rpc).toHaveBeenCalledWith("sync_nutrition_cooking_session_state", expect.any(Object));\n    expect(db.from).not.toHaveBeenCalled();\n  });\n\n  it("keeps completion and explicit End Cooking separate from food consumption"'''
          cooking_tests, count = re.subn(stale_pattern, stale_replacement, cooking_tests, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("cooking-sessions.test.ts: stale test block drifted")
          write(cooking_test_path, cooking_tests)

          recipes_test_path = "services/nutrition-v1/server/recipes.test.ts"
          recipes_tests = read(recipes_test_path)
          autosave_pattern = r'  it\("autosaves only the Working Draft and never mutates a published Recipe version", async \(\) => \{[\s\S]*?\n  \}\);\n\n  it\("publishes v1 -> Working Draft -> v2 only through the owner-derived transactional RPC"'
          autosave_replacement = '''  it("autosaves the Working Draft atomically and never mutates a published Recipe version", async () => {\n    const db = fakeSupabase({}, {\n      data: { id: draftId, recipe_id: recipeId, user_id: userId, name: "Chicken bowl edited", servings: 4 },\n      error: null,\n    });\n\n    await autosaveRecipeDraft(db.client, userId, recipeId, { ...completeDraft, name: "Chicken bowl edited" });\n\n    expect(db.rpc).toHaveBeenCalledWith("autosave_nutrition_recipe_draft", expect.objectContaining({\n      p_recipe_id: recipeId,\n      p_ingredients: completeDraft.ingredients,\n      p_instructions: completeDraft.instructions,\n      p_equipment: completeDraft.equipment,\n    }));\n    expect(db.from).not.toHaveBeenCalled();\n  });\n\n  it("publishes v1 -> Working Draft -> v2 only through the owner-derived transactional RPC"'''
          recipes_tests, count = re.subn(autosave_pattern, autosave_replacement, recipes_tests, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("recipes.test.ts: autosave test block drifted")
          write(recipes_test_path, recipes_tests)

          migration = r'''-- Nutrition V1 post-review atomicity corrections.\n-- Repository-only additive migration. Do not apply to Production without explicit authority.\n\ncreate or replace function public.sync_nutrition_cooking_session_state(\n  p_session_id uuid,\n  p_expected_revision bigint,\n  p_current_action_key text,\n  p_last_active_at timestamptz,\n  p_action_states jsonb default '[]'::jsonb,\n  p_timers jsonb default '[]'::jsonb\n)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = pg_catalog, public\nas $$\ndeclare\n  v_user_id uuid := auth.uid();\n  v_current_revision bigint;\n  v_next_revision bigint;\n  v_item jsonb;\n  v_action_id uuid;\n  v_action_state_id uuid;\n  v_timer_id uuid;\nbegin\n  if v_user_id is null then\n    raise exception 'Authentication required.' using errcode = '42501';\n  end if;\n  if p_expected_revision is null or p_expected_revision < 0 then\n    raise exception 'Invalid Cooking Session revision.' using errcode = '22023';\n  end if;\n  if jsonb_typeof(coalesce(p_action_states, '[]'::jsonb)) <> 'array'\n     or jsonb_typeof(coalesce(p_timers, '[]'::jsonb)) <> 'array' then\n    raise exception 'Cooking Session state payload must use arrays.' using errcode = '22023';\n  end if;\n\n  select state_revision\n    into v_current_revision\n  from public.nutrition_cooking_sessions\n  where id = p_session_id\n    and user_id = v_user_id\n    and status = 'active'\n    and state_revision = p_expected_revision\n  for update;\n\n  if not found then\n    raise exception 'Cooking Session revision conflict: local state is stale.' using errcode = '40001';\n  end if;\n\n  v_next_revision := p_expected_revision + 1;\n  update public.nutrition_cooking_sessions\n  set current_action_key = p_current_action_key,\n      last_active_at = coalesce(p_last_active_at, clock_timestamp()),\n      state_revision = v_next_revision\n  where id = p_session_id\n    and user_id = v_user_id\n    and status = 'active'\n    and state_revision = p_expected_revision;\n\n  for v_item in select value from jsonb_array_elements(coalesce(p_action_states, '[]'::jsonb)) loop\n    v_action_id := nullif(v_item->>'id', '')::uuid;\n    update public.nutrition_cooking_action_states\n    set state = v_item->>'state',\n        state_revision = (v_item->>'state_revision')::bigint,\n        activated_at = nullif(v_item->>'activated_at', '')::timestamptz,\n        completed_at = nullif(v_item->>'completed_at', '')::timestamptz,\n        deferred_at = nullif(v_item->>'deferred_at', '')::timestamptz,\n        skipped_at = nullif(v_item->>'skipped_at', '')::timestamptz\n    where id = v_action_id\n      and session_id = p_session_id\n      and user_id = v_user_id\n      and action_key = v_item->>'action_key';\n    if not found then\n      raise exception 'Cooking Session action state does not belong to this session.' using errcode = '42501';\n    end if;\n  end loop;\n\n  for v_item in select value from jsonb_array_elements(coalesce(p_timers, '[]'::jsonb)) loop\n    v_timer_id := nullif(v_item->>'id', '')::uuid;\n    v_action_state_id := nullif(v_item->>'action_state_id', '')::uuid;\n    perform 1\n    from public.nutrition_cooking_action_states\n    where id = v_action_state_id\n      and session_id = p_session_id\n      and user_id = v_user_id;\n    if not found then\n      raise exception 'Cooking Session timer action state does not belong to this session.' using errcode = '42501';\n    end if;\n\n    insert into public.nutrition_cooking_timers (\n      id, action_state_id, user_id, timer_name, duration_seconds, status,\n      started_at, target_at, paused_at, paused_remaining_seconds, completed_at, cancelled_at\n    ) values (\n      v_timer_id,\n      v_action_state_id,\n      v_user_id,\n      btrim(v_item->>'timer_name'),\n      (v_item->>'duration_seconds')::integer,\n      v_item->>'status',\n      nullif(v_item->>'started_at', '')::timestamptz,\n      nullif(v_item->>'target_at', '')::timestamptz,\n      nullif(v_item->>'paused_at', '')::timestamptz,\n      nullif(v_item->>'paused_remaining_seconds', '')::integer,\n      nullif(v_item->>'completed_at', '')::timestamptz,\n      nullif(v_item->>'cancelled_at', '')::timestamptz\n    )\n    on conflict (id) do update\n    set action_state_id = excluded.action_state_id,\n        timer_name = excluded.timer_name,\n        duration_seconds = excluded.duration_seconds,\n        status = excluded.status,\n        started_at = excluded.started_at,\n        target_at = excluded.target_at,\n        paused_at = excluded.paused_at,\n        paused_remaining_seconds = excluded.paused_remaining_seconds,\n        completed_at = excluded.completed_at,\n        cancelled_at = excluded.cancelled_at\n    where nutrition_cooking_timers.user_id = v_user_id;\n    if not found then\n      raise exception 'Cooking Session timer does not belong to this owner.' using errcode = '42501';\n    end if;\n  end loop;\n\n  return jsonb_build_object('stateRevision', v_next_revision);\nend;\n$$;\n\nrevoke all on function public.sync_nutrition_cooking_session_state(uuid, bigint, text, timestamptz, jsonb, jsonb) from public, anon;\ngrant execute on function public.sync_nutrition_cooking_session_state(uuid, bigint, text, timestamptz, jsonb, jsonb) to authenticated, service_role;\n\ncreate or replace function public.autosave_nutrition_recipe_draft(\n  p_recipe_id uuid,\n  p_draft jsonb,\n  p_ingredients jsonb default '[]'::jsonb,\n  p_instructions jsonb default '[]'::jsonb,\n  p_equipment jsonb default '[]'::jsonb\n)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = pg_catalog, public\nas $$\ndeclare\n  v_user_id uuid := auth.uid();\n  v_draft public.nutrition_recipe_drafts%rowtype;\n  v_item jsonb;\n  v_position bigint;\nbegin\n  if v_user_id is null then\n    raise exception 'Authentication required.' using errcode = '42501';\n  end if;\n  if jsonb_typeof(coalesce(p_draft, '{}'::jsonb)) <> 'object'\n     or jsonb_typeof(coalesce(p_ingredients, '[]'::jsonb)) <> 'array'\n     or jsonb_typeof(coalesce(p_instructions, '[]'::jsonb)) <> 'array'\n     or jsonb_typeof(coalesce(p_equipment, '[]'::jsonb)) <> 'array' then\n    raise exception 'Recipe Working Draft autosave payload is invalid.' using errcode = '22023';\n  end if;\n\n  perform 1\n  from public.nutrition_recipes\n  where id = p_recipe_id\n    and user_id = v_user_id\n    and deleted_at is null\n  for update;\n  if not found then\n    raise exception 'Active Recipe not found.' using errcode = 'P0002';\n  end if;\n\n  select draft.*\n    into v_draft\n  from public.nutrition_recipe_drafts draft\n  where draft.recipe_id = p_recipe_id\n    and draft.user_id = v_user_id\n  for update;\n  if not found then\n    raise exception 'Recipe Working Draft was not found.' using errcode = 'P0002';\n  end if;\n\n  update public.nutrition_recipe_drafts draft\n  set name = nullif(btrim(p_draft->>'name'), ''),\n      servings = nullif(p_draft->>'servings', '')::numeric,\n      total_cooked_weight_g = nullif(p_draft->>'total_cooked_weight_g', '')::numeric,\n      total_time_minutes = nullif(p_draft->>'total_time_minutes', '')::integer,\n      notes = nullif(btrim(p_draft->>'notes'), ''),\n      draft_metadata = coalesce(p_draft->'draft_metadata', '{}'::jsonb)\n  where draft.id = v_draft.id\n    and draft.user_id = v_user_id\n  returning draft.* into v_draft;\n\n  delete from public.nutrition_recipe_ingredients\n  where recipe_draft_id = v_draft.id and user_id = v_user_id;\n  delete from public.nutrition_recipe_actions\n  where recipe_draft_id = v_draft.id and user_id = v_user_id;\n  delete from public.nutrition_recipe_equipment\n  where recipe_draft_id = v_draft.id and user_id = v_user_id;\n\n  for v_item, v_position in\n    select value, ordinality - 1\n    from jsonb_array_elements(coalesce(p_ingredients, '[]'::jsonb)) with ordinality\n  loop\n    insert into public.nutrition_recipe_ingredients (\n      user_id, recipe_version_id, recipe_draft_id, position, food_id, ingredient_name, quantity, unit, frozen_nutrition\n    ) values (\n      v_user_id, null, v_draft.id, v_position::integer, nullif(v_item->>'food_id', '')::uuid,\n      btrim(v_item->>'ingredient_name'), nullif(v_item->>'quantity', '')::numeric,\n      nullif(btrim(v_item->>'unit'), ''),\n      case when jsonb_typeof(v_item->'frozen_nutrition') = 'null' then null else v_item->'frozen_nutrition' end\n    );\n  end loop;\n\n  for v_item, v_position in\n    select value, ordinality - 1\n    from jsonb_array_elements(coalesce(p_instructions, '[]'::jsonb)) with ordinality\n  loop\n    insert into public.nutrition_recipe_actions (\n      user_id, recipe_version_id, recipe_draft_id, position, instruction, ingredient_refs, equipment_refs,\n      duration_seconds, heat_or_temperature, doneness_or_result_cue, prep_ahead_cue, track_key,\n      dependency_action_ids, can_run_in_background, metadata\n    ) values (\n      v_user_id, null, v_draft.id, v_position::integer, btrim(v_item->>'instruction'),\n      coalesce(v_item->'ingredient_refs', '[]'::jsonb), coalesce(v_item->'equipment_refs', '[]'::jsonb),\n      nullif(v_item->>'duration_seconds', '')::integer, nullif(btrim(v_item->>'heat_or_temperature'), ''),\n      nullif(btrim(v_item->>'doneness_or_result_cue'), ''), nullif(btrim(v_item->>'prep_ahead_cue'), ''),\n      nullif(btrim(v_item->>'track_key'), ''),\n      coalesce(array(select value::uuid from jsonb_array_elements_text(coalesce(v_item->'dependency_action_ids', '[]'::jsonb))), '{}'::uuid[]),\n      coalesce((v_item->>'can_run_in_background')::boolean, false), coalesce(v_item->'metadata', '{}'::jsonb)\n    );\n  end loop;\n\n  for v_item, v_position in\n    select value, ordinality - 1\n    from jsonb_array_elements(coalesce(p_equipment, '[]'::jsonb)) with ordinality\n  loop\n    insert into public.nutrition_recipe_equipment (\n      user_id, recipe_version_id, recipe_draft_id, position, name, quantity, note\n    ) values (\n      v_user_id, null, v_draft.id, v_position::integer, btrim(v_item->>'name'),\n      nullif(v_item->>'quantity', '')::numeric, nullif(btrim(v_item->>'note'), '')\n    );\n  end loop;\n\n  return to_jsonb(v_draft);\nend;\n$$;\n\nrevoke all on function public.autosave_nutrition_recipe_draft(uuid, jsonb, jsonb, jsonb, jsonb) from public, anon;\ngrant execute on function public.autosave_nutrition_recipe_draft(uuid, jsonb, jsonb, jsonb, jsonb) to authenticated, service_role;\n\nnotify pgrst, 'reload schema';\n'''
          write("supabase/migrations/20260827060000_nutrition_v1_review_atomicity_corrections.sql", migration)

          verification = r'''-- Disposable verification for Nutrition V1 post-review atomicity corrections.\n\set ON_ERROR_STOP on\n\nbegin;\n\ncreate or replace function pg_temp.nv1_review_assert(p_condition boolean, p_message text)\nreturns void\nlanguage plpgsql\nas $function$\nbegin\n  if not coalesce(p_condition, false) then\n    raise exception '%', p_message;\n  end if;\nend\n$function$;\n\ncreate or replace function pg_temp.nv1_review_rejected(p_sql text, p_message text)\nreturns void\nlanguage plpgsql\nas $function$\nbegin\n  begin\n    execute p_sql;\n  exception when others then\n    return;\n  end;\n  raise exception '%', p_message;\nend\n$function$;\n\ngrant execute on function pg_temp.nv1_review_assert(boolean, text) to public;\ngrant execute on function pg_temp.nv1_review_rejected(text, text) to public;\n\ndo $catalog$\ndeclare\n  v_cooking regprocedure := to_regprocedure('public.sync_nutrition_cooking_session_state(uuid,bigint,text,timestamp with time zone,jsonb,jsonb)');\n  v_recipe regprocedure := to_regprocedure('public.autosave_nutrition_recipe_draft(uuid,jsonb,jsonb,jsonb,jsonb)');\nbegin\n  if v_cooking is null then\n    raise exception 'Nutrition V1 cooking atomic sync RPC missing.';\n  end if;\n  if v_recipe is null then\n    raise exception 'Nutrition V1 recipe atomic autosave RPC missing.';\n  end if;\n  if not (select prosecdef from pg_proc where oid = v_cooking)\n     or not (select prosecdef from pg_proc where oid = v_recipe)\n     or position('auth.uid()' in pg_get_functiondef(v_cooking)) = 0\n     or position('auth.uid()' in pg_get_functiondef(v_recipe)) = 0 then\n    raise exception 'Nutrition V1 atomic review RPC owner authority invalid.';\n  end if;\n  if not has_function_privilege('authenticated', v_cooking, 'EXECUTE')\n     or not has_function_privilege('authenticated', v_recipe, 'EXECUTE')\n     or not has_function_privilege('service_role', v_cooking, 'EXECUTE')\n     or not has_function_privilege('service_role', v_recipe, 'EXECUTE')\n     or has_function_privilege('anon', v_cooking, 'EXECUTE')\n     or has_function_privilege('anon', v_recipe, 'EXECUTE') then\n    raise exception 'Nutrition V1 atomic review RPC execute grants invalid.';\n  end if;\nend\n$catalog$;\n\ninsert into auth.users (\n  id, aud, role, email, encrypted_password, raw_app_meta_data, raw_user_meta_data, created_at, updated_at\n) values (\n  'a2700000-0000-4000-8000-000000000001', 'authenticated', 'authenticated',\n  'nutrition-review-owner@example.invalid', '',\n  '{"provider":"email","providers":["email"]}'::jsonb, '{}'::jsonb, now(), now()\n);\n\nset local role authenticated;\nselect set_config('request.jwt.claim.sub', 'a2700000-0000-4000-8000-000000000001', true);\nselect set_config('request.jwt.claim.role', 'authenticated', true);\n\ninsert into public.nutrition_cooking_sessions (\n  id, user_id, recipe_id, recipe_version_id, frozen_recipe_snapshot, current_action_key, state_revision\n) values (\n  'a2700000-0000-4000-8000-000000000010',\n  'a2700000-0000-4000-8000-000000000001',\n  'a2700000-0000-4000-8000-000000000020',\n  'a2700000-0000-4000-8000-000000000021',\n  '{"schemaVersion":1,"recipe":{"name":"Fixture"},"ingredients":[],"actions":[],"equipment":[]}'::jsonb,\n  'step-1', 0\n);\ninsert into public.nutrition_cooking_action_states (\n  id, session_id, user_id, action_key, state, state_revision\n) values (\n  'a2700000-0000-4000-8000-000000000030',\n  'a2700000-0000-4000-8000-000000000010',\n  'a2700000-0000-4000-8000-000000000001',\n  'step-1', 'active', 0\n);\n\nselect public.sync_nutrition_cooking_session_state(\n  'a2700000-0000-4000-8000-000000000010', 0, 'step-1', clock_timestamp(),\n  '[{"id":"a2700000-0000-4000-8000-000000000030","action_key":"step-1","state":"completed","state_revision":1,"completed_at":"2026-08-27T06:00:00Z"}]'::jsonb,\n  '[]'::jsonb\n);\nselect pg_temp.nv1_review_assert(\n  (select state_revision = 1 from public.nutrition_cooking_sessions where id = 'a2700000-0000-4000-8000-000000000010')\n  and (select state = 'completed' from public.nutrition_cooking_action_states where id = 'a2700000-0000-4000-8000-000000000030'),\n  'Nutrition V1 cooking atomic sync RPC did not persist the complete state.'\n);\n\nselect pg_temp.nv1_review_rejected(\n  $$select public.sync_nutrition_cooking_session_state(\n    'a2700000-0000-4000-8000-000000000010', 1, 'step-1', clock_timestamp(),\n    '[{"id":"a2700000-0000-4000-8000-000000000030","action_key":"step-1","state":"completed","state_revision":2,"completed_at":"2026-08-27T06:01:00Z"}]'::jsonb,\n    '[{"id":"a2700000-0000-4000-8000-000000000040","action_state_id":"a2700000-0000-4000-8000-000000000099","timer_name":"Bad","duration_seconds":60,"status":"idle"}]'::jsonb\n  )$$,\n  'Nutrition V1 cooking atomic sync RPC accepted an invalid timer owner relation.'\n);\nselect pg_temp.nv1_review_assert(\n  (select state_revision = 1 from public.nutrition_cooking_sessions where id = 'a2700000-0000-4000-8000-000000000010'),\n  'Nutrition V1 cooking atomic sync RPC failed to roll back its parent revision.'\n);\n\ninsert into public.nutrition_recipes (id, user_id, name) values (\n  'a2700000-0000-4000-8000-000000000050', 'a2700000-0000-4000-8000-000000000001', 'Original recipe'\n);\ninsert into public.nutrition_recipe_drafts (id, recipe_id, user_id, name, servings) values (\n  'a2700000-0000-4000-8000-000000000051', 'a2700000-0000-4000-8000-000000000050',\n  'a2700000-0000-4000-8000-000000000001', 'Original draft', 2\n);\ninsert into public.nutrition_recipe_ingredients (\n  id, user_id, recipe_draft_id, position, ingredient_name, quantity, unit\n) values (\n  'a2700000-0000-4000-8000-000000000052', 'a2700000-0000-4000-8000-000000000001',\n  'a2700000-0000-4000-8000-000000000051', 0, 'Original ingredient', 1, 'g'\n);\n\nselect pg_temp.nv1_review_rejected(\n  $$select public.autosave_nutrition_recipe_draft(\n    'a2700000-0000-4000-8000-000000000050',\n    '{"name":"Broken replacement","servings":4,"draft_metadata":{}}'::jsonb,\n    '[{"ingredient_name":"","quantity":1,"unit":"g"}]'::jsonb,\n    '[]'::jsonb, '[]'::jsonb\n  )$$,\n  'Nutrition V1 recipe atomic autosave RPC accepted an invalid replacement.'\n);\nselect pg_temp.nv1_review_assert(\n  (select name = 'Original draft' from public.nutrition_recipe_drafts where id = 'a2700000-0000-4000-8000-000000000051')\n  and exists (select 1 from public.nutrition_recipe_ingredients where id = 'a2700000-0000-4000-8000-000000000052' and ingredient_name = 'Original ingredient'),\n  'Nutrition V1 recipe atomic autosave RPC failed to preserve the prior valid draft after rejection.'\n);\n\nrollback;\n'''
          write("supabase/verification/nutrition-v1-review-atomicity.sql", verification)

          # Register the new verification before release preflight.
