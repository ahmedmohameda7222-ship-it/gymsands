name: PR144 Final Pre-Merge Correction Gate

on:
  push:
    branches:
      - feat/active-workout-full-implementation
    paths:
      - .github/workflows/pr144-final-premerge-c4.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reliability presentation coordinator
        run: python scripts/pr144-final-premerge-c4-patch.py
      - name: Deterministic dependency install
        run: npm ci
      - name: Focused final pre-merge contracts
        run: |
          npx vitest run \
            components/workouts/active-workout/active-workout-execution-capability.test.ts \
            services/database/direct-workout-sessions.test.ts \
            'app/(private)/workouts/session/[id]/page.test.tsx' \
            components/workouts/active-workout/active-workout-reliability-priority.test.ts \
            lib/product/active-workout-pr144-correction-authority.test.ts \
            lib/product/active-workout-aw10-closure.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Patch hygiene
        run: git diff --check
      - name: Commit validated correction
        run: |
          git config user.name "Plaivra Repository Delivery"
          git config user.email "actions@users.noreply.github.com"
          git add components/workouts/active-workout/active-workout-core-session-implementation.tsx
          git rm scripts/pr144-final-premerge-c4-patch.py
          git diff --cached --check
          git commit -m "fix: coordinate Active Workout reliability states"
          git push origin HEAD:feat/active-workout-full-implementation
