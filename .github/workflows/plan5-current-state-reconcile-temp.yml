name: Plan 5 Current State Reconcile Temp
on:
  push:
    branches: [chore/plan5-serving-correction-reconciliation]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic current-state replacements
        run: node scripts/reconcile-plan5-current-state-temp.mjs
      - name: Commit reconciliation files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/release-target-compatibility.test.mjs scripts/release-compatibility-contract.test.mjs lib/product/nullable-meal-plan-snapshot-migration.test.ts lib/product/food-catalog-ingestion-boundary.test.ts lib/product/food-catalog-generation-authority-migration.test.ts lib/product/food-catalog-ingestion-v2-authority-migration.test.ts docs/architecture/migration-ledger-reconciliation.md
          git diff --cached --check
          git commit -m 'chore: reconcile Plan 5 correction current state'
          git push origin HEAD:${GITHUB_REF_NAME}
