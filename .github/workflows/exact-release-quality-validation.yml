name: Exact Release Quality Validation

on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact 40-character PR head SHA already validated by canonical Quality
        required: true
        type: string
      comparison_base:
        description: Exact 40-character comparison base recorded by canonical Quality
        required: true
        type: string
      quality_run_id:
        description: Existing successful canonical PR Quality run ID
        required: true
        type: string

permissions:
  actions: write # dispatch and inspect exact workflow runs/artifacts
  contents: read # checkout exact PR head and ledger

concurrency:
  group: exact-release-quality-${{ inputs.reviewed_commit }}-${{ inputs.quality_run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      COMPARISON_BASE: ${{ inputs.comparison_base }}
      QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
      HEAD_REF: ${{ github.ref_name }}
      DISPATCH_COMMIT: ${{ github.sha }}
    steps:
      - name: Validate exact dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$COMPARISON_BASE" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$QUALITY_RUN_ID" =~ ^[0-9]+$ ]]
          test "$GITHUB_REF_TYPE" = "branch"
          test "${DISPATCH_COMMIT,,}" = "${REVIEWED_COMMIT,,}"

      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_commit }}
          fetch-depth: 0

      - name: Verify checked-out and dispatched ref identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REVIEWED_COMMIT,,}"
          test "$(git rev-parse "origin/${HEAD_REF}^{commit}")" = "${REVIEWED_COMMIT,,}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Run request-bound exact release orchestration
        id: orchestration
        shell: bash
        run: node scripts/exact-release-orchestrator.mjs

      - name: Upload exact release validation summary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.orchestration.outputs.artifact_name }}
          path: ${{ steps.orchestration.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exact-release-diagnostics-${{ inputs.reviewed_commit }}-${{ github.run_attempt }}
          path: exact-release-diagnostics
          if-no-files-found: error
          retention-days: 30
