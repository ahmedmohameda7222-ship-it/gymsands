name: AW-8 AW-9 one-shot correction

on:
  push:
    branches:
      - feat/active-workout-aw8-aw9-aw10-closure

permissions:
  contents: write

concurrency:
  group: aw89-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw8-aw9-aw10-closure
          fetch-depth: 0

      - name: Configure repository identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply long-term AW-8 and AW-9 corrections
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          function replaceOnce(path, before, after) {
            const source = readFileSync(path, "utf8");
            const first = source.indexOf(before);
            const last = source.lastIndexOf(before);
            if (first < 0 || first !== last) {
              throw new Error(`${path}: expected exactly one replacement target`);
            }
            writeFileSync(path, source.replace(before, after), "utf8");
          }

          const core = "components/workouts/active-workout/active-workout-core-session-implementation.tsx";

          replaceOnce(core, 'import Link from "next/link";\n', "");
          replaceOnce(
            core,
            'import {\n  Dialog,\n  DialogContent,\n  DialogDescription,\n  DialogHeader,\n  DialogTitle\n} from "@/components/ui/dialog";\n',
            ""
          );
          replaceOnce(
            core,
            'import { ActiveWorkoutConflict } from "@/components/workouts/active-workout/active-workout-conflict";\n',
            'import { ActiveWorkoutConflict } from "@/components/workouts/active-workout/active-workout-conflict";\nimport { ActiveWorkoutDeviceConflict } from "@/components/workouts/active-workout/active-workout-device-conflict";\n'
          );
          replaceOnce(
            core,
            `  const deviceConflictBackHref = userId
    ? readPreviousActiveWorkoutRoute(userId)
      ?? (sourceKind === "plan-day" ? "/my-workout/plans" : "/workouts")
    : "/workouts";`,
            `  const defaultDeviceConflictBackHref =
    sourceKind === "plan-day" ? "/my-workout/plans" : "/workouts";
  const deviceConflictBackHref =
    controllerConflictDeviceId && userId
      ? readPreviousActiveWorkoutRoute(userId)
        ?? defaultDeviceConflictBackHref
      : defaultDeviceConflictBackHref;`
          );
          replaceOnce(
            core,
            `      {controllerConflictDeviceId ? (
        <section
          data-aw9-device-conflict
          role="status"
          className="fixed inset-x-3 top-3 z-[65] mx-auto max-w-xl rounded-[18px] border border-warning/40 bg-background/95 p-4 shadow-lg backdrop-blur"
        >
          <h2 className="font-semibold">{tr("multiDevice.activeElsewhere")}</h2>
          <p className="mt-1 text-sm text-muted-foreground">
            {tr("multiDevice.viewOnly")}
          </p>
          <div className="mt-3 grid gap-2">
            <Button
              type="button"
              variant="outline"
              className="min-h-11 w-full"
              onClick={() => {
                document
                  .querySelector("[data-aw5-execution-shell]")
                  ?.scrollIntoView({ block: "start" });
              }}
            >
              {tr("multiDevice.viewCurrent")}
            </Button>
            <Button
              type="button"
              className="min-h-11 w-full"
              onClick={() => setTakeoverConfirmationOpen(true)}
              disabled={
                isSaving
                || (typeof navigator !== "undefined" && !navigator.onLine)
              }
            >
              {tr("multiDevice.takeOver")}
            </Button>
            <Button asChild variant="ghost" className="min-h-11 w-full">
              <Link href={deviceConflictBackHref} prefetch={false}>
                {tr("multiDevice.goBack")}
              </Link>
            </Button>
          </div>
        </section>
      ) : null}
      <Dialog
        open={takeoverConfirmationOpen}
        onOpenChange={setTakeoverConfirmationOpen}
      >
        <DialogContent data-aw9-takeover-confirmation className="sm:max-w-md">
          <DialogHeader>
            <DialogTitle>{tr("multiDevice.takeoverConfirmTitle")}</DialogTitle>
            <DialogDescription>
              {tr("multiDevice.takeoverConfirmDescription")}
            </DialogDescription>
          </DialogHeader>
          <div className="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <Button
              type="button"
              variant="outline"
              className="min-h-12"
              onClick={() => setTakeoverConfirmationOpen(false)}
              disabled={isSaving}
            >
              {tr("common.back")}
            </Button>
            <Button
              type="button"
              className="min-h-12"
              onClick={() => {
                setTakeoverConfirmationOpen(false);
                void takeOverWorkout();
              }}
              disabled={isSaving}
            >
              {tr("multiDevice.confirmTakeover")}
            </Button>
          </div>
        </DialogContent>
      </Dialog>`,
            `      <ActiveWorkoutDeviceConflict
        active={Boolean(controllerConflictDeviceId)}
        busy={isSaving}
        online={typeof navigator === "undefined" || navigator.onLine}
        backHref={deviceConflictBackHref}
        takeoverOpen={takeoverConfirmationOpen}
        onTakeoverOpenChange={setTakeoverConfirmationOpen}
        onViewCurrent={() => {
          document
            .querySelector("[data-aw5-execution-shell]")
            ?.scrollIntoView({ block: "start" });
        }}
        onConfirmTakeover={() => {
          setTakeoverConfirmationOpen(false);
          void takeOverWorkout();
        }}
        tr={tr}
      />`
          );

          const store = "lib/workouts/active-session-store/store-core.ts";
          replaceOnce(
            store,
            `        if (typeof indexedDB !== "undefined") {
          staleCleanupPromise ??= clearStaleActiveWorkoutData()
            .catch(() => undefined);
          await staleCleanupPromise;
        }
        const cached = typeof indexedDB === "undefined"
          ? null
          : await readActiveWorkoutSessionCache(
              snapshot.userId,
              snapshot.workoutSessionId
            ).catch(() => null);
        if (cached && isOffline()) {`,
            `        const offline = isOffline();
        if (typeof indexedDB !== "undefined") {
          staleCleanupPromise ??= clearStaleActiveWorkoutData()
            .catch(() => undefined);
          if (offline) await staleCleanupPromise;
        }
        const cached = !offline || typeof indexedDB === "undefined"
          ? null
          : await readActiveWorkoutSessionCache(
              snapshot.userId,
              snapshot.workoutSessionId
            ).catch(() => null);
        if (cached) {`
          );
          replaceOnce(
            store,
            `          if (localExecutionState) dispatcher.replace(localExecutionState);
          return;
        }
        if (options.reconcile !== false && coordinator()) {`,
            `          if (localExecutionState) dispatcher.replace(localExecutionState);
          return;
        }
        if (offline) {
          throw new ActiveSessionError(
            "hydration_failed",
            "No durable offline snapshot is available for this workout."
          );
        }
        if (options.reconcile !== false && coordinator()) {`
          );

          const migration = "supabase/migrations/20260731090000_active_workout_aw9_offline_multi_device.sql";
          replaceOnce(
            migration,
            "  if jsonb_object_length(v_payload) <> 3\n",
            "  if (select pg_catalog.count(*) from pg_catalog.jsonb_object_keys(v_payload)) <> 3\n"
          );
          NODE

          git diff --check
          git add \
            components/workouts/active-workout/active-workout-core-session-implementation.tsx \
            lib/workouts/active-session-store/store-core.ts \
            supabase/migrations/20260731090000_active_workout_aw9_offline_multi_device.sql
          git commit -m "fix(active-workout): harden AW-9 controller and hydration boundaries"

      - name: Record immutable pending migration evidence and remove one-shot workflow
        run: |
          EVIDENCE_COMMIT="$(git rev-parse HEAD)"
          export EVIDENCE_COMMIT
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, writeFileSync } = require("node:fs");

          const migrationFile = "20260731090000_active_workout_aw9_offline_multi_device.sql";
          const migrationPath = `supabase/migrations/${migrationFile}`;
          const migrationBytes = readFileSync(migrationPath);
          const sha256 = createHash("sha256").update(migrationBytes).digest("hex");
          const gitBlob = createHash("sha1")
            .update(Buffer.from(`blob ${migrationBytes.length}\0`))
            .update(migrationBytes)
            .digest("hex");
          const evidenceCommit = process.env.EVIDENCE_COMMIT;
          if (!/^[a-f0-9]{40}$/.test(evidenceCommit ?? "")) {
            throw new Error("Invalid evidence commit.");
          }

          const ledgerPath = "supabase/migration-ledger.json";
          const ledger = JSON.parse(readFileSync(ledgerPath, "utf8"));
          const otherUnresolved = ledger.entries.filter(
            (entry) =>
              entry.localFile !== migrationFile
              && !["applied", "applied_version_alias"].includes(entry.state)
          );
          if (otherUnresolved.length) {
            throw new Error("Unexpected pre-existing unresolved migration entries.");
          }
          ledger.entries = ledger.entries.filter(
            (entry) => entry.localFile !== migrationFile
          );
          ledger.entries.push({
            localFile: migrationFile,
            state: "pending",
            evidenceCommit,
            repositorySha256: sha256,
            repositoryGitBlob: gitBlob,
            note:
              "Repository-only AW-9 controller authority migration pending independent review. It has not been applied to Supabase Production. Do not replay any applied migration."
          });
          ledger.entries.sort((left, right) =>
            left.localFile.localeCompare(right.localFile)
          );
          ledger.auditedRepositoryCommit = evidenceCommit;
          ledger.capturedAt = new Date().toISOString();
          ledger.pendingCount = 1;
          ledger.unresolvedCount = 1;
          ledger.historyRepair = {
            ...ledger.historyRepair,
            state: "pending",
            pendingCount: 1,
            unresolvedCount: 1,
            note:
              "Plaivra Production contains 75 physical migration records and remains reconciled through generated AW-4 migration 20260726114212. Repository migration 20260731090000_active_workout_aw9_offline_multi_device.sql is pending review and has not been applied. Do not replay any applied migration."
          };
          writeFileSync(ledgerPath, `${JSON.stringify(ledger, null, 2)}\n`, "utf8");

          const note = `\n\n### AW-9 pending database migration\n\n\`${migrationFile}\` is repository-only and pending independent review. It has not been applied to Supabase Production. The Production compatibility marker remains unchanged; do not replay applied migrations.\n`;
          for (const path of [
            "README.md",
            "docs/architecture/migration-ledger-reconciliation.md"
          ]) {
            const source = readFileSync(path, "utf8");
            if (!source.includes(migrationFile)) {
              writeFileSync(path, `${source.trimEnd()}${note}`, "utf8");
            }
          }
          NODE

          git rm .github/workflows/aw89-one-shot-correction.yml
          git diff --check
          git add README.md docs/architecture/migration-ledger-reconciliation.md supabase/migration-ledger.json
          git commit -m "chore(db): record pending AW-9 migration evidence"
          git push origin HEAD:feat/active-workout-aw8-aw9-aw10-closure
