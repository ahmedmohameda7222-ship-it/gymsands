name: P10F Cursor Native Refactor

on:
  push:
    branches:
      - feat/p10f-activity-catalog-v2-cutover
    paths:
      - .github/workflows/p10f-cursor-native-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p10f-activity-catalog-v2-cutover
          fetch-depth: 0
      - name: Apply bounded cursor-native replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          facade = Path('services/database/workout-library-v2.ts')
          text = facade.read_text()
          old_type = '''type ExistingBrowserPagination = {
            hasMore: boolean;
            /** Compatibility field name only. The runtime value is an opaque Catalog cursor, never a numeric upstream offset. */
            nextOffset: number | null;
            nextCursor: string | null;
            restarted: boolean;
          };'''
          new_type = '''type NativeBrowserPagination = {
            hasMore: boolean;
            nextCursor: string | null;
            restarted: boolean;
          };'''
          if text.count(old_type) != 1:
              raise SystemExit('workout-library-v2.ts: pagination type anchor drifted')
          text = text.replace(old_type, new_type, 1)
          text = text.replace('pagination?: ExistingBrowserPagination;', 'pagination?: NativeBrowserPagination;', 1)
          runtime_cursor = '''function runtimeCursor(value: unknown) {
            return typeof value === "string" && value.length > 0 ? value : null;
          }

          '''
          if text.count(runtime_cursor) != 1:
              raise SystemExit('workout-library-v2.ts: runtimeCursor anchor drifted')
          text = text.replace(runtime_cursor, '', 1)
          text = text.replace('browserCursorCompatibilityValue: number | string | null = 0,', 'cursor: string | null = null,', 1)
          text = text.replace('  const cursor = runtimeCursor(browserCursorCompatibilityValue);\n', '', 1)
          text = text.replace('pagination: { hasMore: false, nextOffset: null, nextCursor: null, restarted: true },', 'pagination: { hasMore: false, nextCursor: null, restarted: true },', 1)
          text = text.replace('      nextCursor,\n      nextOffset: nextCursor as unknown as number | null,\n      restarted:', '      nextCursor,\n      restarted:', 1)
          text = text.replace('return (await getWorkoutsWithStatus(query, filters, 0, locale, context)).data;', 'return (await getWorkoutsWithStatus(query, filters, null, locale, context)).data;', 1)
          if 'nextOffset' in text or 'as unknown as number' in text or 'browserCursorCompatibilityValue' in text:
              raise SystemExit('workout-library-v2.ts: offset compatibility residue remains')
          facade.write_text(text)

          browser = Path('components/workouts/workout-browser.tsx')
          text = browser.read_text()
          text = text.replace('nextProviderOffset', 'nextProviderCursor').replace('setNextProviderOffset', 'setNextProviderCursor')
          text = text.replace('useState<number | null>(null);', 'useState<string | null>(null);', 1)
          text = text.replace('result.pagination?.nextOffset', 'result.pagination?.nextCursor')
          if 'nextProviderOffset' in text or 'setNextProviderOffset' in text or 'pagination?.nextOffset' in text:
              raise SystemExit('workout-browser.tsx: offset state residue remains')
          browser.write_text(text)

          picker = Path('components/workouts/exercise-picker-dialog.tsx')
          text = picker.read_text()
          text = text.replace('const emptyPagination = { hasMore: false, nextOffset: null as number | null };', 'const emptyPagination = { hasMore: false, nextCursor: null as string | null };', 1)
          text = text.replace('const nextOffset = pagination.nextOffset;', 'const nextCursor = pagination.nextCursor;', 1)
          text = text.replace('if (!pagination.hasMore || nextOffset === null || loadingMore) return;', 'if (!pagination.hasMore || nextCursor === null || loadingMore) return;', 1)
          text = text.replace('getWorkoutsWithStatus(query.trim(), activeFilters, nextOffset, locale, {', 'getWorkoutsWithStatus(query.trim(), activeFilters, nextCursor, locale, {', 1)
          if 'nextOffset' in text or 'pagination.nextOffset' in text:
              raise SystemExit('exercise-picker-dialog.tsx: offset state residue remains')
          picker.write_text(text)
          PY
      - name: Remove one-shot workflow and commit correction
        run: |
          rm .github/workflows/p10f-cursor-native-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/workouts/workout-browser.tsx components/workouts/exercise-picker-dialog.tsx services/database/workout-library-v2.ts .github/workflows/p10f-cursor-native-refactor.yml
          git diff --cached --check
          git commit -m 'P10F — make Workout Library pagination cursor-native'
          git push origin HEAD:feat/p10f-activity-catalog-v2-cutover
