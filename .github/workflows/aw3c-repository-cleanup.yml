name: AW-3C Repository Cleanup

on:
  pull_request:
    types:
      - reopened

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 86 && github.event.pull_request.head.ref == 'feat/active-workout-aw3c-prescription-snapshots'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Remove stale reports and refresh current authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          deleted = [
              "docs/implementation/muscle-intelligence-phase2-curated-registry.md",
              "plaivra_muscle_intelligence_phase3_session_snapshot_implementation_report.md",
              "plaivra_muscle_intelligence_phase4a_atlas_foundation_implementation_report.md",
              "plaivra_muscle_intelligence_phase4a_independent_qc_report.md",
              "plaivra_aw1a_language_foundation_implementation_report.md",
              "plaivra_aw1b_active_workout_localization_implementation_report.md",
              "plaivra_aw2a_persisted_execution_state_implementation_report.md",
              "plaivra_aw2c_timeline_events_implementation_report.md",
              "plaivra_aw2c_final_planner_qaqc_correction_report.md",
              "docs/implementation/plaivra_aw2c_runtime_authority_correction_closure.md",
              "plaivra_aw3a_structured_metrics_implementation_report.md",
              "docs/reports/active-workout-aw3b-implementation-report.md",
              "plaivra_aw3c_prescription_snapshots_implementation_report.md",
              "docs/reports/active-workout-aw3c-final-validation-evidence.md",
              "docs/reports/active-workout-aw3c-pre-aw4-total-audit.md",
              "plaivra_aw2a_post_merge_release_closure_implementation_report.md",
              "plaivra_aw2b_command_authority_implementation_report.md",
              "plaivra_aw3a_final_planner_qaqc_corrections_report.md",
              "release/prelaunch-handoff-manifest.json",
              "plaivra_production_migration_reconciliation_plan.md",
              "docs/architecture.md",
          ]

          missing = [path for path in deleted if not Path(path).is_file()]
          if missing:
              raise SystemExit(f"Cleanup inventory drifted; missing files: {missing}")
          for path in deleted:
              Path(path).unlink()

          def replace_exact(path: str, old: str, new: str = "") -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected cleanup anchor missing in {path}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              ".github/workflows/exact-release-quality-validation.yml",
              "      - plaivra_aw2a_post_merge_release_closure_implementation_report.md\n",
          )
          replace_exact(
              ".github/workflows/exact-release-quality-validation.yml",
              "      - plaivra_aw2b_command_authority_implementation_report.md\n",
          )
          replace_exact(
              "scripts/release-closure-final-qa.test.mjs",
              "  assert.match(workflow, /plaivra_aw2b_command_authority_implementation_report\\.md/);\n",
          )
          replace_exact(
              "lib/product/active-workout-aw3a-migration.test.ts",
              '    const report = readFileSync("plaivra_aw3a_final_planner_qaqc_corrections_report.md", "utf8");\n'
              '    expect(report).toContain("a196cb217245557030cdc812a9dfcb670fcc0ba6");\n',
          )
          replace_exact(
              "scripts/provider-release-gates.test.mjs",
              '    "release/prelaunch-handoff-manifest.json",\n',
          )
          replace_exact(
              "scripts/provider-release-gates.test.mjs",
              '  const historicalManifest = readFileSync(resolve(root, "release/prelaunch-handoff-manifest.json"), "utf8");\n'
              '  assert.match(historicalManifest, /scripts\\/vercel-production-release-gate\\.mjs/);\n',
          )

          Path("README.md").write_text("""# Plaivra

Plaivra is a user-controlled fitness context, execution, tracking, history, and visualization platform designed to work with ChatGPT.

```text
User maintains Plaivra context
-> grants task-specific access
-> ChatGPT reads the minimum authorized context
-> Plaivra executes authorized tools
-> the user reviews, tracks, corrects, exports, or deletes the result
```

Plaivra does not independently invent workout or meal plans, diagnose medical conditions, or create a duplicate AI approval queue after successful authorized tool execution.

## Authoritative documentation

Read current authority in this order:

1. `docs/product/PLAIVRA_PRODUCT_CONSTITUTION.md`
2. `docs/product/PLAIVRA_LONG_TERM_PRODUCT_AND_PLATFORM_PLAN.md`
3. `docs/product/ai-first-tracker-model.md`
4. `docs/design-system/PLAIVRA_CROSS_PLATFORM_UI_CONSTITUTION.md`
5. `docs/chatgpt-app/README.md`
6. `docs/chatgpt-app/cimd-authentication-architecture.md`
7. `docs/architecture/canonical-domain-model.md`
8. `docs/architecture/migration-ledger-reconciliation.md`
9. `docs/platform-roadmap/README.md`
10. `docs/release/README.md`

Merged pull requests, Git history, and GitHub Actions artifacts preserve implementation evidence. Completed implementation reports, branch handoffs, audit snapshots, generated screenshots, and one-off reconciliation pointers are not active source authority and must not remain in the repository tree.

## Current stack

- Next.js App Router, React, TypeScript, and Tailwind
- Supabase Auth, PostgreSQL, RLS, Storage, and immutable migrations
- MCP with OAuth/CIMD, scoped context projections, permissions, idempotency, and audit
- Vitest, Node test runner, Playwright, and exact-head release gates
- Node.js 24.x with the committed npm lockfile

## Current architecture status

- Web is the active product surface; native applications remain future work.
- Train Phase 2A provides the additive multi-week program hierarchy while compatibility writers remain bounded until later cutover.
- Muscle Intelligence uses the approved 60-exercise registry, V1/V2 mapping authorities, advanced visible atlas, deterministic analysis, immutable session snapshots, and V2 runtime cutover.
- Active Workout AW-1 establishes EN/DE/AR language contracts.
- AW-2 provides persisted execution state, command authority, idempotency receipts, and durable timeline events.
- AW-3A provides structured performed metrics; AW-3B provides structured set details; AW-3C provides immutable normalized prescription snapshots and deterministic frozen hydration.
- Plaivra Production contains 74 physical migration records. The ledger classifies 63 exact applications and 11 generated-version aliases, with zero pending, schema-untracked, or unresolved entries.
- The released compatibility marker remains `20260724232734`. Physical migration advancement and application-release promotion remain separate operations.
- PR #86 remains the unmerged AW-3C release candidate. No manual deployment, compatibility-marker promotion, or AW-4 work is authorized by repository state alone.

## Repository areas

- `app/` — routes and API endpoints
- `components/` — UI and domain components
- `lib/` — auth, MCP, privacy, security, validation, release, and shared helpers
- `services/` — domain and database boundaries
- `types/` — shared contracts
- `supabase/migrations/` — immutable migration chain
- `supabase/verification/` — executable database verification
- `docs/` — current product, architecture, operations, release, and design authority
- `.codex/` and `.agents/` — implementation assistance, not runtime product code

Applied migrations must never be renamed, rewritten, reordered, deleted, or replayed. Generated QA evidence belongs in workflow artifacts, not permanent source files.
""", encoding="utf-8")

          Path("docs/architecture/canonical-domain-model.md").write_text("""# Plaivra Canonical Domain Model

**Version:** 2026.7  
**Status:** Current convergence and cleanup authority

## Principles

- one canonical write model per domain;
- compatibility reads and writers are bounded and tested;
- every user-owned row has an enforceable owner path;
- public ChatGPT tools use domain services rather than arbitrary table access;
- ChatGPT-created and direct-UI records share canonical storage;
- source/provider identity is metadata, not a second product silo;
- applied migrations and frozen historical facts are immutable;
- age, emptiness, or a legacy filename alone is not deletion proof.

## Current domain matrix

| Domain | Canonical direction | Current status |
|---|---|---|
| Profile/context | Profiles, structured preferences, constraints, permissions, settings, and task projections | Active |
| Workout plans | Phase 2A multi-week hierarchy under `user_workout_plans` | Additive model active; bounded compatibility writer remains |
| Performed sessions | `workout_sessions` with `exercise_logs` and normalized children | Canonical root active |
| Active execution | Execution state, commands, receipts, and timeline events under `workout_sessions` | AW-2 complete |
| Performed metrics | `exercise_log_metric_values` plus structured set-detail hierarchy | AW-3A/AW-3B complete |
| Frozen prescriptions | Snapshot items with normalized immutable sets and metric targets | AW-3C implemented and applied |
| Exercise catalog | `exercises` with reviewed provider links and mapping registries | Approved 60-exercise cohort active |
| Muscle Intelligence | Code taxonomy, V1/V2 mappings, immutable session snapshots, deterministic analysis, advanced atlas | V2 runtime cutover active |
| Saved nutrition | `saved_recipes` and `saved_recipe_ingredients` | Canonical target active; preserve compatibility data during cutover |
| ChatGPT/OAuth | Curated MCP, task projections, OAuth/CIMD, permissions, audit, and idempotency | Foundation active; publication acceptance remains separate |
| Entitlements | Provider-neutral offering, subscription, event, and entitlement contracts | Foundation exists; checkout disabled |
| Native | Shared contracts only | No iOS or Android binary |

## Workout and Active Workout authority

`workout_sessions` is the performed-session root. `exercise_logs` records performed sets. AW-2 execution-state, command, receipt, and timeline relations remain owner-bound children of that root.

AW-3 extends the same model rather than creating another session authority:

- AW-3A stores normalized performed metrics beneath `exercise_logs`;
- AW-3B stores structured set details, segments, and segment metrics;
- AW-3C stores immutable normalized prescription sets and metric targets beneath frozen session snapshot items.

After session start, the frozen prescription graph is the prescription authority. Mutable plan values may support pre-start planning and explicitly degraded compatibility only; they must not silently replace missing frozen execution data.

## Exercise catalog and Muscle Intelligence

`exercises` is the canonical global exercise-definition table. The generated 600-row legacy catalog is retired. The reviewed cohort contains 60 exercises with EN/DE/AR localization, controlled aliases, provenance, exact provider links where approved, and immutable V1/V2 mappings.

Muscle Intelligence preserves historical mapping identity in session snapshots. Phase 4A supplies the advanced visible atlas, Phase 4B publishes reviewed V2 regional mappings, and Phase 4C cuts new session snapshots and completed workload analysis to V2 without rewriting historical V1 sessions.

## Privacy and deletion

Privacy export and account deletion must include every owned canonical child relation. Historical interpretation may retain deletion-safe compact immutable snapshot content where a mutable external definition cannot remain authoritative.

## Cleanup procedure

Before removing code, files, or schema:

```text
prove runtime, route, MCP, export, deletion, test, CI, and foreign-key dependencies
stop new writes where relevant
migrate or prove no required data/evidence is lost
update current readers and authority documents
validate ownership, RLS, privacy, migration replay, and release behavior
remove only inside a named reviewed change
```

Completed implementation reports and generated evidence are preserved through Git history, pull requests, and workflow artifacts rather than the active source tree.

## Decisions

ADRs 0001–0005 remain accepted for performed sessions, exercise catalog, saved nutrition, multi-week programs, and Muscle Intelligence authority. Later phases extend those decisions; they do not reopen them without new evidence.
""", encoding="utf-8")

