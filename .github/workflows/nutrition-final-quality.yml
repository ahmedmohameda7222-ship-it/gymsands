# Nutrition-only final acceptance lane. No push trigger; no pre-QA testing.
# Created unexecuted during isolated implementation. G-11 approval is external.
name: Nutrition-only final Quality

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: nutrition-final-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nutrition-final:
    # The explicit approval label must be applied before ready-for-review.
    # This label is an operator signal, NOT a substitute for G-11 approval.
    # A job-level "if" would report skipped as success; enforce inside the job.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
      COMPARISON_BASE: ${{ github.event.pull_request.base.sha }}
      NUTRITION_QUALITY_OUTPUT: nutrition-quality-reports
      # Owner-controlled repository variables are exact SHA-bound QA authorization.
      # They are unset by default. PR labels alone must never authorize QA.
      NUTRITION_QA_APPROVED: ${{ vars.NUTRITION_QA_APPROVED }}
      NUTRITION_QA_APPROVAL_SHA: ${{ vars.NUTRITION_QA_APPROVAL_SHA }}
      NUTRITION_QA_APPROVAL_BASE: ${{ vars.NUTRITION_QA_APPROVAL_BASE }}
      # Disposable local Supabase only; no hosted credentials or writes.
      NUTRITION_DISPOSABLE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NUTRITION_FOUNDATION_ARCHIVE_PATH: /tmp/nutrition-foundation-original.zip
      NUTRITION_E2E_BASE_URL: http://127.0.0.1:3000
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Fail closed on missing Nutrition final-QA operator signal
        env:
          NUTRITION_QA_LABEL_PRESENT: ${{ contains(github.event.pull_request.labels.*.name, 'nutrition-final-qa-authorized') }}
          PR_HEAD_IS_LOCAL: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_NOT_DRAFT: ${{ github.event.pull_request.draft == false }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NUTRITION_QA_LABEL_PRESENT" == "true" ]] || { echo 'Nutrition final QA is not authorized'; exit 1; }
          [[ "$PR_HEAD_IS_LOCAL" == "true" ]] || { echo 'Cross-repository candidate not authorized'; exit 1; }
          [[ "$PR_NOT_DRAFT" == "true" ]] || { echo 'Draft candidate not authorized'; exit 1; }
      - name: Checkout exact reviewed PR head, not synthetic merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed on commit/base drift or missing test runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid reviewed SHA'; exit 1; }
          [[ "$COMPARISON_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid comparison base'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$REVIEWED_SHA" ]] || { echo 'Reviewed SHA drift'; exit 1; }
          git cat-file -e "${COMPARISON_BASE}^{commit}"
          git merge-base --is-ancestor "$COMPARISON_BASE" "$REVIEWED_SHA"
          test -f scripts/nutrition-final-quality.mjs || {
            echo 'Nutrition-only final acceptance runner is missing. Release not ready.'
            exit 1
          }
          mkdir -p "$NUTRITION_QUALITY_OUTPUT"
          printf 'reviewedSha=%s\ncomparisonBase=%s\nrepository=%s\nrunId=%s\n' \
            "$REVIEWED_SHA" "$COMPARISON_BASE" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > "$NUTRITION_QUALITY_OUTPUT/identity.txt"

      - name: Require exact G-11 approval identity before installing tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NUTRITION_QA_APPROVED" == "true" ]] || { echo 'G-11 authorization absent'; exit 1; }
          [[ "$NUTRITION_QA_APPROVAL_SHA" == "$REVIEWED_SHA" ]] || { echo 'Reviewed SHA not authorized'; exit 1; }
          [[ "$NUTRITION_QA_APPROVAL_BASE" == "$COMPARISON_BASE" ]] || { echo 'Base SHA not authorized'; exit 1; }

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts

      - name: Set up isolated local Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Install disposable database and browser tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          npx playwright install --with-deps chromium

      - name: Rehearse immutable migration chain on disposable local PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          node scripts/replay-local-migration-chain.mjs --log nutrition-quality-reports/migration-replay.log

      - name: Download and verify exact locked Foundation source offline fixture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_json_2026-04-30.zip' \
            --output "$NUTRITION_FOUNDATION_ARCHIVE_PATH"
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const lock = JSON.parse(readFileSync('data/food-catalog/source-locks/usda-foundation-2026-04.json','utf8'));
          const bytes = readFileSync(process.env.NUTRITION_FOUNDATION_ARCHIVE_PATH);
          if (bytes.length !== lock.sourceBytes ||
              createHash('sha256').update(bytes).digest('hex') !== lock.sourceChecksumSha256)
            throw new Error('Original USDA Foundation archive integrity failure');
          NODE

      - name: Prepare UI-only local mock app (never Production)
        shell: bash
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_USE_MOCK_AUTH=true
          export NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000
          export NEXT_PUBLIC_SUPABASE_URL=''
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=''
          npm run dev -- --hostname 127.0.0.1 --port 3000 \
            > "$NUTRITION_QUALITY_OUTPUT/browser-devserver.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/calories/food-hub >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:3000/calories/food-hub >/dev/null
          node scripts/nutrition-final-browser-fixtures.mjs >> "$GITHUB_ENV"

      - name: Execute only new Nutrition-owned final acceptance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/nutrition-final-quality.mjs \
            --reviewed-commit "$REVIEWED_SHA" \
            --comparison-base "$COMPARISON_BASE" \
            --output "$NUTRITION_QUALITY_OUTPUT"

      - name: Preserve raw Nutrition acceptance artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-final-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: nutrition-quality-reports/
          if-no-files-found: warn
          retention-days: 30
