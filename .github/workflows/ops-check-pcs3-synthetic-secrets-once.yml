name: PCS3 Synthetic Secrets One-Shot Check

on:
  push:
    branches:
      - ops/check-pcs3-synthetic-secrets
    paths:
      - .github/workflows/ops-check-pcs3-synthetic-secrets-once.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      PLAIVRA_SMOKE_POPULATED_EMAIL: ${{ secrets.PLAIVRA_SMOKE_POPULATED_EMAIL }}
      PLAIVRA_SMOKE_POPULATED_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_POPULATED_PASSWORD }}
      PLAIVRA_SMOKE_EMPTY_EMAIL: ${{ secrets.PLAIVRA_SMOKE_EMPTY_EMAIL }}
      PLAIVRA_SMOKE_EMPTY_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_EMPTY_PASSWORD }}
    steps:
      - name: Verify required synthetic-account secrets exist
        shell: bash
        run: |
          set +x
          missing=0
          for name in \
            PLAIVRA_SMOKE_POPULATED_EMAIL \
            PLAIVRA_SMOKE_POPULATED_PASSWORD \
            PLAIVRA_SMOKE_EMPTY_EMAIL \
            PLAIVRA_SMOKE_EMPTY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "MISSING:$name"
              missing=1
            else
              echo "PRESENT:$name"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "PCS3_SYNTHETIC_SECRETS_CHECK_FAILED"
            exit 1
          fi
          echo "PCS3_SYNTHETIC_SECRETS_ALL_PRESENT"
