# approved-measurement-trigger: 2026-08-04T18:49Z
name: PCS3 Production Measurement One-Shot

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/ops-check-pcs3-synthetic-secrets-once.yml

permissions:
  contents: read

env:
  EXPECTED_COMMIT: 27ded3ba1a8b2e69f1c8aac5bd97124cf6665863
  EXPECTED_MIGRATION: "20260724232734"
  OUTPUT_DIR: quality-reports/pcs3-production-measurement
  DIAGNOSTIC_DIR: quality-reports/pcs3-synthetic-fixture-diagnostic

jobs:
  measure:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    env:
      PLAIVRA_SMOKE_POPULATED_EMAIL: ${{ secrets.PLAIVRA_SMOKE_POPULATED_EMAIL }}
      PLAIVRA_SMOKE_POPULATED_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_POPULATED_PASSWORD }}
      PLAIVRA_SMOKE_EMPTY_EMAIL: ${{ secrets.PLAIVRA_SMOKE_EMPTY_EMAIL }}
      PLAIVRA_SMOKE_EMPTY_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_EMPTY_PASSWORD }}
    steps:
      - name: Checkout exact Production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify synthetic fixture login readiness safely
        id: fixture
        continue-on-error: true
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { chromium } from '@playwright/test';

          const origin = new URL('https://app.plaivra.com');
          const output = resolve(process.env.DIAGNOSTIC_DIR);
          mkdirSync(output, { recursive: true });
          const fixtures = [
            {
              account: 'populated',
              email: process.env.PLAIVRA_SMOKE_POPULATED_EMAIL,
              password: process.env.PLAIVRA_SMOKE_POPULATED_PASSWORD,
            },
            {
              account: 'empty',
              email: process.env.PLAIVRA_SMOKE_EMPTY_EMAIL,
              password: process.env.PLAIVRA_SMOKE_EMPTY_PASSWORD,
            },
          ];
          const browser = await chromium.launch();
          const results = [];
          try {
            for (const fixture of fixtures) {
              const result = { account: fixture.account, outcome: 'browser_error' };
              const context = await browser.newContext({
                locale: 'en-GB',
                timezoneId: 'Europe/Berlin',
              });
              const page = await context.newPage();
              try {
                if (!fixture.email || !fixture.password) {
                  result.outcome = 'credentials_missing';
                } else {
                  await page.goto(new URL('/login', origin).toString(), {
                    waitUntil: 'domcontentloaded',
                    timeout: 30_000,
                  });
                  const email = page.locator('input[type="email"]');
                  const password = page.locator('input[type="password"]');
                  const submit = page.locator('button[type="submit"]');
                  const formReady =
                    (await email.count()) === 1 &&
                    (await password.count()) === 1 &&
                    (await submit.count()) >= 1;
                  if (!formReady) {
                    result.outcome = 'login_form_missing';
                  } else {
                    await email.fill(fixture.email);
                    await password.fill(fixture.password);
                    await submit.first().click();
                    await page
                      .waitForURL((url) => url.pathname !== '/login', {
                        timeout: 20_000,
                      })
                      .catch(() => undefined);
                    const current = new URL(page.url());
                    if (current.origin !== origin.origin) {
                      result.outcome = 'redirect_origin_invalid';
                    } else if (current.pathname === '/login') {
                      result.outcome = 'login_rejected_or_timeout';
                    } else if (current.pathname.startsWith('/onboarding')) {
                      result.outcome = 'onboarding_required';
                    } else {
                      result.outcome = 'ready';
                    }
                  }
                }
              } catch {
                result.outcome = 'browser_error';
              } finally {
                await context.close();
              }
              results.push(result);
            }
          } finally {
            await browser.close();
          }

          const passed = results.every((entry) => entry.outcome === 'ready');
          const evidence = {
            checkedAt: new Date().toISOString(),
            expectedCommit: process.env.EXPECTED_COMMIT,
            syntheticDataOnly: true,
            credentialsLogged: false,
            pageTextLogged: false,
            passed,
            accounts: results,
          };
          writeFileSync(
            resolve(output, 'summary.json'),
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          writeFileSync(
            resolve(output, 'summary.md'),
            `# PCS-3 Synthetic Fixture Diagnostic\n\n- Passed: ${passed}\n- Credentials logged: no\n- Page text logged: no\n\n${results
              .map((entry) => `- ${entry.account}: ${entry.outcome}`)
              .join('\n')}\n`,
          );
          process.stdout.write(
            passed
              ? 'PCS3_SYNTHETIC_FIXTURES_READY\n'
              : 'PCS3_SYNTHETIC_FIXTURES_NOT_READY\n',
          );
          if (!passed) process.exitCode = 1;
          NODE

      - name: Run authenticated Production measurement
        if: steps.fixture.outcome == 'success'
        id: measurement
        continue-on-error: true
        shell: bash
        run: |
          set +x
          npm run measure:pcs3-production -- \
            --mode production \
            --url https://app.plaivra.com \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-migration "$EXPECTED_MIGRATION" \
            --samples 20 \
            --warmups 2 \
            --account both \
            --output "$OUTPUT_DIR"

      - name: Verify sanitized evidence boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DIAGNOSTIC_DIR/summary.json"
          test -f "$DIAGNOSTIC_DIR/summary.md"
          if [ "${{ steps.fixture.outcome }}" = "success" ]; then
            test -f "$OUTPUT_DIR/summary.json"
            test -f "$OUTPUT_DIR/summary.md"
          fi
          if find quality-reports/pcs3-* -type f \( \
            -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o \
            -iname '*.har' -o -iname '*.zip' -o -iname '*.webm' -o \
            -iname '*trace*' -o -iname '*storage*' \
          \) | grep -q .; then
            echo PCS3_UNSAFE_ARTIFACT_DETECTED
            exit 1
          fi

      - name: Upload sanitized PCS-3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcs3-production-measurement-27ded3ba
          path: |
            quality-reports/pcs3-production-measurement
            quality-reports/pcs3-synthetic-fixture-diagnostic
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Enforce measurement result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.fixture.outcome }}" != "success" ]; then
            echo PCS3_SYNTHETIC_FIXTURES_NOT_READY
            exit 1
          fi
          if [ "${{ steps.measurement.outcome }}" != "success" ]; then
            echo PCS3_PRODUCTION_MEASUREMENT_FAILED
            exit 1
          fi
          echo PCS3_PRODUCTION_MEASUREMENT_PASSED
