name: Temporary PERF telemetry contract repair

on:
  push:
    branches:
      - perf/platform-performance-foundation
    paths:
      - .github/workflows/perf-telemetry-contract-repair.yml

permissions:
  contents: write

concurrency:
  group: perf-telemetry-contract-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/platform-performance-foundation
          fetch-depth: 0

      - name: Bind the dedicated telemetry gate to all observability tests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("package.json")
          package = json.loads(path.read_text(encoding="utf-8"))
          expected = (
              "vitest run --config vitest.unit.config.mjs "
              "lib/observability/client-error.test.ts "
              "lib/observability/client-error-route.test.ts "
              "lib/observability/performance-metric.test.ts "
              "lib/observability/performance-metric-route.test.ts "
              "lib/performance/version-region-route.test.ts"
          )
          current = package["scripts"].get("test:telemetry")
          if current != "vitest run --config vitest.unit.config.mjs lib/observability/client-error.test.ts lib/observability/client-error-route.test.ts":
              raise SystemExit(f"unexpected test:telemetry contract: {current!r}")
          package["scripts"]["test:telemetry"] = expected
          path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY

          git rm .github/workflows/perf-telemetry-contract-repair.yml

      - name: Commit telemetry gate correction
        run: |
          git config user.name "Plaivra Quality Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json
          git commit -m "fix(perf): bind telemetry gate to RUM tests"
          git push origin HEAD:perf/platform-performance-foundation
