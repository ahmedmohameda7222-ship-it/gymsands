name: PR144 Correction Node24 Bootstrap V2

on:
  push:
    branches:
      - feat/active-workout-full-implementation
    paths:
      - .github/workflows/pr144-correction-node24-bootstrap-v2.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - name: Align temporary validator with repository Node authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pr144-correction-authority-apply-v2.yml')
          text = path.read_text()
          needle = "          fetch-depth: 0\n      - name: Apply correction-only implementation\n"
          replacement = "          fetch-depth: 0\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 24\n          cache: npm\n      - name: Apply correction-only implementation\n"
          if text.count(needle) != 1:
              raise SystemExit(f'expected one validator insertion point, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit validator alignment
        shell: bash
        run: |
          rm .github/workflows/pr144-correction-node24-bootstrap-v2.yml
          git config user.name "Plaivra Repository Delivery"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/pr144-correction-authority-apply-v2.yml .github/workflows/pr144-correction-node24-bootstrap-v2.yml
          git commit -m "ci: run PR144 correction validator on Node 24"
          git push origin HEAD:feat/active-workout-full-implementation
