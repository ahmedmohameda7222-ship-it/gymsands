name: Phase A Diff Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase-a-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_USE_MOCK_AUTH: "true"
  PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
  PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
  PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
  PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
  PLAIVRA_RELEASE_ENVIRONMENT: ci
  PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: "2"
  PLAIVRA_ACTIVITY_CATALOG_MODE: library_v2_with_legacy_fallback
  PLAIVRA_ACTIVITY_CATALOG_BASE_URL: https://plaivra-activity-catalog-api.vercel.app
  PLAIVRA_ACTIVITY_CATALOG_API_KEY: ci-placeholder-catalog-key-long-enough
  PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  authority-root-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Align one-shot fixer with current TS layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/scripts/plan6_authority_rereview_apply.py')
          s=p.read_text()
          replacement=r'''principals = PRINCIPALS.read_text()
          principals = replace_once(
              principals,
              '  "food.observability.read",\n  "food.ingestion.propose",\n] as const;',
              '  "food.observability.read",\n  "food.ingestion.propose",\n  "food.outbox.deliver",\n] as const;',
              'TS outbox capability',
          )
          principals = replace_once(
              principals,
              'const OWNER_CAPABILITIES: readonly FoodGovernanceCapability[] = FOOD_GOVERNANCE_CAPABILITIES.filter(\n  (capability) => capability !== "food.ingestion.propose",\n);',
              'const OWNER_CAPABILITIES: readonly FoodGovernanceCapability[] = FOOD_GOVERNANCE_CAPABILITIES.filter(\n  (capability) => capability !== "food.ingestion.propose" && capability !== "food.outbox.deliver",\n);',
              'Owner default excludes delivery',
          )
          PRINCIPALS.write_text(principals)'''
          s2,n=re.subn(r"principals = PRINCIPALS\.read_text\(\)[\s\S]*?PRINCIPALS\.write_text\(principals\)",replacement,s,count=1)
          if n!=1:
              raise SystemExit(f'expected one principals patch section, got {n}')
          p.write_text(s2)
          PY

      - name: Apply Plan 6 authority root fix
        run: python3 .github/scripts/plan6_authority_rereview_apply.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Focused permanent authority contracts
        run: >-
          ./node_modules/.bin/vitest run --config vitest.unit.config.mjs
          lib/product/food-catalog-governance-plan6-authority-rereview.test.ts
          lib/product/food-catalog-governance-plan6-rereview.test.ts
          lib/food-catalog/governance/principals.test.ts
          lib/food-catalog/governance/canonical-commands.test.ts
          lib/food-catalog/governance/outbox.test.ts

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Chronological migration replay
        run: |
          mkdir -p ci-reports
          node scripts/replay-local-migration-chain.mjs --log ci-reports/plan6-authority-rereview-database.log --prove-future-order

      - name: Database lint
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Registered database verification
        run: node scripts/run-database-verification.mjs

      - name: Migration ledger
        run: npm run migration:ledger:check

      - name: Commit verified root fix and restore canonical workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/phase-a-diff-validation.yml
          git rm .github/scripts/plan6_authority_rereview_apply.py
          git rm .github/workflows/plan6-authority-rereview-focused-tdd-temp.yml
          git add \
            supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql \
            supabase/verification/food-catalog-governance-control-plane.sql \
            supabase/verification/food-catalog-governance-control-plane-rereview.sql \
            supabase/verification/food-catalog-governance-control-plane-authority-rereview.sql \
            scripts/run-database-verification.mjs \
            lib/food-catalog/governance/principals.ts \
            lib/food-catalog/governance/principals.test.ts \
            docs/architecture/food-catalog-governance-control-plane.md \
            lib/product/food-catalog-governance-plan6-authority-rereview.test.ts \
            .github/workflows/phase-a-diff-validation.yml
          git diff --cached --check
          git commit -m "fix(plan6): close deeper authority blockers"
          git push origin HEAD:feat/food-catalog-governance-plan6

  verify-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Check branch diff formatting against main
        run: git diff --check origin/main...HEAD
