name: Phase A Diff Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase-a-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Check branch diff formatting against main
        run: git diff --check origin/main...HEAD

  plan6-five-p1-green-finalizer:
    if: github.event.pull_request.number == 173
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PLAIVRA_PLAN6_CONCURRENCY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch -r --contains HEAD | grep -c 'origin/feat/food-catalog-governance-plan6')" -ge 1

      - name: Apply five-P1 hardened correction in disposable checkout
        run: python3 .github/scripts/plan6_five_p1_apply.py

      - name: Check staged working-tree diff
        run: git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused Plan 6 GREEN contracts
        run: >-
          npx vitest run
          lib/product/food-catalog-governance-plan6-five-p1-rereview.test.ts
          lib/product/food-catalog-governance-plan6-authority-rereview.test.ts
          lib/food-catalog/governance/principals.test.ts
          lib/food-catalog/governance/canonical-commands.test.ts
          lib/food-catalog/governance/outbox.test.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Chronological migration replay
        run: node scripts/replay-local-migration-chain.mjs --log /tmp/plan6-five-p1-green.log --prove-future-order

      - name: Database lint
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Diagnose Plan 6 registered verifiers individually
        shell: bash
        run: |
          set -euo pipefail
          for verifier in \
            supabase/verification/food-catalog-governance-control-plane.sql \
            supabase/verification/food-catalog-governance-control-plane-rereview.sql \
            supabase/verification/food-catalog-governance-control-plane-authority-rereview.sql \
            supabase/verification/food-catalog-governance-control-plane-five-p1-rereview.sql
          do
            echo "===== START ${verifier} ====="
            if ! psql "$PLAIVRA_LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$verifier" >/tmp/plan6-one-verifier.log 2>&1; then
              echo "::error title=Plan 6 verifier failed::${verifier}"
              cat /tmp/plan6-one-verifier.log
              exit 1
            fi
            tail -n 20 /tmp/plan6-one-verifier.log
            echo "===== PASS ${verifier} ====="
          done
          echo "===== START concurrency adversaries ====="
          if ! node scripts/test-food-catalog-governance-plan6-concurrency.mjs >/tmp/plan6-concurrency.log 2>&1; then
            echo "::error title=Plan 6 concurrency adversary failed::scripts/test-food-catalog-governance-plan6-concurrency.mjs"
            cat /tmp/plan6-concurrency.log
            exit 1
          fi
          cat /tmp/plan6-concurrency.log
          echo "===== PASS concurrency adversaries ====="

      - name: All registered database verification and concurrency adversaries
        shell: bash
        run: |
          set +e
          node scripts/run-database-verification.mjs 2>&1 | tee /tmp/plan6-dbverify.log
          status=${PIPESTATUS[0]}
          echo "===== PLAN6 DB VERIFICATION TAIL ====="
          tail -n 180 /tmp/plan6-dbverify.log
          echo "===== END PLAN6 DB VERIFICATION TAIL (status=${status}) ====="
          exit "${status}"

      - name: Migration ledger
        run: npm run migration:ledger:check

      - name: Verify applied Plan 4 migration stayed byte-for-byte untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object supabase/migrations/20260904100000_food_catalog_ingestion_v2_authority.sql)" = "eb2cdc2ee16462d7712080a3e3532757ec093742"

      - name: Commit permanent fix and remove temporary finalizer tooling
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/phase-a-diff-validation.yml
          git rm -f --ignore-unmatch .github/scripts/plan6_five_p1_apply.py
          git add \
            supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql \
            scripts/run-database-verification.mjs \
            scripts/test-food-catalog-governance-plan6-concurrency.mjs \
            supabase/verification/food-catalog-governance-control-plane-five-p1-rereview.sql \
            lib/product/food-catalog-governance-plan6-five-p1-rereview.test.ts \
            docs/architecture/food-catalog-governance-control-plane.md \
            .github/workflows/phase-a-diff-validation.yml
          git diff --cached --check
          test ! -e .github/scripts/plan6_five_p1_apply.py
          git config user.name "plaivra-plan6-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(plan6): close five P1 security blockers"
          git push origin HEAD:feat/food-catalog-governance-plan6
