name: Phase A Diff Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase-a-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Check branch diff formatting against main
        run: git diff --check origin/main...HEAD

      - name: Materialize deterministic train QA fixture
        run: |
          python scripts/materialize-train-qa-fixture.py
          node --check scripts/run-train-layout-qa.mjs

      - name: Create exact source blob
        shell: bash
        run: |
          base64 -w0 scripts/run-train-layout-qa.mjs > /tmp/source.b64
          jq -n --rawfile content /tmp/source.b64 '{content:$content,encoding:"base64"}' > /tmp/blob-request.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob-request.json --jq '.sha' > /tmp/source.sha
          printf 'scripts/run-train-layout-qa.mjs=%s\n' "$(cat /tmp/source.sha)" > /tmp/blobs.txt

      - name: Upload materialized source evidence
        uses: actions/upload-artifact@v4
        with:
          name: train-qa-fixture-${{ github.event.pull_request.head.sha }}
          path: |
            scripts/run-train-layout-qa.mjs
            /tmp/blobs.txt
          if-no-files-found: error
          retention-days: 1
