name: Phase A Diff Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase-a-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Check branch diff formatting against main
        run: git diff --check origin/main...HEAD

  plan6-five-p1-green-finalizer:
    if: github.event.pull_request.number == 173
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PLAIVRA_PLAN6_CONCURRENCY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch -r --contains HEAD | grep -c 'origin/feat/food-catalog-governance-plan6')" -ge 1

      - name: Apply five-P1 hardened correction in disposable checkout
        run: python3 .github/scripts/plan6_five_p1_apply.py

      - name: Repair legacy Plan 6 verifier fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/verification/food-catalog-governance-control-plane.sql")
          text = path.read_text()

          member_marker = "Plan 6 member Auth fixture did not create canonical profile/access state"
          if member_marker not in text:
              anchor = "-- The disposable purge owner is a real Auth user so the canonical privacy lifecycle can be exercised without bypasses.\n"
              if text.count(anchor) != 1:
                  raise RuntimeError(f"expected one purge-owner fixture anchor, found {text.count(anchor)}")
              member_fixture = """-- The ordinary member is also a real Auth user because Personal Override writes are gated by canonical account lifecycle state.\ninsert into auth.users (\n  id, aud, role, email, encrypted_password,\n  raw_app_meta_data, raw_user_meta_data, created_at, updated_at\n) values (\n  :'member_id'::uuid, 'authenticated', 'authenticated', 'plan6-member@example.test', '',\n  '{"provider":"email","providers":["email"]}'::jsonb, '{}'::jsonb, now(), now()\n);\nselect pg_temp.plan6_assert(\n  exists(select 1 from public.profiles where id=:'member_id'::uuid)\n  and exists(select 1 from public.account_access_states where user_id=:'member_id'::uuid and state='active' and disabled_at is null),\n  'Plan 6 member Auth fixture did not create canonical profile/access state'\n);\n\n"""
              text = text.replace(anchor, member_fixture + anchor, 1)

          if "\\set lifecycle_food '66000000-0000-4000-8000-000000000103'" not in text:
              food_b_var = "\\set food_b '66000000-0000-4000-8000-000000000102'\n"
              if text.count(food_b_var) != 1:
                  raise RuntimeError(f"expected one food_b variable anchor, found {text.count(food_b_var)}")
              text = text.replace(
                  food_b_var,
                  food_b_var + "\\set lifecycle_food '66000000-0000-4000-8000-000000000103'\n",
                  1,
              )

              old_food_insert = """insert into public.food_items(id,food_name,is_global,lifecycle_status) values\n  (:'food_a','Plan 6 Fixture A',true,'active'),(:'food_b','Plan 6 Fixture B',true,'active');"""
              new_food_insert = """insert into public.food_items(id,food_name,is_global,lifecycle_status) values\n  (:'food_a','Plan 6 Fixture A',true,'active'),\n  (:'food_b','Plan 6 Fixture B',true,'active'),\n  (:'lifecycle_food','Plan 6 Lifecycle Fixture',true,'active');"""
              if text.count(old_food_insert) != 1:
                  raise RuntimeError(f"expected one Food fixture insert anchor, found {text.count(old_food_insert)}")
              text = text.replace(old_food_insert, new_food_insert, 1)

              old_withdraw = "select (public.food_catalog_withdraw_food('66000000-0000-4000-8000-000000000470',:'food_a','active',0,null,null,'emergency withdraw','emergency evidence review'))->>'lifecycleEventId' as withdraw_event \\gset"
              new_withdraw = "select (public.food_catalog_withdraw_food('66000000-0000-4000-8000-000000000470',:'lifecycle_food','active',0,null,null,'emergency withdraw','emergency evidence review'))->>'lifecycleEventId' as withdraw_event \\gset"
              old_restore = "select public.food_catalog_restore_food('66000000-0000-4000-8000-000000000471',:'food_a','withdrawn',1,:'withdraw_event','restore after review',null);"
              new_restore = "select public.food_catalog_restore_food('66000000-0000-4000-8000-000000000471',:'lifecycle_food','withdrawn',1,:'withdraw_event','restore after review',null);"
              old_assert = "select pg_temp.plan6_assert(exists(select 1 from public.food_items where id=:'food_a' and lifecycle_status='active'),'withdraw/restore preserve the same Food row');"
              new_assert = "select pg_temp.plan6_assert(exists(select 1 from public.food_items where id=:'lifecycle_food' and lifecycle_status='active'),'withdraw/restore preserve the same independent Food row');"
              for label, old, new in [
                  ("withdraw", old_withdraw, new_withdraw),
                  ("restore", old_restore, new_restore),
                  ("lifecycle assertion", old_assert, new_assert),
              ]:
                  if text.count(old) != 1:
                      raise RuntimeError(f"expected one {label} anchor, found {text.count(old)}")
                  text = text.replace(old, new, 1)

          path.write_text(text)

          rereview_path = Path("supabase/verification/food-catalog-governance-control-plane-rereview.sql")
          rereview = rereview_path.read_text()
          rereview_marker = "Plan 6 re-review override Auth fixture did not create canonical profile/access state"
          if rereview_marker not in rereview:
              anchor = "-- P2 personal overrides: owner-scoped idempotency, semantic conflict rejection, payload/domain bounds.\n"
              if rereview.count(anchor) != 1:
                  raise RuntimeError(f"expected one re-review personal override anchor, found {rereview.count(anchor)}")
              fixture = """-- Personal Override lifecycle hardening requires the verifier owner to be a real active Auth account.\ninsert into auth.users (\n  id, aud, role, email, encrypted_password,\n  raw_app_meta_data, raw_user_meta_data, created_at, updated_at\n) values (\n  :'override_uid'::uuid, 'authenticated', 'authenticated', 'plan6-rereview-override@example.test', '',\n  '{"provider":"email","providers":["email"]}'::jsonb, '{}'::jsonb, now(), now()\n);\nselect pg_temp.plan6_rereview_assert(\n  exists(select 1 from public.profiles where id=:'override_uid'::uuid)\n  and exists(select 1 from public.account_access_states where user_id=:'override_uid'::uuid and state='active' and disabled_at is null),\n  'Plan 6 re-review override Auth fixture did not create canonical profile/access state'\n);\n\n"""
              rereview = rereview.replace(anchor, fixture + anchor, 1)
              rereview_path.write_text(rereview)

          concurrency_path = Path("scripts/test-food-catalog-governance-plan6-concurrency.mjs")
          concurrency = concurrency_path.read_text()
          bad = 'const staleOps = Number(runSql("select count(*) from public.food_personal_override_operations where user_id=\'${PURGE_UID}\' and operation_id=\'6a000000-0000-4000-8000-000000000813\'"));'
          good = "const staleOps = Number(runSql(`select count(*) from public.food_personal_override_operations where user_id='${PURGE_UID}' and operation_id='6a000000-0000-4000-8000-000000000813'`));"
          if bad in concurrency:
              if concurrency.count(bad) != 1:
                  raise RuntimeError(f"expected one concurrency interpolation bug, found {concurrency.count(bad)}")
              concurrency = concurrency.replace(bad, good, 1)
              concurrency_path.write_text(concurrency)
          elif good not in concurrency:
              raise RuntimeError("Plan 6 purge-race stale-operation query interpolation anchor missing")
          PY

      - name: Check staged working-tree diff
        run: git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused Plan 6 GREEN contracts
        run: >-
          npx vitest run
          lib/product/food-catalog-governance-plan6-five-p1-rereview.test.ts
          lib/product/food-catalog-governance-plan6-authority-rereview.test.ts
          lib/food-catalog/governance/principals.test.ts
          lib/food-catalog/governance/canonical-commands.test.ts
          lib/food-catalog/governance/outbox.test.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Chronological migration replay
        run: node scripts/replay-local-migration-chain.mjs --log /tmp/plan6-five-p1-green.log --prove-future-order

      - name: Database lint
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: Diagnose Plan 6 registered verifiers individually
        shell: bash
        run: |
          set -euo pipefail
          for verifier in \
            supabase/verification/food-catalog-governance-control-plane.sql \
            supabase/verification/food-catalog-governance-control-plane-rereview.sql \
            supabase/verification/food-catalog-governance-control-plane-authority-rereview.sql \
            supabase/verification/food-catalog-governance-control-plane-five-p1-rereview.sql
          do
            echo "===== START ${verifier} ====="
            if ! psql "$PLAIVRA_LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$verifier" >/tmp/plan6-one-verifier.log 2>&1; then
              echo "::error title=Plan 6 verifier failed::${verifier}"
              cat /tmp/plan6-one-verifier.log
              exit 1
            fi
            tail -n 20 /tmp/plan6-one-verifier.log
            echo "===== PASS ${verifier} ====="
          done

      - name: All registered database verification and concurrency adversaries
        shell: bash
        run: |
          set +e
          node scripts/run-database-verification.mjs 2>&1 | tee /tmp/plan6-dbverify.log
          status=${PIPESTATUS[0]}
          echo "===== PLAN6 DB VERIFICATION TAIL ====="
          tail -n 180 /tmp/plan6-dbverify.log
          echo "===== END PLAN6 DB VERIFICATION TAIL (status=${status}) ====="
          exit "${status}"

      - name: Upload Plan 6 DB verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plan6-dbverify-${{ github.event.pull_request.head.sha }}
          path: /tmp/plan6-dbverify.log
          if-no-files-found: warn
          retention-days: 1

      - name: Migration ledger
        run: npm run migration:ledger:check

      - name: Verify applied Plan 4 migration stayed byte-for-byte untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object supabase/migrations/20260904100000_food_catalog_ingestion_v2_authority.sql)" = "eb2cdc2ee16462d7712080a3e3532757ec093742"

      - name: Commit permanent fix and remove temporary finalizer tooling
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/phase-a-diff-validation.yml
          git rm -f --ignore-unmatch .github/scripts/plan6_five_p1_apply.py
          git add \
            supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql \
            scripts/run-database-verification.mjs \
            scripts/test-food-catalog-governance-plan6-concurrency.mjs \
            supabase/verification/food-catalog-governance-control-plane.sql \
            supabase/verification/food-catalog-governance-control-plane-rereview.sql \
            supabase/verification/food-catalog-governance-control-plane-five-p1-rereview.sql \
            lib/product/food-catalog-governance-plan6-five-p1-rereview.test.ts \
            docs/architecture/food-catalog-governance-control-plane.md \
            .github/workflows/phase-a-diff-validation.yml
          git diff --cached --check
          test ! -e .github/scripts/plan6_five_p1_apply.py
          git config user.name "plaivra-plan6-finalizer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(plan6): close five P1 security blockers"
          git push origin HEAD:feat/food-catalog-governance-plan6
