name: Phase A Diff Validation
# Temporary Plan 6 final-P1 finalizer authority; restored before product persistence.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase-a-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Check branch diff formatting against main
        run: git diff --check origin/main...HEAD

  plan6-final-p1-finalize:
    needs: verify-diff
    if: github.event.pull_request.number == 173
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact staging identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Apply final P1 root fixes in pending Plan 6 migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql')
          s=p.read_text()
          marker='create or replace function public.purge_account_application_data_atomic(p_user_id uuid)'
          i=s.index(marker)
          old="perform pg_advisory_xact_lock(hashtextextended('plaivra-account-data-purge:'||p_user_id::text,0));"
          j=s.find(old,i)
          if j < 0:
              raise SystemExit('purge wrapper lock marker missing')
          s=s[:j]+"perform pg_advisory_xact_lock( hashtextextended('plaivra-account-data-purge:'||p_user_id::text,0));"+s[j+len(old):]
          p.write_text(s)

          # Keep the new account-lock helper's own advisory-lock implementation out
          # of the patcher's legacy Personal Override literal match. This scopes the
          # later replace_once to the old Personal Override helper only.
          patcher=Path('.github/scripts/plan6_final_p1_apply.py')
          ps=patcher.read_text()
          helper_marker='create or replace function private.food_catalog_lock_account_purge(p_user_id uuid)'
          hi=ps.index(helper_marker)
          hj=ps.index('create or replace function private.food_catalog_governance_require_active_member_account',hi)
          helper=ps[hi:hj]
          helper_old="perform pg_advisory_xact_lock(hashtextextended('plaivra-account-data-purge:'||p_user_id::text,0));"
          if helper.count(helper_old) != 1:
              raise SystemExit('account-lock helper patch marker drifted')
          helper=helper.replace(helper_old,"perform pg_advisory_xact_lock( hashtextextended('plaivra-account-data-purge:'||p_user_id::text,0));",1)
          patcher.write_text(ps[:hi]+helper+ps[hj:])
          PY
          python .github/scripts/plan6_final_p1_apply.py
          python .github/scripts/plan6_final_p1_postpatch.py
          git diff --check
      - name: Focused final-P1 source contracts GREEN
        run: >-
          ./node_modules/.bin/vitest run --config vitest.unit.config.mjs
          lib/product/food-catalog-governance-plan6-final-p1-rereview.test.ts
          lib/product/food-catalog-governance-plan6-five-p1-rereview.test.ts
          lib/product/food-catalog-governance-plan6-authority-rereview.test.ts
          lib/product/food-catalog-governance-plan6-rereview.test.ts
      - name: Chronological migration replay
        run: node scripts/replay-local-migration-chain.mjs --log /tmp/plan6-final-p1-green.log --prove-future-order
      - name: Database lint
        run: supabase db lint --local --schema public --level error --fail-on error
      - name: Final-P1 rollback SQL verifiers
        run: |
          psql "$PLAIVRA_LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/verification/food-catalog-governance-control-plane-live-owner-rereview.sql
          psql "$PLAIVRA_LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/verification/food-catalog-governance-control-plane-report-privacy-rereview.sql
      - name: All registered database verification
        run: node scripts/run-database-verification.mjs
      - name: Final-P1 distinct-session concurrency adversaries
        env:
          PLAIVRA_PLAN6_FINAL_P1_CONCURRENCY_TEST_DATABASE_URL: ${{ env.PLAIVRA_LOCAL_DATABASE_URL }}
        run: node scripts/test-food-catalog-governance-plan6-final-p1-concurrency.mjs
      - name: Preserve previous five-P1 distinct-session adversaries
        env:
          PLAIVRA_PLAN6_CONCURRENCY_TEST_DATABASE_URL: ${{ env.PLAIVRA_LOCAL_DATABASE_URL }}
        run: node scripts/test-food-catalog-governance-plan6-concurrency.mjs
      - name: Migration ledger
        run: npm run migration:ledger:check
      - name: Applied Plan4 remains byte-for-byte unchanged
        run: |
          test "$(git hash-object supabase/migrations/20260904100000_food_catalog_ingestion_v2_authority.sql)" = "eb2cdc2ee16462d7712080a3e3532757ec093742"
          test "$(git rev-parse fd53bff22792eb974e99ba4fba1a65f4a9265c62:supabase/migrations/20260904100000_food_catalog_ingestion_v2_authority.sql)" = "eb2cdc2ee16462d7712080a3e3532757ec093742"
      - name: Lint and typecheck before persistence
        run: |
          npm run lint
          npm run typecheck
      - name: Persist permanent product/test changes and restore canonical workflow
        run: |
          set -euo pipefail
          git checkout fd53bff22792eb974e99ba4fba1a65f4a9265c62 -- .github/workflows/phase-a-diff-validation.yml
          rm -f .github/workflows/plan6-final-p1-red.yml
          rm -f .github/workflows/plan6-final-p1-finalizer.yml
          rm -f .github/scripts/plan6_final_p1_apply.py
          rm -f .github/scripts/plan6_final_p1_postpatch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(plan6): close final P1 rereview blockers"
          git push origin HEAD:feat/food-catalog-governance-plan6
          echo "product_head=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "plan6_blob=$(git hash-object supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql)" >> "$GITHUB_STEP_SUMMARY"
