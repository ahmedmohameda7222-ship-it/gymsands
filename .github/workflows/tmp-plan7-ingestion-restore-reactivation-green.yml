name: Plan7 Restored Ingestion Reactivation GREEN

on:
  push:
    branches:
      - tmp-plan7-ingestion-restore-reactivation-green-20260917

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      START_SHA: 309371435bbb1988854b01debcd935c9d60e9355
      RESULT_BRANCH: tmp-plan7-ingestion-restore-reactivation-green-result-20260917
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Preserve controller patch and reset to exact starting authority
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp/plan7-ingestion-restore-reactivation-green.py /tmp/plan7-green.py
          git checkout --detach "$START_SHA"
          test "$(git rev-parse HEAD)" = "$START_SHA"
      - name: Apply narrow GREEN implementation
        run: python /tmp/plan7-green.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused GREEN contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/restore-food-catalog-ingestion-reactivation.test.mjs \
            scripts/restore-food-catalog-portable.test.mjs \
            scripts/verify-food-catalog-integrated-restore.test.mjs \
            scripts/run-database-verification.test.mjs
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Replay migrations and prove permanent database authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/replay-local-migration-chain.mjs --log /tmp/plan7-green-replay.log --prove-future-order
          supabase db lint --local --schema public --level error --fail-on error
          node scripts/run-database-verification.mjs
      - name: Verify migration ledger and script contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run migration:ledger:check
          npm run test:scripts
      - name: Verify lint and typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_USE_MOCK_AUTH: "true"
          PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
          PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
          PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
          PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
          PLAIVRA_RELEASE_ENVIRONMENT: ci
          PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: "2"
          PLAIVRA_ACTIVITY_CATALOG_MODE: library_v2_with_legacy_fallback
          PLAIVRA_ACTIVITY_CATALOG_BASE_URL: https://plaivra-activity-catalog-api.vercel.app
          PLAIVRA_ACTIVITY_CATALOG_API_KEY: ci-placeholder-catalog-key-long-enough
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
      - name: Commit one logical GREEN change and push result ref
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(scripts/restore-food-catalog-portable\.mjs|scripts/restore-food-catalog-ingestion-reactivation\.test\.mjs|scripts/verify-food-catalog-integrated-restore\.mjs|scripts/verify-food-catalog-integrated-restore\.test\.mjs|scripts/run-database-verification\.mjs|scripts/run-database-verification\.test\.mjs|supabase/migrations/20260917100000_food_catalog_ingestion_restore_reactivation_block\.sql|supabase/verification/food-catalog-plan7-ingestion-restore-reactivation\.sql|supabase/migration-ledger\.json)$'
          git diff --check
          changed="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          echo "$changed"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "$file" | grep -Eq "$allowed"
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/restore-food-catalog-portable.mjs \
            scripts/restore-food-catalog-ingestion-reactivation.test.mjs \
            scripts/verify-food-catalog-integrated-restore.mjs \
            scripts/verify-food-catalog-integrated-restore.test.mjs \
            scripts/run-database-verification.mjs \
            scripts/run-database-verification.test.mjs \
            supabase/migrations/20260917100000_food_catalog_ingestion_restore_reactivation_block.sql \
            supabase/verification/food-catalog-plan7-ingestion-restore-reactivation.sql \
            supabase/migration-ledger.json
          git commit -m 'fix(plan7): preserve restored ingestion reactivation blocks'
          test "$(git rev-list --count "$START_SHA"..HEAD)" = "1"
          git push origin HEAD:"refs/heads/$RESULT_BRANCH"
          echo "FINAL_GREEN_SHA=$(git rev-parse HEAD)"
