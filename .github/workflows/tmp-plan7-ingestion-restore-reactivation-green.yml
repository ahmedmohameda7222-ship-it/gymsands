name: Plan7 Restored Ingestion Reactivation GREEN

on:
  push:
    branches:
      - tmp-plan7-ingestion-restore-reactivation-green

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    env:
      PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Apply focused implementation
        run: python scripts/tmp-plan7-ingestion-restore-reactivation-green.py

      - name: Show scoped stale ledger expectations
        run: git grep -n -E 'pendingCount[^[:digit:]]*2|unresolvedCount[^[:digit:]]*2|20260915170012_food_catalog_owner_correction_export.sql' -- lib/product scripts || true

      - name: Focused JavaScript tests
        id: focused
        continue-on-error: true
        run: node --test scripts/restore-food-catalog-portable.test.mjs scripts/run-database-verification.test.mjs

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Replay migrations and run canonical database verification
        id: database
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/replay-local-migration-chain.mjs --log /tmp/plan7-green-replay.log --prove-future-order
          node scripts/run-database-verification.mjs

      - name: Commit temp implementation state
        if: always()
        run: |
          set -euo pipefail
          git status --short
          git config user.name "ahmedmohameda7222-ship-it"
          git config user.email "ahmed.mohameda7222@gmail.com"
          git add \
            supabase/migrations/20260917170013_food_catalog_ingestion_restore_reactivation_gate.sql \
            supabase/verification/food-catalog-ingestion-restore-reactivation-gate.sql \
            scripts/restore-food-catalog-portable.mjs \
            scripts/restore-food-catalog-portable.test.mjs \
            scripts/run-database-verification.mjs \
            scripts/run-database-verification.test.mjs \
            .github/workflows/food-catalog-plan7-integrated-full-dr.yml \
            supabase/migration-ledger.json \
            docs/architecture/migration-ledger-reconciliation.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "fix(plan7): block restored active ingestion runs [skip ci]"
          git push origin HEAD:tmp-plan7-ingestion-restore-reactivation-green

      - name: Require focused GREEN evidence
        if: always()
        run: |
          test "${{ steps.focused.outcome }}" = "success"
          test "${{ steps.database.outcome }}" = "success"
