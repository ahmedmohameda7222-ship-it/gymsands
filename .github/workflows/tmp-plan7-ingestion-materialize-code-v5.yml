name: Plan7 Restored Ingestion Materialize Code v5

on:
  push:
    branches:
      - tmp-plan7-ingestion-restore-reactivation-green-v2-20260917

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      START_SHA: 796a48dc23bb3e11efed702c63133cfac396e7f1
      RESULT_BRANCH: tmp-plan7-ingestion-restore-reactivation-green-result-code-v5-20260917
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve patch controllers and reset to validated base
        shell: bash
        run: |
          set -euo pipefail
          cp .github/tmp/plan7-ingestion-restore-reactivation-green-v2.py /tmp/plan7-green-v2.py
          cp .github/tmp/plan7-release-contract-counts-v3.py /tmp/plan7-release-contract-counts-v3.py
          python .github/tmp/plan7-green-v2-controller-hotfix.py
          git checkout --detach "$START_SHA"
          test "$(git rev-parse HEAD)" = "$START_SHA"
      - name: Materialize deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/plan7-green-v2.py
          test "$(cat .plan7-green-v2-base)" = "$START_SHA"
          rm .plan7-green-v2-base
          python /tmp/plan7-release-contract-counts-v3.py
          git diff --check
          allowed='^(scripts/restore-food-catalog-portable\.mjs|scripts/food-catalog-ingestion-restore-reactivation-gate\.test\.mjs|scripts/verify-food-catalog-integrated-restore\.mjs|scripts/verify-food-catalog-integrated-restore\.test\.mjs|scripts/run-database-verification\.test\.mjs|scripts/promote-release-schema-compatibility\.test\.mjs|scripts/release-compatibility-contract\.test\.mjs|scripts/release-target-compatibility\.test\.mjs|supabase/migrations/20260917023000_food_catalog_ingestion_restore_reactivation_gate\.sql|supabase/verification/food-catalog-plan7-ingestion-restore-reactivation-gate\.sql|supabase/migration-ledger\.json|docs/architecture/migration-ledger-reconciliation\.md|\.github/workflows/food-catalog-plan7-integrated-full-dr\.yml)$'
          git status --porcelain | sed -E 's/^.. //' | while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "$file" | grep -Eq "$allowed"
          done
          git checkout -- .github/workflows/food-catalog-plan7-integrated-full-dr.yml
          git diff --check
      - name: Commit validated code SQL docs result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/restore-food-catalog-portable.mjs \
            scripts/food-catalog-ingestion-restore-reactivation-gate.test.mjs \
            scripts/verify-food-catalog-integrated-restore.mjs \
            scripts/verify-food-catalog-integrated-restore.test.mjs \
            scripts/run-database-verification.test.mjs \
            scripts/promote-release-schema-compatibility.test.mjs \
            scripts/release-compatibility-contract.test.mjs \
            scripts/release-target-compatibility.test.mjs \
            supabase/migrations/20260917023000_food_catalog_ingestion_restore_reactivation_gate.sql \
            supabase/verification/food-catalog-plan7-ingestion-restore-reactivation-gate.sql \
            supabase/migration-ledger.json \
            docs/architecture/migration-ledger-reconciliation.md
          git commit -m 'fix(plan7): block restored ingestion reactivation'
          test "$(git rev-list --count "$START_SHA"..HEAD)" = "1"
          test -z "$(git status --porcelain)"
          git push --force origin HEAD:"refs/heads/$RESULT_BRANCH"
