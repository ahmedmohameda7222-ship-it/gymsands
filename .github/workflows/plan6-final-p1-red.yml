name: Plan 6 Final P1 RED

on:
  push:
    branches:
      - feat/food-catalog-governance-plan6

permissions:
  contents: read

env:
  PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  source-contract-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Final P1 source contracts must fail before the fix
        run: ./node_modules/.bin/vitest run --config vitest.unit.config.mjs lib/product/food-catalog-governance-plan6-final-p1-rereview.test.ts

  live-owner-red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Replay exact migration chain
        run: node scripts/replay-local-migration-chain.mjs --log /tmp/plan6-final-p1-owner-red.log --prove-future-order
      - name: Ghost/unusable Owner must reproduce RED
        run: psql "$PLAIVRA_LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/verification/food-catalog-governance-control-plane-live-owner-rereview.sql

  report-privacy-red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Replay exact migration chain
        run: node scripts/replay-local-migration-chain.mjs --log /tmp/plan6-final-p1-privacy-red.log --prove-future-order
      - name: Surviving member report payload must reproduce RED
        run: psql "$PLAIVRA_LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/verification/food-catalog-governance-control-plane-report-privacy-rereview.sql

  plan4-match-gtin-red:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Replay exact migration chain
        run: node scripts/replay-local-migration-chain.mjs --log /tmp/plan6-final-p1-gtin-red.log --prove-future-order
      - name: Plan4 MATCH / Plan6 same-Food same-GTIN deadlock must reproduce RED
        env:
          PLAIVRA_PLAN6_FINAL_P1_CONCURRENCY_TEST_DATABASE_URL: ${{ env.PLAIVRA_LOCAL_DATABASE_URL }}
          PLAIVRA_PLAN6_FINAL_P1_SCENARIO: gtin
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-food-catalog-governance-plan6-final-p1-concurrency.mjs')
          text = path.read_text()
          text = text.replace('aaa_plan6_final_p1_barcode_sleep', 'zzz_plan6_final_p1_barcode_sleep')
          text = text.replace('perform pg_catalog.pg_sleep(3);', 'perform pg_catalog.pg_sleep(15);', 1)
          old = '''  const [r6, r4] = await Promise.all([p6.done, p4Session.done]);\n'''
          new = '''  await waitFor(\n    () => runSql(`select count(*) from pg_stat_activity where application_name='${APP_P4_MATCH}' and state='active' and wait_event_type='Lock' and wait_event='advisory'`) === "1",\n    10000,\n    "Plan4 MATCH to block on the in-flight GTIN advisory lock",\n  );\n  const [r6, r4] = await Promise.all([p6.done, p4Session.done]);\n'''
          if old not in text:
              raise SystemExit('GTIN RED synchronization marker missing')
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/test-food-catalog-governance-plan6-final-p1-concurrency.mjs
