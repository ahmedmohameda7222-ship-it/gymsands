name: P8A Repair Materializer

on:
  push:
    branches:
      - feat/p8a-single-workout-pdf-report
    paths:
      - .github/workflows/p8a-repair-materializer.yml

permissions:
  contents: write

env:
  P8A_BRANCH: feat/p8a-single-workout-pdf-report
  P8A_BASE_SHA: d8a6d757425163683b98f3f546749aeffe003bb8
  EXPECTED_MATERIALIZER_BLOB: 20dad178343b0520a61d490962b9736b9d527824

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.P8A_BRANCH }}

      - name: Verify repair authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "$P8A_BRANCH"
          git merge-base --is-ancestor "$P8A_BASE_SHA" HEAD
          test "$(git hash-object .github/workflows/p8a-materialize-report-authority.yml)" = "$EXPECTED_MATERIALIZER_BLOB"
          git diff --exit-code "$P8A_BASE_SHA" -- package.json package-lock.json

      - name: Repair bounded materializer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          
          workflow = Path('.github/workflows/p8a-materialize-report-authority.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = '      - name: Correct verified P8A test contracts\n'
          end_marker = '      - name: Materialize exact vendored runtime and font artifacts\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('P8A materializer correction markers are not exact')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''      - name: Correct verified P8A contracts and control state
                  shell: bash
                  run: |
                    set -euo pipefail
                    python - <<'P8A_TESTS'
                    from pathlib import Path
          
                    def replace_lines(path_value, mutate):
                        path = Path(path_value)
                        lines = path.read_text(encoding="utf-8").splitlines()
                        updated = mutate(lines)
                        path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          
                    def correct_direction(lines):
                        focused = next(
                            (index for index, line in enumerate(lines) if 'includes("تم تنفيذ")' in line),
                            None,
                        )
                        if focused is not None:
                            if focused + 2 >= len(lines) or 'includes("ذيفنت")' not in lines[focused + 1] or 'includes("80 kg")' not in lines[focused + 2]:
                                raise SystemExit("Unexpected focused bidi assertions")
                            indent = lines[focused][: len(lines[focused]) - len(lines[focused].lstrip())]
                            lines[focused:focused + 3] = [
                                indent + 'for (const token of ["تم", "تنفيذ", "80", "kg", "8"]) {',
                                indent + '  expect(runs.some((run) => run.text.includes(token))).toBe(true);',
                                indent + '}',
                                indent + 'expect(runs.some((run) => run.text.includes("ذيفنت"))).toBe(false);',
                            ]
                        logical = next(
                            (index for index, line in enumerate(lines) if 'const logicalArabic = value.match' in line),
                            None,
                        )
                        if logical is not None:
                            if logical + 3 >= len(lines) or 'if (logicalArabic)' not in lines[logical + 1] or 'includes(logicalArabic)' not in lines[logical + 2] or lines[logical + 3].strip() != '}':
                                raise SystemExit("Unexpected parameterized bidi assertions")
                            indent = lines[logical][: len(lines[logical]) - len(lines[logical].lstrip())]
                            lines[logical:logical + 4] = [
                                indent + r'const logicalArabicTokens = value.match(/[\u0600-\u06ff]+/gu) ?? [];',
                                indent + 'expect(logicalArabicTokens.length).toBeGreaterThan(0);',
                                indent + 'for (const token of logicalArabicTokens) {',
                                indent + '  expect(runs.some((run) => run.text.includes(token))).toBe(true);',
                                indent + '}',
                            ]
                        joined = "\n".join(lines)
                        if 'const logicalArabicTokens' not in joined or 'for (const token of ["تم", "تنفيذ", "80", "kg", "8"])' not in joined:
                            raise SystemExit("Corrected bidi contracts are incomplete")
                        return lines
          
                    def correct_fonts(lines):
                        shaping = next(
                            (index for index, line in enumerate(lines) if 'expect(shaped).toHaveLength(isolated.length);' in line),
                            None,
                        )
                        if shaping is not None:
                            indent = lines[shaping][: len(lines[shaping]) - len(lines[shaping].lstrip())]
                            lines[shaping:shaping + 1] = [
                                indent + 'expect(shaped.length).toBeGreaterThan(0);',
                                indent + 'expect(shaped.length).toBeLessThan(isolated.length);',
                            ]
                        joined = "\n".join(lines)
                        if 'toBeLessThan(isolated.length)' not in joined:
                            raise SystemExit("Corrected shaping contract is incomplete")
                        return lines
          
                    replace_lines("lib/reports/pdf/text-direction.test.ts", correct_direction)
                    replace_lines("lib/reports/pdf/fonts.test.ts", correct_fonts)
          
                    state = Path("docs/control/PLAIVRA_CURRENT_STATE.md")
                    state_text = state.read_text(encoding="utf-8")
                    heading = "## P8 product reporting"
                    anchor = "## Current program\n"
                    section = (
                        "## P8 product reporting\n\n"
                        "P8A is active as the current Product Completion implementation candidate. "
                        "It establishes one server-generated PDF report for a single performed workout "
                        "and the reusable repository-owned PDF foundation required by later bounded report work.\n\n"
                        "By Product Owner decision, P6B live acceptance and P7 notifications remain deferred. "
                        "P8B remains later work. PCS-5 backup and restore authority remains deferred and open; "
                        "P8A does not change or close PCS-5.\n\n"
                    )
                    if heading in state_text:
                        if section.strip() not in state_text:
                            raise SystemExit("Existing P8 control state does not match P8A authority")
                    else:
                        if state_text.count(anchor) != 1:
                            raise SystemExit("P8A control-state anchor is not exact")
                        state.write_text(state_text.replace(anchor, section + anchor), encoding="utf-8")
                    P8A_TESTS
          
          '''
          text = text[:start] + replacement + text[end:]
          scope_old = 'docs/reports/p8a-single-workout-pdf\\.md$|lib/reports/pdf/'
          scope_new = 'docs/control/PLAIVRA_CURRENT_STATE\\.md$|docs/reports/p8a-single-workout-pdf\\.md$|lib/reports/pdf/'
          if text.count(scope_old) != 2:
              raise SystemExit(f'Expected two bounded scope anchors, found {text.count(scope_old)}')
          workflow.write_text(text.replace(scope_old, scope_new), encoding='utf-8')
          PY
          rm -f .github/workflows/p8a-repair-materializer.yml
          git diff --check
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0])' .github/workflows/p8a-materialize-report-authority.yml

      - name: Commit repaired materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plaivra Implementation Authority"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(p8a): make report contracts deterministic"
          git push origin "HEAD:$P8A_BRANCH"
