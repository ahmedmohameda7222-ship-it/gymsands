name: Plan 6 Update Ledger Doc Temp
on:
  push:
    branches:
      - feat/food-catalog-governance-plan6
    paths:
      - .github/workflows/plan6-update-ledger-doc-temp.yml
permissions:
  contents: write
jobs:
  update-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record pending Plan 6 migration authority
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/architecture/migration-ledger-reconciliation.md';
          let doc = fs.readFileSync(path, 'utf8');
          const replacements = [
            ['**Current reconciliation date:** 2026-09-07', '**Current reconciliation date:** 2026-09-08'],
            ['**Status:** Production migration history and repository ledger are reconciled through the applied Food Catalog Plan 5 serving-semantics correction', '**Status:** Production remains reconciled through the applied Food Catalog Plan 5 serving-semantics correction; repository Plan 6 governance migration is pending/unapplied'],
            ['- Pending repository migrations: **0**\n- `pendingCount = 0`\n- `schemaVerifiedUntrackedCount = 0`\n- `unresolvedCount = 0`\n- `historyRepair.state = reconciled`\n- migration-ledger `release_ready = true`', '- Pending repository migrations: **1** — `20260908100000_food_catalog_governance_control_plane.sql`\n- `pendingCount = 1`\n- `schemaVerifiedUntrackedCount = 0`\n- `unresolvedCount = 1`\n- `historyRepair.state = pending`\n- migration-ledger `release_ready = false`']
          ];
          for (const [from, to] of replacements) {
            if (!doc.includes(from)) throw new Error(`Expected ledger-doc source block missing: ${from}`);
            doc = doc.replace(from, to);
          }
          const marker = '## Food Catalog Plan 5 serving-semantics correction — Production application 2026-09-07';
          if (!doc.includes(marker)) throw new Error('Plan 5 section marker missing.');
          const section = `## Food Catalog Plan 6 governance control plane — repository pending / Production unapplied 2026-09-08\n\nRepository migration \`20260908100000_food_catalog_governance_control_plane.sql\` is a forward-only Plan 6 implementation artifact. It is intentionally classified as \`state = pending\` with no Production version/name because PR #173 is still an implementation Draft and Plan 6 migration authority does not permit application before merge.\n\nThe latest verified Production physical migration head remains \`20260907215257_food_catalog_search_serving_semantics_correction\`. The released compatibility marker remains \`20260724232734\`. The pending Plan 6 entry therefore makes the repository ledger deliberately non-release-ready: \`historyRepair.state = pending\`, \`pendingCount = 1\`, \`unresolvedCount = 1\`, and \`release_ready = false\`. Release preflight must fail closed until the Plan 6 repository migration is independently approved, merged, applied exactly once under standing migration authority, verified, and reconciled.\n\nPlan 6 implementation/verification work must not populate Foods, execute provider ingestion, activate or verify Foods, create/promote Catalog Generations, move \`food_catalog_current_generation\`, mutate derived SearchDocuments outside their existing authority, promote the compatibility marker, deploy runtime cutover, or mutate the isolated Activity Catalog. Do not apply or replay \`20260908100000_food_catalog_governance_control_plane.sql\` from this Draft implementation branch.\n\n`;
          doc = doc.replace(marker, section + marker);
          fs.writeFileSync(path, doc);
          NODE
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/migration-ledger-reconciliation.md
          git commit -m "docs: record pending Plan 6 migration authority"
          git push origin HEAD:feat/food-catalog-governance-plan6
