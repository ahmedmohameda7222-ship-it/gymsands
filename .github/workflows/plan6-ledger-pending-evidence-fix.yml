name: Plan 6 Pending Ledger Evidence Fix

on:
  push:
    branches:
      - feat/food-catalog-governance-plan6

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.head_commit.message == 'chore(plan6): stage final P1 green finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Keep pending Plan 6 ledger entry intentionally unattested and self-remove
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('.github/scripts/plan6_final_p1_apply.py'),
              Path('.github/scripts/plan6_final_p1_postpatch.py'),
          ]
          for p in files:
              s = p.read_text()
              old = '        entry["repositorySha256"] = new_hash\n        updated += 1'
              new = '''        # Pending/unapplied repository migrations are intentionally not Git-attested
        # by the Production reconciliation ledger. Durable evidence requires the
        # complete audited commit + SHA-256 + Git-blob tuple, which only makes sense
        # after a frozen committed artifact exists. Keep Plan 6 pending/unattested.
        entry.pop("evidenceCommit", None)
        entry.pop("repositorySha256", None)
        entry.pop("repositoryGitBlob", None)
        updated += 1'''
              if s.count(old) != 1:
                  raise SystemExit(f'{p}: expected one pending-ledger hash assignment, found {s.count(old)}')
              s = s.replace(old, new, 1)
              s = s.replace(
                  '# Plan 6 is pending/unapplied, so only its pending repository hash is refreshed.',
                  '# Plan 6 is pending/unapplied, so it remains intentionally unattested in the Production ledger.',
              )
              s = s.replace(
                  '# postpatch changes the pending Plan 6 migration bytes, so refresh its pending\n# repository hash only after all in-place migration edits are complete.',
                  '# Plan 6 remains pending/unapplied. Do not create partial Git evidence before\n# the final bytes exist as a committed, auditable artifact.',
              )
              p.write_text(s)
          PY
          rm -f .github/workflows/plan6-ledger-pending-evidence-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(plan6): stage final P1 green finalizer"
          git push origin HEAD:feat/food-catalog-governance-plan6
