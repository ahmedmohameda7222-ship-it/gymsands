name: Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw3b-one-shot-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aw3b-final-reconcile.py
          git show dbedfd201d5bbd5efb1988ccb92899e499197e51:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm scripts/aw3b-final-reconcile.py

      - name: Capture reconciliation evidence
        shell: bash
        run: |
          set +e
          mkdir -p quality-reports/aw3b-reconciliation
          git status --short > quality-reports/aw3b-reconciliation/git-status.txt
          git diff --check > quality-reports/aw3b-reconciliation/git-diff-check.txt 2>&1
          printf 'exit_status=%s\n' "$?" >> quality-reports/aw3b-reconciliation/git-diff-check.txt
          node scripts/check-migration-ledger.mjs > quality-reports/aw3b-reconciliation/ledger-check.txt 2>&1
          printf 'exit_status=%s\n' "$?" >> quality-reports/aw3b-reconciliation/ledger-check.txt
          git diff --stat > quality-reports/aw3b-reconciliation/diff-stat.txt
          cat quality-reports/aw3b-reconciliation/ledger-check.txt
          exit 0

      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: aw3b-reconciliation-evidence-${{ github.event.pull_request.head.sha }}
          path: quality-reports/aw3b-reconciliation/
          if-no-files-found: error
          retention-days: 14

      - name: Commit reconciled permanent tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf quality-reports/aw3b-reconciliation aw3b-reconciliation-validation.txt aw3b-ledger-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'docs(aw3b): reconcile production closure'
          git push origin HEAD:feat/active-workout-aw3b-structured-set-details
