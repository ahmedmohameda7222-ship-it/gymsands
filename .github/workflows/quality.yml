name: Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw3b-one-shot-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aw3b-final-reconcile.py
          git show HEAD^:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm scripts/aw3b-final-reconcile.py

      - name: Capture exact ledger validation
        shell: bash
        run: |
          set -uo pipefail
          git diff --check
          set +e
          node scripts/check-migration-ledger.mjs > aw3b-ledger-validation.txt 2>&1
          status=$?
          set -e
          cat aw3b-ledger-validation.txt
          printf 'exit_status=%s\n' "$status" >> aw3b-ledger-validation.txt

      - name: Commit reconciled diagnostic tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(aw3b): reconcile production closure for validation'
          git push origin HEAD:feat/active-workout-aw3b-structured-set-details
