name: Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw3b-one-shot-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export-blobs:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Build and validate permanent candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/aw3b-final-reconcile.py')
          source = path.read_text(encoding='utf-8')
          old = 'arch_path.write_text(arch)'
          new = "arch_path.write_text(arch.rstrip()+'\\n')"
          if old in source:
            source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          python scripts/aw3b-final-reconcile.py
          git show dbedfd201d5bbd5efb1988ccb92899e499197e51:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm scripts/aw3b-final-reconcile.py
          rm -f aw3b-reconciliation-validation.txt aw3b-ledger-validation.txt
          git diff --check
          node scripts/check-migration-ledger.mjs

      - name: Create remote data blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quality-reports/aw3b-final-blobs
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          paths = [
              'docs/architecture/migration-ledger-reconciliation.md',
              'docs/reports/active-workout-aw3b-implementation-report.md',
              'supabase/migration-ledger.json',
          ]
          result = {'blobs': {}, 'errors': {}}
          for path in paths:
              payload = {
                  'content': base64.b64encode(Path(path).read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              }
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=json.dumps(payload).encode('utf-8'),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      result['blobs'][path] = json.load(response)['sha']
              except urllib.error.HTTPError as error:
                  result['errors'][path] = {
                      'status': error.code,
                      'body': error.read().decode('utf-8', errors='replace'),
                  }
          out = Path('quality-reports/aw3b-final-blobs/blob-manifest.json')
          out.write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          if result['errors']:
              raise SystemExit('One or more remote blob creations failed.')
          PY

      - name: Upload blob manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aw3b-final-blob-manifest-${{ github.event.pull_request.head.sha }}
          path: quality-reports/aw3b-final-blobs/
          if-no-files-found: error
          retention-days: 14
