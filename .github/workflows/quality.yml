name: Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aw3b-one-shot-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export-candidate:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Build and validate permanent candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/aw3b-final-reconcile.py')
          source = path.read_text(encoding='utf-8')
          old = 'arch_path.write_text(arch)'
          new = "arch_path.write_text(arch.rstrip()+'\\n')"
          if old in source:
            source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          python scripts/aw3b-final-reconcile.py
          git show dbedfd201d5bbd5efb1988ccb92899e499197e51:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm scripts/aw3b-final-reconcile.py
          rm -f aw3b-reconciliation-validation.txt aw3b-ledger-validation.txt
          git diff --check
          node scripts/check-migration-ledger.mjs

      - name: Package exact candidate files
        shell: bash
        run: |
          set -euo pipefail
          out='quality-reports/aw3b-final-candidate'
          mkdir -p "$out/.github/workflows" "$out/docs/architecture" "$out/docs/reports" "$out/supabase"
          cp .github/workflows/quality.yml "$out/.github/workflows/quality.yml"
          cp docs/architecture/migration-ledger-reconciliation.md "$out/docs/architecture/"
          cp docs/reports/active-workout-aw3b-implementation-report.md "$out/docs/reports/"
          cp supabase/migration-ledger.json "$out/supabase/"
          git diff --name-status -z > "$out/changed-paths.z"
          git diff --stat > "$out/diff-stat.txt"
          git diff --check > "$out/diff-check.txt"
          node scripts/check-migration-ledger.mjs > "$out/ledger-check.txt"
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > "$out/parent-commit.txt"

      - name: Upload exact validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: aw3b-final-candidate-${{ github.event.pull_request.head.sha }}
          path: quality-reports/aw3b-final-candidate/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
