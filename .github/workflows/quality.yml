name: Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aw3b-one-shot-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Build reconciled candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/aw3b-final-reconcile.py')
          source = path.read_text(encoding='utf-8')
          old = "arch=arch[:arch.index(marker)]+section+'\\n'"
          new = "arch=arch[:arch.index(marker)]+section.rstrip()+'\\n'"
          if old in source:
            source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          python scripts/aw3b-final-reconcile.py
          git show dbedfd201d5bbd5efb1988ccb92899e499197e51:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm scripts/aw3b-final-reconcile.py
          rm -f aw3b-reconciliation-validation.txt aw3b-ledger-validation.txt

      - name: Capture exact validation
        shell: bash
        run: |
          set +e
          mkdir -p quality-reports/aw3b-reconciliation
          git status --short > quality-reports/aw3b-reconciliation/git-status.txt
          git diff --check > quality-reports/aw3b-reconciliation/git-diff-check.txt 2>&1
          printf 'exit_status=%s\n' "$?" >> quality-reports/aw3b-reconciliation/git-diff-check.txt
          node scripts/check-migration-ledger.mjs > quality-reports/aw3b-reconciliation/ledger-check.txt 2>&1
          printf 'exit_status=%s\n' "$?" >> quality-reports/aw3b-reconciliation/ledger-check.txt
          git diff --stat > quality-reports/aw3b-reconciliation/diff-stat.txt
          exit 0

      - name: Upload exact validation
        uses: actions/upload-artifact@v4
        with:
          name: aw3b-reconciliation-diagnostic-${{ github.event.pull_request.head.sha }}
          path: quality-reports/aw3b-reconciliation/
          if-no-files-found: error
          retention-days: 14
