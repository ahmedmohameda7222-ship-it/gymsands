name: Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw3b-one-shot-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply normalized permanent reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/aw3b-final-reconcile.py')
          source = path.read_text(encoding='utf-8')
          old = 'arch_path.write_text(arch)'
          new = "arch_path.write_text(arch.rstrip()+'\\n')"
          if source.count(old) != 1:
            raise SystemExit(f'Expected one final architecture write, found {source.count(old)}.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/aw3b-final-reconcile.py
          git show dbedfd201d5bbd5efb1988ccb92899e499197e51:.github/workflows/quality.yml > .github/workflows/quality.yml
          rm scripts/aw3b-final-reconcile.py
          rm -f aw3b-reconciliation-validation.txt aw3b-ledger-validation.txt

      - name: Validate reconciled permanent tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node scripts/check-migration-ledger.mjs
          test ! -e scripts/aw3b-final-reconcile.py
          test ! -e .github/workflows/aw3b-final-reconciliation.yml
          test ! -e aw3b-evidence-export
          test ! -e aw3b-migration-export
          grep -q '20260724232734_active_workout_aw3b_post_apply_logic_corrections' docs/reports/active-workout-aw3b-implementation-report.md

      - name: Commit reconciled permanent tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(aw3b): reconcile production closure'
          git push origin HEAD:feat/active-workout-aw3b-structured-set-details
