name: Dependency Relock Once

on:
  push:
    branches:
      - fix/plan6-production-exactness

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate minimal security relock
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.next = '16.3.4';
          p.devDependencies.sharp = '0.35.4';
          p.overrides.sharp = '0.35.4';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm update baseline-browser-mapping --package-lock-only --ignore-scripts
          node - <<'NODE'
          const p = require('./package.json');
          if (p.dependencies.next !== '16.3.4') throw new Error(`unexpected next ${p.dependencies.next}`);
          if (p.devDependencies.sharp !== '0.35.4') throw new Error(`unexpected sharp ${p.devDependencies.sharp}`);
          if (p.overrides.sharp !== '0.35.4') throw new Error(`unexpected sharp override ${p.overrides.sharp}`);
          if (p.dependencies.react !== '^19.2.0') throw new Error(`react changed: ${p.dependencies.react}`);
          if (p.dependencies['react-dom'] !== '^19.2.0') throw new Error(`react-dom changed: ${p.dependencies['react-dom']}`);
          NODE
      - name: Run exact locked dependency audit threshold
        run: npm audit --package-lock-only --omit=dev --audit-level=moderate
      - name: Review relock scope and package-version delta
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const before = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:package-lock.json'], {encoding:'utf8'}));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const keys = new Set([...Object.keys(before.packages || {}), ...Object.keys(after.packages || {})]);
          const changed = [];
          for (const key of [...keys].sort()) {
            const a = before.packages?.[key]?.version ?? null;
            const b = after.packages?.[key]?.version ?? null;
            if (a !== b) changed.push({package:key || '<root>', from:a, to:b});
          }
          console.log(JSON.stringify(changed, null, 2));
          NODE
          test "$(git diff --name-only | sort)" = "$(printf 'package-lock.json\npackage.json')"
          git diff --check -- package.json package-lock.json
      - name: Commit reviewed dependency authority
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency authority already matches reviewed relock; no commit needed."
            exit 0
          fi
          git commit -m "fix(deps): patch Next.js security advisories"
          git push origin HEAD:fix/plan6-production-exactness
