name: Plan6 Reconciliation Evidence Once
# reconciliation-run: 4

on:
  push:
    branches:
      - chore/plan6-production-reconciliation-final
    paths:
      - .github/workflows/plan6-reconciliation-evidence-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: chore/plan6-production-reconciliation-final
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply evidence-bound reconciliation edits
        run: node .github/scripts/plan6-run-reconcile-fixed.mjs
      - name: Deterministic dependency install
        run: npm ci
      - name: Verify focused current-state contracts
        run: |
          npx vitest run --config vitest.unit.config.mjs \
            lib/product/food-catalog-governance-plan6-database.test.ts \
            lib/product/nullable-meal-plan-snapshot-migration.test.ts \
            lib/product/food-catalog-generation-authority-migration.test.ts \
            lib/product/food-catalog-ingestion-v2-authority-migration.test.ts \
            lib/product/food-catalog-ingestion-boundary.test.ts
          node --test \
            scripts/release-compatibility-contract.test.mjs \
            scripts/release-target-compatibility.test.mjs \
            scripts/promote-release-schema-compatibility.test.mjs
          npm run migration:ledger:check
      - name: Prove immutable migration blobs
        run: |
          test "$(git rev-parse HEAD:supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql)" = "6f71952c0ec40e84b8bbe0ff4df47804fdee1478"
          test "$(git rev-parse HEAD:supabase/migrations/20260909083000_food_catalog_governance_gtin_lock_exactness.sql)" = "9e7d10d441858ebe7386b244fa6cd80c2339fd3b"
      - name: Commit verified repository reconciliation
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migration-ledger.json \
            docs/architecture/migration-ledger-reconciliation.md \
            lib/product/nullable-meal-plan-snapshot-migration.test.ts \
            lib/product/food-catalog-generation-authority-migration.test.ts \
            lib/product/food-catalog-ingestion-v2-authority-migration.test.ts \
            lib/product/food-catalog-ingestion-boundary.test.ts \
            scripts/release-compatibility-contract.test.mjs \
            scripts/release-target-compatibility.test.mjs \
            scripts/promote-release-schema-compatibility.test.mjs
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore(plan6): reconcile Production migration authority"
          git push origin HEAD:chore/plan6-production-reconciliation-final
