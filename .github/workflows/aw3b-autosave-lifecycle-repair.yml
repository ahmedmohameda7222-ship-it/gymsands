name: AW3B Autosave Lifecycle Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw3b-autosave-lifecycle-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply permanent autosave lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          autosave_path = Path('services/database/workout-set-autosave.ts')
          autosave = autosave_path.read_text(encoding='utf-8')
          helper = '''export type WorkoutSetAutosaveCoordinatorRef = {
            current: WorkoutSetAutosaveCoordinator | null;
          };

          export function disposeWorkoutSetAutosaveCoordinator(
            ref: WorkoutSetAutosaveCoordinatorRef,
          ) {
            const coordinator = ref.current;
            if (!coordinator) return;
            coordinator.cancel();
            if (ref.current === coordinator) ref.current = null;
          }

          '''
          if 'export function disposeWorkoutSetAutosaveCoordinator(' not in autosave:
              anchor = 'export function createWorkoutSetAutosaveCoordinator<TSnapshot>('
              if autosave.count(anchor) != 1:
                  raise SystemExit(f'Expected one autosave create symbol, found {autosave.count(anchor)}.')
              autosave = autosave.replace(anchor, helper + anchor, 1)
          autosave_path.write_text(autosave, encoding='utf-8')

          component_path = Path('components/workouts/workout-day-focus-session.tsx')
          component = component_path.read_text(encoding='utf-8')
          if 'disposeWorkoutSetAutosaveCoordinator,' not in component:
              anchor = '  createWorkoutSetAutosaveCoordinator,\n'
              if component.count(anchor) != 1:
                  raise SystemExit(f'Expected one autosave import symbol, found {component.count(anchor)}.')
              component = component.replace(
                  anchor,
                  anchor + '  disposeWorkoutSetAutosaveCoordinator,\n',
                  1,
              )
          old_cleanup = '    autosaveCoordinatorRef.current?.cancel();'
          new_cleanup = '    disposeWorkoutSetAutosaveCoordinator(autosaveCoordinatorRef);'
          if new_cleanup not in component:
              if component.count(old_cleanup) != 1:
                  raise SystemExit(f'Expected one autosave cleanup call, found {component.count(old_cleanup)}.')
              component = component.replace(old_cleanup, new_cleanup, 1)
          component_path.write_text(component, encoding='utf-8')

          test_path = Path('services/database/workout-set-autosave.test.ts')
          test = test_path.read_text(encoding='utf-8')
          if 'disposeWorkoutSetAutosaveCoordinator,' not in test:
              old_import = 'import { createWorkoutSetAutosaveCoordinator } from "./workout-set-autosave";'
              new_import = '''import {
            createWorkoutSetAutosaveCoordinator,
            disposeWorkoutSetAutosaveCoordinator,
            type WorkoutSetAutosaveCoordinatorRef,
          } from "./workout-set-autosave";'''
              if test.count(old_import) != 1:
                  raise SystemExit(f'Expected one autosave test import, found {test.count(old_import)}.')
              test = test.replace(old_import, new_import, 1)

          test_case = '''

            it("recreates a usable coordinator after lifecycle disposal", async () => {
              let current: Snapshot = { revision: 1, dirty: true };
              const persisted: Snapshot[] = [];
              const makeCoordinator = () => createWorkoutSetAutosaveCoordinator(() => ({
                getSnapshot: () => current,
                hasPendingWrites: (snapshot) => snapshot.dirty,
                persistSnapshot: async (snapshot) => { persisted.push({ ...snapshot }); },
                acknowledgeSnapshot: (saved) => {
                  if (current.revision === saved.revision) current = { ...current, dirty: false };
                },
              }));
              const coordinatorRef: WorkoutSetAutosaveCoordinatorRef = { current: makeCoordinator() };
              const disposedCoordinator = coordinatorRef.current;

              disposeWorkoutSetAutosaveCoordinator(coordinatorRef);

              expect(coordinatorRef.current).toBeNull();
              await disposedCoordinator?.requestFlush();
              expect(persisted).toEqual([]);

              current = { revision: 2, dirty: true };
              coordinatorRef.current = makeCoordinator();
              await coordinatorRef.current.requestFlush();

              expect(persisted).toEqual([{ revision: 2, dirty: true }]);
              expect(current).toEqual({ revision: 2, dirty: false });
            });
          '''
          if 'recreates a usable coordinator after lifecycle disposal' not in test:
              closing = '\n});\n'
              if not test.endswith(closing):
                  raise SystemExit('Autosave test suite closing symbol changed.')
              test = test[:-len(closing)] + test_case + closing
          test_path.write_text(test, encoding='utf-8')

          Path('.github/workflows/aw3b-autosave-lifecycle-repair.yml').unlink()
          PY

      - name: Validate permanent lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/aw3b-autosave-lifecycle-repair.yml
          grep -q 'disposeWorkoutSetAutosaveCoordinator(autosaveCoordinatorRef)' components/workouts/workout-day-focus-session.tsx
          grep -q 'export function disposeWorkoutSetAutosaveCoordinator(' services/database/workout-set-autosave.ts
          grep -q 'recreates a usable coordinator after lifecycle disposal' services/database/workout-set-autosave.test.ts
          npx vitest run services/database/workout-set-autosave.test.ts services/database/workout-set-details.test.ts
          npm run typecheck

      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(workouts): recreate autosave after lifecycle cleanup"
          git push origin HEAD:feat/active-workout-aw3b-structured-set-details
