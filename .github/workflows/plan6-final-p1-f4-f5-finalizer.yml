# Temporary exact-head F4/F5 finalizer; removed by its successful product commit.
name: Plan 6 Final P1 F4 F5 Finalizer

on:
  push:
    branches:
      - feat/food-catalog-governance-plan6

permissions:
  contents: write

env:
  PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - name: Apply P1-F4/F5 root corrections
        run: |
          python .github/scripts/plan6_final_p1_f4_f5_apply.py
          python .github/scripts/plan6_final_p1_f4_f5_postpatch.py
          git diff --check

      - name: Focused permanent source contracts GREEN
        run: >-
          ./node_modules/.bin/vitest run --config vitest.unit.config.mjs
          lib/product/food-catalog-governance-plan6-final-p1-f4-f5-rereview.test.ts
          lib/product/food-catalog-governance-plan6-final-p1-rereview.test.ts
          lib/product/food-catalog-governance-plan6-five-p1-rereview.test.ts
          lib/product/food-catalog-governance-plan6-authority-rereview.test.ts
          lib/product/food-catalog-governance-plan6-rereview.test.ts

      - name: Chronological migration replay
        run: node scripts/replay-local-migration-chain.mjs --log /tmp/plan6-f4-f5-green.log --prove-future-order

      - name: Database lint
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: P1-F4/F5 rollback SQL verifiers
        run: |
          psql "$PLAIVRA_LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/verification/food-catalog-governance-control-plane-deletion-durability-rereview.sql
          psql "$PLAIVRA_LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/verification/food-catalog-governance-control-plane-report-privacy-rereview.sql
          psql "$PLAIVRA_LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/verification/food-catalog-governance-control-plane-live-owner-rereview.sql

      - name: All registered database verification
        run: |
          set -euo pipefail
          log=/tmp/plan6-f4-f5-registered-db-verification.log
          if node scripts/run-database-verification.mjs >"$log" 2>&1; then
            echo "Registered database verification passed."
          else
            status=$?
            echo "::group::Registered database verification failure tail"
            tail -n 220 "$log"
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Final-P1 distinct-session concurrency adversaries
        env:
          PLAIVRA_PLAN6_FINAL_P1_CONCURRENCY_TEST_DATABASE_URL: ${{ env.PLAIVRA_LOCAL_DATABASE_URL }}
        run: node scripts/test-food-catalog-governance-plan6-final-p1-concurrency.mjs

      - name: Preserve previous five-P1 distinct-session adversaries
        env:
          PLAIVRA_PLAN6_CONCURRENCY_TEST_DATABASE_URL: ${{ env.PLAIVRA_LOCAL_DATABASE_URL }}
        run: node scripts/test-food-catalog-governance-plan6-concurrency.mjs

      - name: Migration ledger remains fail-closed
        run: npm run migration:ledger:check

      - name: Applied Plan 4 remains byte-for-byte unchanged
        run: |
          test "$(git hash-object supabase/migrations/20260904100000_food_catalog_ingestion_v2_authority.sql)" = "eb2cdc2ee16462d7712080a3e3532757ec093742"
          test "$(git rev-parse 3ae5df2dea9769ca8d99b85c0918b2f408c65480:supabase/migrations/20260904100000_food_catalog_ingestion_v2_authority.sql)" = "eb2cdc2ee16462d7712080a3e3532757ec093742"

      - name: Lint and typecheck before persistence
        run: |
          npm run lint
          npm run typecheck

      - name: Persist permanent F4/F5 product and regression changes
        run: |
          set -euo pipefail
          rm -f .github/workflows/plan6-final-p1-f4-f5-red.yml
          rm -f .github/workflows/plan6-final-p1-f4-f5-finalizer.yml
          rm -f .github/scripts/plan6_final_p1_f4_f5_apply.py
          rm -f .github/scripts/plan6_final_p1_f4_f5_postpatch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(plan6): close deletion durability and report privacy blockers"
          git push origin HEAD:feat/food-catalog-governance-plan6
          echo "product_head=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "plan6_blob=$(git hash-object supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql)" >> "$GITHUB_STEP_SUMMARY"
