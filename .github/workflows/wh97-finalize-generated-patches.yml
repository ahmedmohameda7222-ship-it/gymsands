name: WH97 Finalize Generated Patches

on:
  push:
    branches:
      - feat/workout-history-program
    paths:
      - .github/workflows/wh97-finalize-generated-patches.yml
      - scripts/wh97-finalize-generated-patches.mjs

permissions:
  contents: write

concurrency:
  group: wh97-finalize-generated-patches
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: feat/workout-history-program
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply generated patches
        run: node scripts/wh97-finalize-generated-patches.mjs
      - name: Commit generated patches
        run: |
          if git diff --quiet -- services/database/workout-sessions-legacy-implementation.ts services/database/active-session-persistence-adapter.ts app/api/workouts/history/[sessionId]/route.ts package.json; then
            echo "Generated patches already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/database/workout-sessions-legacy-implementation.ts services/database/active-session-persistence-adapter.ts app/api/workouts/history/[sessionId]/route.ts package.json
          git commit -m "chore(history): apply generated authority patches"
          git push origin HEAD:feat/workout-history-program
