name: Active Workout Full Authority QA Repair
on:
  push:
    branches: ["feat/active-workout-full-implementation"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - name: Repair exact supplemental QA assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/run-active-workout-full-authority-qa.mjs')
          s = p.read_text()

          old = '''      await openSessionMenu(page);\n      await openExerciseMenu(page);\n      check(await page.locator("[data-aw10-session-menu]").getAttribute("data-state") === "closed", "Session menu stayed open behind Exercise menu.");\n      check(await page.locator("[data-aw10-exercise-actions]").getAttribute("data-state") === "open", "Exercise menu did not open.");\n      await openSessionMenu(page);\n      check(await page.locator("[data-aw10-exercise-actions]").getAttribute("data-state") === "closed", "Exercise menu stayed open behind Session menu.");'''
          new = '''      await openSessionMenu(page);\n      const exerciseTrigger = visible(page, '[data-aw10-exercise-actions] [data-aw-menu-trigger="exercise"]');\n      await exerciseTrigger.evaluate((element) => element.click());\n      await page.waitForFunction(() => document.querySelector("[data-aw10-exercise-actions]")?.getAttribute("data-state") === "open");\n      check(await page.locator("[data-aw10-session-menu]").getAttribute("data-state") === "closed", "Session menu stayed open behind Exercise menu.");\n      check(await page.locator("[data-aw10-exercise-actions]").getAttribute("data-state") === "open", "Exercise menu did not open.");\n      const sessionTrigger = visible(page, '[data-aw10-session-menu] [data-aw-menu-trigger="session"]');\n      await sessionTrigger.evaluate((element) => element.click());\n      await page.waitForFunction(() => document.querySelector("[data-aw10-session-menu]")?.getAttribute("data-state") === "open");\n      check(await page.locator("[data-aw10-exercise-actions]").getAttribute("data-state") === "closed", "Exercise menu stayed open behind Session menu.");'''
          if s.count(old) != 1: raise SystemExit(f'menu scenario anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''      const replacementText = await replacement.innerText();\n      check(!/safe for pain/i.test(replacementText), "Pain replacement UI made an unsupported medical safety claim.");\n      check(await replacement.getByRole("button", { name: /browse all/i }).count() === 1, "Replacement fallback does not expose Browse all exercises.");'''
          new = '''      const replacementText = await replacement.innerText();\n      const recommendationTexts = await recommendations.allInnerTexts();\n      check(!recommendationTexts.some((text) => /safe for pain/i.test(text)), "Pain replacement recommendation made an unsupported medical safety claim.");\n      check(/does not label an exercise as medically safe for pain/i.test(replacementText), "Pain replacement safety disclaimer is missing.");\n      check(await replacement.getByRole("button", { name: /browse all/i }).count() === 1, "Replacement fallback does not expose Browse all exercises.");'''
          if s.count(old) != 1: raise SystemExit(f'pain assertion anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''      const firstRecommendation = replacement.locator("ol li").first();\n      check((await firstRecommendation.innerText()).includes(replacementAuthority.replacementDetailName), "Expected deterministic replacement candidate was not first.");\n      await firstRecommendation.getByRole("button", { name: /^Replace$/i }).click();'''
          new = '''      const replacementCandidate = replacement.locator("ol li").filter({ hasText: replacementAuthority.replacementDetailName }).first();\n      check(await replacementCandidate.count() === 1, "Deterministic replacement candidate is missing from eligible recommendations.");\n      await replacementCandidate.getByRole("button", { name: /^Replace$/i }).click();'''
          if s.count(old) != 1: raise SystemExit(f'replacement identity anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''      check(await rest.getByRole("button").filter({ hasText: "+30" }).count() === 1, "Rest content duplicates +30 control.");'''
          new = '''      check(await rest.getByRole("button", { name: /add.*30/i }).count() === 1, "Rest content does not expose exactly one Add 30 seconds control.");'''
          if s.count(old) != 1: raise SystemExit(f'rest add-thirty anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit clean result
        shell: bash
        run: |
          rm .github/workflows/active-workout-full-authority-qa-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair Active Workout full-authority QA assertions"
          git push origin HEAD:feat/active-workout-full-implementation
