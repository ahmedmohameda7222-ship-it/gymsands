name: AW3B Exact Quality Diagnostics Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw3b-exact-quality-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply permanent autosave lifecycle repair
        run: python scripts/aw3b-autosave-lifecycle-repair.py

      - name: Validate repaired source structure
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/aw3b-autosave-lifecycle-repair.yml
          test ! -e .github/workflows/aw3b-autosave-lifecycle-pr-repair.yml
          test ! -e .github/workflows/aw3b-exact-quality-diagnostics-repair.yml
          test ! -e scripts/aw3b-autosave-lifecycle-repair.py
          grep -q 'mountWorkoutSetAutosaveCoordinator' components/workouts/workout-day-focus-session.tsx
          grep -q 'coordinatorRef.current = null' services/database/workout-set-autosave.ts
          ! grep -q 'autosaveCoordinatorRef.current?.cancel' components/workouts/workout-day-focus-session.tsx

      - name: Install dependencies
        run: npm ci

      - name: Run AW-3B targeted tests
        run: npm run test:active-workout:aw3b

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Commit permanent lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(workouts): remount autosave coordinator safely"
          git push origin HEAD:feat/active-workout-aw3b-structured-set-details
