name: AW-3C Targeted Fixture Correction

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw3c-prescription-snapshots
          fetch-depth: 0
      - name: Make AW-3B session-limit fixture AW-3C-valid
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/verification/active-workout-aw3b-integration.sql')
          text = path.read_text(encoding='utf-8')
          old = "'{\"sets\":500}'::jsonb"
          new = "'{\"sets\":100}'::jsonb"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy 500-set fixture, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git add supabase/verification/active-workout-aw3b-integration.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(db): keep AW-3B session limit fixture AW-3C-valid'
          git push origin HEAD:feat/active-workout-aw3c-prescription-snapshots
