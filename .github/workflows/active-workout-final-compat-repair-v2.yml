name: Active Workout Final Compatibility Repair V2
on:
  push:
    branches: ["feat/active-workout-full-implementation"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - name: Apply exact corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/workouts/active-workout/active-workout-execution-shell.tsx')
          s = p.read_text()
          old = '                  <li key={item.number} className="flex min-w-0 flex-1 items-center last:flex-none">\n                    <button\n                      type="button"\n                      className={cn('
          new = '                  <li key={item.number} className="flex min-w-0 flex-1 items-center last:flex-none">\n                    <button\n                      type="button"\n                      data-aw5-set-path-number={item.number}\n                      className={cn('
          if s.count(old) != 1: raise SystemExit(f'set path anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('lib/product/train-phase1-approved-ui.test.ts')
          s = p.read_text()
          old = '    const details = source("components/workouts/active-workout/active-workout-details-bridge.tsx");\n    const shell = source("components/workouts/active-workout/active-workout-execution-shell.tsx");'
          new = '    const details = source("components/workouts/active-workout/active-workout-details-bridge.tsx");\n    const replacement = source("components/workouts/active-workout/active-workout-replacement-recommendations.tsx");\n    const shell = source("components/workouts/active-workout/active-workout-execution-shell.tsx");'
          if s.count(old) != 1: raise SystemExit('replacement declaration anchor drifted')
          s = s.replace(old, new, 1)
          old = '    expect(details).toContain(\'<option value="machine_taken">{tr("actions.machineOccupied")}</option>\');'
          new = '    expect(replacement).toContain(\'"machine_taken"\');\n    expect(replacement).toContain(\'machine_taken: "replacement.reasonMachineTaken"\');\n    expect(replacement).toContain(\'tr(reasonTranslationKey[candidateReason])\');'
          if s.count(old) != 1: raise SystemExit('legacy replacement assertion anchor drifted')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit clean result
        shell: bash
        run: |
          rm .github/workflows/active-workout-final-compat-repair-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair Active Workout mature QA compatibility"
          git push origin HEAD:feat/active-workout-full-implementation
