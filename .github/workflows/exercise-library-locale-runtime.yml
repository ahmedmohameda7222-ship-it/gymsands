name: Exercise Library Locale Runtime QA
run-name: Exercise Library Locale Runtime QA / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exercise-library-locale-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_USE_MOCK_AUTH: "true"
  PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
  PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
  PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
  PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
  PLAIVRA_RELEASE_ENVIRONMENT: ci
  PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: "2"
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  locale-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Deterministic dependency install
        run: npm ci
      - name: Focused locale and Catalog authority tests
        run: >-
          npx vitest run --config vitest.unit.config.mjs
          app/api/activity-catalog/library-locale-contract.test.ts
          lib/activity-catalog/catalog-locale.test.ts
          lib/settings/user-settings-context.bootstrap.test.tsx
          components/workouts/workout-browser.locale-runtime.test.tsx
          services/database/exercise-picker-dialog-behavior.test.ts
          services/exercise-detail/client.locale.test.ts
          services/activity-catalog/server/library-v2-boundaries.test.ts
          lib/product/train-phase1-approved-semantics.test.ts
          lib/product/train-phase1-approved-ui.test.ts
      - name: Typecheck typed locale boundaries
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build mock-auth QA application
        run: NEXT_PUBLIC_USE_MOCK_AUTH=true NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA=true npm run build
      - name: Start production QA server
        run: |
          set -euo pipefail
          mkdir -p ci-reports
          NEXT_PUBLIC_USE_MOCK_AUTH=true npm run start > ci-reports/exercise-library-qa-server.log 2>&1 &
          echo "$!" > /tmp/exercise-library-qa-server.pid
      - name: Wait for production QA server
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ci-reports/exercise-library-qa-server.log
          exit 1
      - name: Exercise Library strict rendered locale QA
        env:
          QA_EXERCISE_LIBRARY_EVIDENCE_DIR: ci-reports/exercise-library-locale-evidence
        run: node scripts/run-exercise-library-locale-qa.mjs
      - name: Train rendered authority
        env:
          QA_TRAIN_EVIDENCE_DIR: ci-reports/train-qa-evidence
        run: npm run qa:train
      - name: Exact-head integrity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Stop production QA server
        if: always()
        run: |
          if [ -f /tmp/exercise-library-qa-server.pid ]; then
            kill "$(cat /tmp/exercise-library-qa-server.pid)" 2>/dev/null || true
          fi
      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exercise-library-locale-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-reports/exercise-library-locale-evidence/
            ci-reports/train-qa-evidence/
            ci-reports/exercise-library-qa-server.log
          if-no-files-found: warn
          retention-days: 30
