name: PCS3 Auth Diagnostic 1b059d94 One-Shot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pcs3-production-measurement-1b059d94-one-shot.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply authenticated landing readiness correction
        run: |
          python - <<'PY'
          from pathlib import Path
          harness = Path("scripts/measure-pcs3-production.mjs")
          source = harness.read_text()
          anchor = "  await page\n    .waitForLoadState(\"networkidle\", { timeout: 10_000 })\n    .catch(() => undefined);\n}"
          replacement = "  const landingPath = new URL(page.url()).pathname;\n  if (landingPath === \"/dashboard\") {\n    await settlePage(page, \"today\");\n  } else if (landingPath === \"/workout-history\") {\n    await settlePage(page, \"history\");\n  } else {\n    await page.waitForTimeout(SETTLEMENT_DELAY_MS);\n    await page\n      .waitForLoadState(\"networkidle\", { timeout: 10_000 })\n      .catch(() => undefined);\n  }\n}"
          if source.count(anchor) != 1:
              raise SystemExit("landing_readiness_anchor_invalid")
          harness.write_text(source.replace(anchor, replacement, 1))

          test_file = Path("scripts/measure-pcs3-production.login.test.mjs")
          test_source = test_file.read_text()
          fixture_anchor = "  const submit = locator({ count: submitCount, waitError });\n  let currentUrl = \"https://app.plaivra.com/login\";"
          fixture_replacement = "  const submit = locator({ count: submitCount, waitError });\n  const main = locator();\n  let currentUrl = \"https://app.plaivra.com/login\";"
          if test_source.count(fixture_anchor) != 1:
              raise SystemExit("main_fixture_anchor_invalid")
          test_source = test_source.replace(fixture_anchor, fixture_replacement, 1)

          locator_anchor = "      if (selector === 'input[type=\"password\"]') return password;\n      return submit;"
          locator_replacement = "      if (selector === 'input[type=\"password\"]') return password;\n      if (selector === \"main\") return main;\n      return submit;"
          if test_source.count(locator_anchor) != 1:
              raise SystemExit("main_locator_anchor_invalid")
          test_source = test_source.replace(locator_anchor, locator_replacement, 1)

          timeout_anchor = "    waitForLoadState: asyncSpy(),\n    waitForURL: asyncSpy(async (predicate) => {"
          timeout_replacement = "    waitForLoadState: asyncSpy(),\n    waitForTimeout: asyncSpy(),\n    waitForURL: asyncSpy(async (predicate) => {"
          if test_source.count(timeout_anchor) != 1:
              raise SystemExit("wait_timeout_fixture_anchor_invalid")
          test_source = test_source.replace(timeout_anchor, timeout_replacement, 1)

          return_anchor = "  return { page, email, password, submit };"
          return_replacement = "  return { page, email, password, submit, main };"
          if test_source.count(return_anchor) != 1:
              raise SystemExit("fixture_return_anchor_invalid")
          test_source = test_source.replace(return_anchor, return_replacement, 1)

          test_start = "  const { page, email, password, submit } = pageFixture();"
          test_start_replacement = "  const { page, email, password, submit, main } = pageFixture();"
          if test_source.count(test_start) != 1:
              raise SystemExit("first_test_fixture_anchor_invalid")
          test_source = test_source.replace(test_start, test_start_replacement, 1)

          assertion_anchor = "  assert.equal(submit.waitFor.calls.length, 1);\n  assert.equal(page.waitForFunction.calls.length, 1);"
          assertion_replacement = "  assert.equal(submit.waitFor.calls.length, 1);\n  assert.equal(main.waitFor.calls.length, 1);\n  assert.equal(page.waitForFunction.calls.length, 2);\n  assert.deepEqual(page.waitForTimeout.calls[0], [300]);"
          if test_source.count(assertion_anchor) != 1:
              raise SystemExit("readiness_assertion_anchor_invalid")
          test_file.write_text(test_source.replace(assertion_anchor, assertion_replacement, 1))
          PY

      - name: Run focused PCS3 login tests
        run: node --test scripts/measure-pcs3-production.login.test.mjs

      - name: Verify bounded diff
        run: |
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' scripts/measure-pcs3-production.login.test.mjs scripts/measure-pcs3-production.mjs | sort)"
          test "$changed" = "$expected"

      - name: Commit bounded correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/measure-pcs3-production.mjs scripts/measure-pcs3-production.login.test.mjs
          git commit -m "fix(perf): settle authenticated page before PCS3 capture"
          git push origin HEAD:ops/pcs3-production-measurement-1b059d94
