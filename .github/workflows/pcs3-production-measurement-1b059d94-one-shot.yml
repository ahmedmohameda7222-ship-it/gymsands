name: PCS3 Auth Diagnostic 1b059d94 One-Shot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pcs3-production-measurement-1b059d94-one-shot.yml"
      - "scripts/pcs3-auth-diagnostic-1b059d94-one-shot.mjs"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Checkout diagnostic branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply bounded hydration-settlement diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/pcs3-auth-diagnostic-1b059d94-one-shot.mjs")
          source = path.read_text()
          needle = '    pushRoute(result.routeSequence, page.url());\n\n    stage = "wait_controls";'
          replacement = '    await page.waitForLoadState("networkidle", { timeout: 10_000 }).catch(() => undefined);\n    pushRoute(result.routeSequence, page.url());\n\n    stage = "wait_controls";'
          if needle not in source:
              raise SystemExit("diagnostic_patch_anchor_missing")
          path.write_text(source.replace(needle, replacement, 1))
          PY

      - name: Run sanitized two-account auth diagnostic
        env:
          PLAIVRA_SMOKE_POPULATED_EMAIL: ${{ secrets.PLAIVRA_SMOKE_POPULATED_EMAIL }}
          PLAIVRA_SMOKE_POPULATED_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_POPULATED_PASSWORD }}
          PLAIVRA_SMOKE_EMPTY_EMAIL: ${{ secrets.PLAIVRA_SMOKE_EMPTY_EMAIL }}
          PLAIVRA_SMOKE_EMPTY_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_EMPTY_PASSWORD }}
        run: node scripts/pcs3-auth-diagnostic-1b059d94-one-shot.mjs

      - name: Upload sanitized auth diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcs3-auth-diagnostic-1b059d94-hydrated
          path: quality-reports/pcs3-auth-diagnostic-1b059d94
          if-no-files-found: error
          retention-days: 14
