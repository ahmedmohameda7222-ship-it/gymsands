name: PCS3 Auth Diagnostic 1b059d94 One-Shot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pcs3-production-measurement-1b059d94-one-shot.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply post-login settlement correction
        run: |
          python - <<'PY'
          from pathlib import Path
          harness = Path("scripts/measure-pcs3-production.mjs")
          source = harness.read_text()
          anchor = "  assertSameOrigin(page.url(), origin);\n  if (new URL(page.url()).pathname === \"/login\") {\n    throw new Error(\"SYNTHETIC_AUTHENTICATION_FAILED\");\n  }\n}"
          replacement = "  assertSameOrigin(page.url(), origin);\n  if (new URL(page.url()).pathname === \"/login\") {\n    throw new Error(\"SYNTHETIC_AUTHENTICATION_FAILED\");\n  }\n  await page\n    .waitForLoadState(\"networkidle\", { timeout: 10_000 })\n    .catch(() => undefined);\n}"
          if source.count(anchor) != 1:
              raise SystemExit("post_login_settlement_anchor_invalid")
          harness.write_text(source.replace(anchor, replacement, 1))

          test_file = Path("scripts/measure-pcs3-production.login.test.mjs")
          test_source = test_file.read_text()
          anchor_test = "  assert.deepEqual(page.waitForLoadState.calls[0], [\n    \"networkidle\",\n    { timeout: 10000 },\n  ]);\n  assert.deepEqual(email.waitFor.calls[0], [{ state: \"visible\", timeout: 30000 }]);"
          replacement_test = "  assert.equal(page.waitForLoadState.calls.length, 2);\n  assert.deepEqual(page.waitForLoadState.calls[0], [\n    \"networkidle\",\n    { timeout: 10000 },\n  ]);\n  assert.deepEqual(page.waitForLoadState.calls[1], [\n    \"networkidle\",\n    { timeout: 10000 },\n  ]);\n  assert.deepEqual(email.waitFor.calls[0], [{ state: \"visible\", timeout: 30000 }]);"
          if test_source.count(anchor_test) != 1:
              raise SystemExit("post_login_test_anchor_invalid")
          test_file.write_text(test_source.replace(anchor_test, replacement_test, 1))
          PY

      - name: Run focused PCS3 login tests
        run: node --test scripts/measure-pcs3-production.login.test.mjs

      - name: Verify bounded diff
        run: |
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' scripts/measure-pcs3-production.login.test.mjs scripts/measure-pcs3-production.mjs | sort)"
          test "$changed" = "$expected"

      - name: Commit bounded correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/measure-pcs3-production.mjs scripts/measure-pcs3-production.login.test.mjs
          git commit -m "fix(perf): settle authenticated landing before PCS3 capture"
          git push origin HEAD:ops/pcs3-production-measurement-1b059d94
