name: PCS3 Auth Diagnostic 1b059d94 One-Shot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pcs3-production-measurement-1b059d94-one-shot.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply owner-scoped active-session read authority
        env:
          ROUTE_Z: 
          CLIENT_Z: 
          WORKOUT_Z: 
          TEST_Z: 
        run: |
          python - <<'PY'
          import base64
          import os
          import zlib
          from pathlib import Path

          files = {
              "app/api/workouts/active-session/route.ts": os.environ["ROUTE_Z"],
              "services/workouts/active-session-client.ts": os.environ["CLIENT_Z"],
              "services/database/workout-sessions.ts": os.environ["WORKOUT_Z"],
              "lib/product/pcs3-active-session-read-authority.test.ts": os.environ["TEST_Z"],
          }
          for name, payload in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY

      - name: Run focused authority tests
        run: |
          npx vitest run --config vitest.unit.config.mjs lib/product/pcs3-active-session-read-authority.test.ts scripts/measure-pcs3-production.login.test.mjs
          npm run typecheck

      - name: Verify bounded diff
        run: |
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' app/api/workouts/active-session/route.ts lib/product/pcs3-active-session-read-authority.test.ts services/database/workout-sessions.ts services/workouts/active-session-client.ts | sort)"
          test "$changed" = "$expected"

      - name: Commit bounded correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/workouts/active-session/route.ts lib/product/pcs3-active-session-read-authority.test.ts services/database/workout-sessions.ts services/workouts/active-session-client.ts
          git commit -m "fix(perf): route active-session discovery through server authority"
          git push origin HEAD:ops/pcs3-production-measurement-1b059d94
