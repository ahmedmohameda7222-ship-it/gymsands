name: Plan 6 ledger reconcile once

on:
  push:
    branches:
      - fix/plan6-production-exactness

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plan6-production-exactness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile Plan 6 ledger state
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ledgerPath = 'supabase/migration-ledger.json';
          const docPath = 'docs/architecture/migration-ledger-reconciliation.md';
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const original = '20260908100000_food_catalog_governance_control_plane.sql';
          const correction = '20260909083000_food_catalog_governance_gtin_lock_exactness.sql';
          const originalEntry = ledger.entries.find((entry) => entry.localFile === original);
          if (!originalEntry) throw new Error(`Missing ledger entry: ${original}`);
          Object.assign(originalEntry, {
            state: 'ledger_drift_review',
            productionVersion: '20260909081402',
            productionName: 'food_catalog_governance_control_plane',
            note: 'Production applied Plan 6 once as generated identity 20260909081402_food_catalog_governance_control_plane. Post-apply exactness verification found one transfer-time divergence in the GTIN UPDATE serialization path: Production used a direct Food row lock instead of the reviewed canonical private.food_catalog_lock_food_authority(v_food) helper. Forward-only repository migration 20260909083000_food_catalog_governance_gtin_lock_exactness.sql is pending to restore exact reviewed semantics. Do not replay the applied Plan 6 migration.'
          });
          if (!ledger.entries.some((entry) => entry.localFile === correction)) {
            ledger.entries.push({
              localFile: correction,
              state: 'pending',
              note: 'Forward-only Plan 6 Production exactness correction. Pending and unapplied until PR #174 is merged and explicit Production apply/read-back is completed.'
            });
          }
          ledger.entries.sort((a, b) => a.localFile.localeCompare(b.localFile));
          const resolved = new Set(['applied', 'applied_version_alias']);
          const pendingCount = ledger.entries.filter((entry) => entry.state === 'pending').length;
          const untrackedCount = ledger.entries.filter((entry) => entry.state === 'applied_schema_untracked').length;
          const unresolvedCount = ledger.entries.filter((entry) => !resolved.has(entry.state)).length;
          ledger.pendingCount = pendingCount;
          ledger.schemaVerifiedUntrackedCount = untrackedCount;
          ledger.unresolvedCount = unresolvedCount;
          ledger.historyRepair = ledger.historyRepair || {};
          ledger.historyRepair.state = 'pending';
          ledger.historyRepair.pendingCount = pendingCount;
          ledger.historyRepair.schemaAppliedUntrackedCount = untrackedCount;
          ledger.historyRepair.unresolvedCount = unresolvedCount;
          ledger.historyRepair.note = 'Production migration history is reconciled through Plan 5. Plan 6 was applied once as generated identity 20260909081402_food_catalog_governance_control_plane, but post-apply exactness verification identified one GTIN UPDATE serialization helper divergence introduced during connector-side SQL transfer. Repository migration 20260909083000_food_catalog_governance_gtin_lock_exactness.sql is pending as the forward-only correction. Do not replay applied migrations.';
          fs.writeFileSync(ledgerPath, JSON.stringify(ledger));

          let doc = fs.readFileSync(docPath, 'utf8');
          const marker = '## Plan 6 production exactness reconciliation';
          const section = `${marker}\n\n- \`20260908100000_food_catalog_governance_control_plane.sql\`: \`ledger_drift_review\`; applied once to Plaivra Production as \`20260909081402_food_catalog_governance_control_plane\`. Post-apply exactness verification found one GTIN UPDATE serialization helper divergence introduced during transfer. Do not replay.\n- \`20260909083000_food_catalog_governance_gtin_lock_exactness.sql\`: \`pending\`; forward-only correction that restores the reviewed canonical Food-lock helper path. No Production identity until explicit post-merge apply.\n- No Food population, provider ingestion, activation, Catalog Generation creation/promotion, current-pointer movement, SearchDocument mutation, runtime cutover, deployment, or Activity Catalog mutation is authorized by this reconciliation.\n`;
          if (!doc.includes(marker)) doc = `${doc.trimEnd()}\n\n${section}`;
          fs.writeFileSync(docPath, doc);
          NODE
      - name: Remove one-shot workflow
        run: rm .github/workflows/plan6-ledger-reconcile-once.yml
      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migration-ledger.json docs/architecture/migration-ledger-reconciliation.md .github/workflows/plan6-ledger-reconcile-once.yml
          git commit -m "chore(plan6): reconcile production migration ledger"
          git push origin HEAD:fix/plan6-production-exactness
