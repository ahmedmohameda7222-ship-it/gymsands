name: PCS3 Production Measurement One-Shot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pcs3-production-measurement-one-shot.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  OUTPUT_DIR: quality-reports/pcs3-production-measurement
  DIAGNOSTIC_DIR: quality-reports/pcs3-fixture-diagnostic

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    steps:
      - name: Checkout exact Production source
        uses: actions/checkout@v4
        with:
          ref: 94b1ba09288c4cda30ee96637c3f73bf2a0e80d5
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify protected fixture inputs exist
        env:
          POPULATED_EMAIL: ${{ secrets.PLAIVRA_SMOKE_POPULATED_EMAIL }}
          POPULATED_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_POPULATED_PASSWORD }}
          EMPTY_EMAIL: ${{ secrets.PLAIVRA_SMOKE_EMPTY_EMAIL }}
          EMPTY_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_EMPTY_PASSWORD }}
        run: |
          node <<'NODE'
          const required = [
            "POPULATED_EMAIL",
            "POPULATED_PASSWORD",
            "EMPTY_EMAIL",
            "EMPTY_PASSWORD",
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) {
            console.error("PCS3_SYNTHETIC_FIXTURE_INPUT_MISSING");
            process.exit(1);
          }
          console.log("PCS3_SYNTHETIC_FIXTURE_INPUTS_PRESENT");
          NODE

      - name: Run safe fixture login diagnostic
        id: diagnostic
        env:
          PLAIVRA_SMOKE_POPULATED_EMAIL: ${{ secrets.PLAIVRA_SMOKE_POPULATED_EMAIL }}
          PLAIVRA_SMOKE_POPULATED_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_POPULATED_PASSWORD }}
          PLAIVRA_SMOKE_EMPTY_EMAIL: ${{ secrets.PLAIVRA_SMOKE_EMPTY_EMAIL }}
          PLAIVRA_SMOKE_EMPTY_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_EMPTY_PASSWORD }}
        run: |
          mkdir -p "$DIAGNOSTIC_DIR"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "@playwright/test";

          const fixtures = [
            {
              account: "populated",
              email: process.env.PLAIVRA_SMOKE_POPULATED_EMAIL,
              password: process.env.PLAIVRA_SMOKE_POPULATED_PASSWORD,
            },
            {
              account: "empty",
              email: process.env.PLAIVRA_SMOKE_EMPTY_EMAIL,
              password: process.env.PLAIVRA_SMOKE_EMPTY_PASSWORD,
            },
          ];
          const classifyPath = (pathname) => {
            if (pathname === "/login") return "login";
            if (pathname === "/onboarding") return "onboarding";
            if (pathname.startsWith("/auth/")) return "auth";
            if (pathname === "/dashboard" || pathname.startsWith("/dashboard/")) return "private";
            if (pathname.startsWith("/my-workout") || pathname.startsWith("/workout-history")) return "private";
            if (pathname.startsWith("/settings") || pathname.startsWith("/progress") || pathname.startsWith("/calories")) return "private";
            return "other";
          };

          const browser = await chromium.launch({ headless: true });
          const results = [];
          for (const fixture of fixtures) {
            const context = await browser.newContext({
              locale: "en-GB",
              timezoneId: "Europe/Berlin",
            });
            const page = await context.newPage();
            let pageErrorCount = 0;
            let consoleErrorCount = 0;
            let tokenStatus = null;
            let bootstrapCount = 0;
            const stages = [];
            page.on("pageerror", () => { pageErrorCount += 1; });
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrorCount += 1;
            });
            page.on("response", (response) => {
              const url = response.url();
              if (url.includes("/auth/v1/token") && url.includes("grant_type=password")) {
                tokenStatus = response.status();
              }
              if (url.includes("/rest/v1/rpc/get_private_app_bootstrap_v1")) {
                bootstrapCount += 1;
              }
            });

            let navigationStatus = null;
            let emailCount = 0;
            let passwordCount = 0;
            let submitCount = 0;
            let submitVisible = false;
            let submitEnabled = false;
            let finalPathCategory = "unknown";
            try {
              stages.push("goto_login");
              const response = await page.goto("https://app.plaivra.com/login", {
                waitUntil: "networkidle",
                timeout: 30000,
              });
              navigationStatus = response?.status() ?? null;
              emailCount = await page.locator('input[type="email"]').count();
              passwordCount = await page.locator('input[type="password"]').count();
              submitCount = await page.locator('button[type="submit"]').count();
              if (submitCount === 1) {
                submitVisible = await page.locator('button[type="submit"]').isVisible();
                submitEnabled = await page.locator('button[type="submit"]').isEnabled();
              }
              stages.push("controls_checked");
              if (emailCount === 1 && passwordCount === 1 && submitCount === 1) {
                await page.locator('input[type="email"]').fill(fixture.email);
                await page.locator('input[type="password"]').fill(fixture.password);
                stages.push("credentials_filled");
                await page.locator('button[type="submit"]').click();
                stages.push("submit_clicked");
                await page.waitForTimeout(1500);
                await page.waitForURL((url) => url.pathname !== "/login", {
                  timeout: 30000,
                }).catch(() => undefined);
              }
              finalPathCategory = classifyPath(new URL(page.url()).pathname);
            } catch {
              stages.push("safe_exception");
              try {
                finalPathCategory = classifyPath(new URL(page.url()).pathname);
              } catch {
                finalPathCategory = "unknown";
              }
            }

            const passed =
              navigationStatus === 200 &&
              emailCount === 1 &&
              passwordCount === 1 &&
              submitCount === 1 &&
              submitVisible &&
              submitEnabled &&
              tokenStatus === 200 &&
              finalPathCategory !== "login" &&
              finalPathCategory !== "unknown" &&
              pageErrorCount === 0;

            results.push({
              account: fixture.account,
              navigationStatus,
              emailCount,
              passwordCount,
              submitCount,
              submitVisible,
              submitEnabled,
              tokenStatus,
              bootstrapCount,
              finalPathCategory,
              pageErrorCount,
              consoleErrorCount,
              stages,
              passed,
            });
            await context.close();
          }
          await browser.close();
          const passed = results.every((result) => result.passed);
          const evidence = {
            checkedAt: new Date().toISOString(),
            productionCommit: "94b1ba09288c4cda30ee96637c3f73bf2a0e80d5",
            credentialsLogged: false,
            syntheticDataOnly: true,
            passed,
            results,
          };
          fs.writeFileSync(
            `${process.env.DIAGNOSTIC_DIR}/diagnostic.json`,
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `passed=${passed}\n`);
          console.log(passed ? "PCS3_FIXTURE_DIAGNOSTIC_PASSED" : "PCS3_FIXTURE_DIAGNOSTIC_FAILED");
          NODE

      - name: Run authenticated Production measurement
        id: measurement
        if: steps.diagnostic.outputs.passed == 'true'
        env:
          PLAIVRA_SMOKE_POPULATED_EMAIL: ${{ secrets.PLAIVRA_SMOKE_POPULATED_EMAIL }}
          PLAIVRA_SMOKE_POPULATED_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_POPULATED_PASSWORD }}
          PLAIVRA_SMOKE_EMPTY_EMAIL: ${{ secrets.PLAIVRA_SMOKE_EMPTY_EMAIL }}
          PLAIVRA_SMOKE_EMPTY_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_EMPTY_PASSWORD }}
        run: |
          set +e
          npm run measure:pcs3-production -- \
            --mode production \
            --url https://app.plaivra.com \
            --expected-commit 94b1ba09288c4cda30ee96637c3f73bf2a0e80d5 \
            --expected-migration 20260724232734 \
            --samples 20 \
            --warmups 2 \
            --account both \
            --output "$OUTPUT_DIR" \
            > /tmp/pcs3-command-output.log 2>&1
          status=$?
          rm -f /tmp/pcs3-command-output.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify sanitized evidence boundary
        if: steps.diagnostic.outputs.passed == 'true' && always()
        env:
          PLAIVRA_SMOKE_POPULATED_EMAIL: ${{ secrets.PLAIVRA_SMOKE_POPULATED_EMAIL }}
          PLAIVRA_SMOKE_POPULATED_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_POPULATED_PASSWORD }}
          PLAIVRA_SMOKE_EMPTY_EMAIL: ${{ secrets.PLAIVRA_SMOKE_EMPTY_EMAIL }}
          PLAIVRA_SMOKE_EMPTY_PASSWORD: ${{ secrets.PLAIVRA_SMOKE_EMPTY_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = path.resolve(process.env.OUTPUT_DIR);
          if (!fs.existsSync(root)) {
            console.error("PCS3_SANITIZED_EVIDENCE_MISSING");
            process.exit(1);
          }
          const allowed = new Set([
            "summary.json",
            "summary.md",
            "populated/samples.json",
            "empty/samples.json",
          ]);
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const absolute = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(absolute);
              else files.push(path.relative(root, absolute).split(path.sep).join("/"));
            }
          }
          walk(root);
          const unexpected = files.filter((file) => !allowed.has(file));
          if (unexpected.length) {
            console.error("PCS3_UNEXPECTED_EVIDENCE_FILE");
            process.exit(1);
          }
          const secrets = [
            process.env.PLAIVRA_SMOKE_POPULATED_EMAIL,
            process.env.PLAIVRA_SMOKE_POPULATED_PASSWORD,
            process.env.PLAIVRA_SMOKE_EMPTY_EMAIL,
            process.env.PLAIVRA_SMOKE_EMPTY_PASSWORD,
          ].filter(Boolean);
          for (const file of files) {
            const content = fs.readFileSync(path.join(root, file), "utf8");
            if (secrets.some((secret) => content.includes(secret))) {
              console.error("PCS3_SECRET_FOUND_IN_EVIDENCE");
              process.exit(1);
            }
          }
          console.log("PCS3_SANITIZED_EVIDENCE_VERIFIED");
          NODE

      - name: Upload safe fixture diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcs3-fixture-diagnostic-94b1ba0
          path: ${{ env.DIAGNOSTIC_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload sanitized PCS-3 evidence
        if: steps.diagnostic.outputs.passed == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: pcs3-production-measurement-94b1ba0
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce measurement result
        if: always()
        run: |
          test "${{ steps.diagnostic.outputs.passed }}" = "true"
          test "${{ steps.measurement.outputs.exit_code }}" = "0"
