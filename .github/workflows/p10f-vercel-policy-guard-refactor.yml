name: P10F Vercel Policy Guard Refactor

on:
  push:
    branches:
      - feat/p10f-activity-catalog-v2-cutover
    paths:
      - .github/workflows/p10f-vercel-policy-guard-refactor.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p10f-activity-catalog-v2-cutover
          fetch-depth: 0
      - name: Align exact P10F Preview allowlist guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/provider-release-gates.test.mjs')
          text = p.read_text()
          replacements = [
            (
              'test("repository config declares Vercel main-only policy intent without a repository-side gate", () => {',
              'test("repository config keeps main deployment policy with only the bounded P10F Preview branch", () => {'
            ),
            (
              '  assert.deepEqual(config.git?.deploymentEnabled, { "**": false, main: true });',
              '  assert.deepEqual(config.git?.deploymentEnabled, {\n    "**": false,\n    main: true,\n    "feat/p10f-activity-catalog-v2-cutover": true,\n  });'
            )
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'provider-release-gates.test.mjs: expected one anchor, found {count}: {old!r}')
            text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Remove one-shot workflow and commit correction
        run: |
          rm .github/workflows/p10f-vercel-policy-guard-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/provider-release-gates.test.mjs .github/workflows/p10f-vercel-policy-guard-refactor.yml
          git diff --cached --check
          git commit -m 'P10F — bound Vercel Preview branch policy'
          git push origin HEAD:feat/p10f-activity-catalog-v2-cutover
