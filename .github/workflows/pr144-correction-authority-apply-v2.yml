name: PR144 Correction Authority Apply V2

on:
  push:
    branches:
      - feat/active-workout-full-implementation
    paths:
      - .github/workflows/pr144-correction-authority-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - name: Apply correction-only implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacements, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          shell = 'components/workouts/active-workout/active-workout-execution-shell.tsx'
          replace_exact(shell, '  restActive: boolean;\n  restLabel: string;', '  restActive: boolean;\n  restControlsDisabled: boolean;\n  restLabel: string;')
          replace_exact(shell, '  restActive,\n  restLabel,', '  restActive,\n  restControlsDisabled,\n  restLabel,')
          replace_exact(shell, '''    const onKeyDown = (event: KeyboardEvent) => {\n      if (event.key !== "Escape") return;\n      const previous = openMenu;\n      setOpenMenu(null);\n      window.requestAnimationFrame(() => {\n        (previous === "session" ? sessionMenuTriggerRef.current : exerciseMenuTriggerRef.current)?.focus();\n      });\n    };''', '''    const onKeyDown = (event: KeyboardEvent) => {\n      const selector = openMenu === "session"\n        ? "[data-aw10-session-menu]"\n        : "[data-aw10-exercise-actions]";\n      const menu = document.querySelector(`${selector} [role="menu"]`);\n      const enabledItems = menu\n        ? Array.from(menu.querySelectorAll<HTMLButtonElement>('[role="menuitem"]')).filter((item) => !item.disabled)\n        : [];\n      if (["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key) && enabledItems.length) {\n        event.preventDefault();\n        const currentIndex = enabledItems.findIndex((item) => item === document.activeElement);\n        const nextIndex = event.key === "Home"\n          ? 0\n          : event.key === "End"\n            ? enabledItems.length - 1\n            : event.key === "ArrowDown"\n              ? (currentIndex + 1 + enabledItems.length) % enabledItems.length\n              : currentIndex < 0\n                ? enabledItems.length - 1\n                : (currentIndex - 1 + enabledItems.length) % enabledItems.length;\n        enabledItems[nextIndex]?.focus();\n        return;\n      }\n      if (event.key !== "Escape") return;\n      event.preventDefault();\n      const previous = openMenu;\n      setOpenMenu(null);\n      window.requestAnimationFrame(() => {\n        (previous === "session" ? sessionMenuTriggerRef.current : exerciseMenuTriggerRef.current)?.focus();\n      });\n    };''')
          replace_exact(shell, '      <main className="mt-4 sm:mt-6">', '      <main className="mt-3 sm:mt-6">')
          replace_exact(shell, '<p className="text-xs font-semibold uppercase tracking-[0.14em] text-muted-foreground">{restPresetSectionLabel}</p>', '<p data-aw10-rest-label className="text-xs font-semibold uppercase tracking-[0.14em] text-muted-foreground">{restPresetSectionLabel}</p>')
          replace_exact(shell, 'onClick={onAddThirtySeconds} disabled={busy}', 'onClick={onAddThirtySeconds} disabled={restControlsDisabled}')
          replace_exact(shell, 'onClick={() => onStartRest(preset.seconds)} disabled={busy}', 'onClick={() => onStartRest(preset.seconds)} disabled={restControlsDisabled}')
          replace_exact(shell, '<div className="flex items-start gap-3 border-b border-border/70 pb-4">', '<div className="flex items-start gap-3 border-b border-border/70 pb-3 sm:pb-4">')
          replace_exact(shell, '''                <h2 id="aw5-current-exercise" data-aw5-exercise-title className="mt-0.5 text-[clamp(1.6rem,6vw,2.5rem)] font-semibold leading-[1.08] tracking-[-0.04em] text-foreground">\n                  <button\n                    type="button"\n                    data-aw10-exercise-details-trigger\n                    className="group inline-flex min-h-12 max-w-full items-start gap-1.5 text-start outline-none hover:underline hover:decoration-1 hover:underline-offset-4 focus-visible:ring-2 focus-visible:ring-ring"\n                    onClick={(event) => closeThenWithTrigger(onOpenDetails, event.currentTarget)}\n                  >\n                    <bdi className="min-w-0 break-words">{exerciseName}</bdi>\n                    <ChevronRight className="mt-[0.18em] h-[0.8em] w-[0.8em] shrink-0 rtl:rotate-180" aria-hidden="true" />\n                  </button>\n                </h2>''', '''                <h2 id="aw5-current-exercise" data-aw5-exercise-title className="mt-0.5 text-[clamp(1.5rem,6vw,2.5rem)] font-semibold leading-[1.08] tracking-[-0.04em] text-foreground">\n                  <button\n                    type="button"\n                    data-aw10-exercise-details-trigger\n                    aria-label={exerciseName}\n                    className="group flex min-h-12 max-w-full items-start gap-1.5 text-start outline-none hover:underline hover:decoration-1 hover:underline-offset-4 focus-visible:ring-2 focus-visible:ring-ring"\n                    onClick={(event) => closeThenWithTrigger(onOpenDetails, event.currentTarget)}\n                  >\n                    <bdi className="line-clamp-2 min-w-0 break-words lg:line-clamp-none">{exerciseName}</bdi>\n                    <ChevronRight className="mt-[0.18em] h-[0.8em] w-[0.8em] shrink-0 rtl:rotate-180" aria-hidden="true" />\n                  </button>\n                </h2>''')
          replace_exact(shell, 'className="flex flex-wrap gap-x-5 gap-y-2 border-b border-border/70 py-3 text-sm"', 'className="flex flex-wrap gap-x-5 gap-y-2 border-b border-border/70 py-2.5 text-sm sm:py-3"')
          replace_exact(shell, 'data-aw10-previous-performance className="border-b border-border/70 py-4"', 'data-aw10-previous-performance className="border-b border-border/70 py-3 sm:py-4"')
          replace_exact(shell, '''            <section data-aw5-primary-editor className="py-5" aria-label={currentSetLabel}>\n              <div className="grid gap-4 sm:grid-cols-2">\n                <div className="space-y-1.5">\n                  <Label htmlFor="active-set-reps">{repsLabel}</Label>''', '''            <section data-aw5-primary-editor className="py-4 sm:py-5" aria-label={currentSetLabel}>\n              <div className="grid grid-cols-2 gap-3 sm:gap-4">\n                <div data-aw10-reps-field className="min-w-0 space-y-1.5">\n                  <Label htmlFor="active-set-reps" className="block break-words text-xs leading-tight sm:text-sm">{repsLabel}</Label>''')
          replace_exact(shell, '                    className="h-14 text-lg tabular-nums"', '                    className="h-14 text-center text-xl font-semibold tabular-nums"', 2)
          replace_exact(shell, '''                <div className="space-y-1.5">\n                  <Label htmlFor="active-set-weight">{weightLabel}</Label>''', '''                <div data-aw10-weight-field className="min-w-0 space-y-1.5">\n                  <Label htmlFor="active-set-weight" className="block break-words text-xs leading-tight sm:text-sm">{weightLabel}</Label>''')
          replace_exact(shell, '<p className="text-xs font-semibold text-muted-foreground">{setPathLabel}</p>', '<p data-aw10-sets-label className="text-xs font-semibold text-muted-foreground">{setPathLabel}</p>')

          core = 'components/workouts/active-workout/active-workout-core-session-implementation.tsx'
          replace_exact(core, '''  if (item.prescriptionItem.sourcePlanActivityId) {\n    return { kind: "plan_activity" as const, value: item.prescriptionItem.sourcePlanActivityId };\n  }\n  if (item.exercise.source_workout_id) {\n    return { kind: "source_workout" as const, value: item.exercise.source_workout_id };\n  }''', '''  if (item.exercise.source_workout_id) {\n    return { kind: "source_workout" as const, value: item.exercise.source_workout_id };\n  }\n  if (item.prescriptionItem.sourcePlanActivityId) {\n    return { kind: "plan_activity" as const, value: item.prescriptionItem.sourcePlanActivityId };\n  }''')
          replace_exact(core, '''  const [previousPerformanceRead, setPreviousPerformanceRead] = useState<Awaited<ReturnType<typeof readActiveWorkoutPreviousPerformanceClient>>>(null);\n  const [previousPerformanceLoading, setPreviousPerformanceLoading] = useState(false);\n  const [previousPerformanceUnavailable, setPreviousPerformanceUnavailable] = useState(false);''', '''  const [previousPerformanceRead, setPreviousPerformanceRead] = useState<Awaited<ReturnType<typeof readActiveWorkoutPreviousPerformanceClient>>>(null);\n  const [previousPerformanceResolvedKey, setPreviousPerformanceResolvedKey] = useState<string | null>(null);\n  const [previousPerformanceLoading, setPreviousPerformanceLoading] = useState(false);\n  const [previousPerformanceUnavailableKey, setPreviousPerformanceUnavailableKey] = useState<string | null>(null);''')
          replace_exact(core, '  const pendingSetCompletionPromiseRef = useRef<Promise<void> | null>(null);', '  const pendingSetCompletionPromiseRef = useRef<Promise<boolean> | null>(null);')
          replace_exact(core, '''  const executionCapability = useMemo(\n    () => resolveActiveWorkoutExecutionCapability(executionCursorItems),\n    [executionCursorItems]\n  );\n\n  useEffect(() => {\n    const identity = stablePreviousPerformanceIdentity(activeExercise);\n    if (!identity || !activeSet || !sessionId || !executionHydratedRef.current || !executionCapability.supported) {\n      setPreviousPerformanceRead(null);\n      setPreviousPerformanceLoading(false);\n      setPreviousPerformanceUnavailable(false);\n      return;\n    }\n    const controller = new AbortController();\n    setPreviousPerformanceLoading(true);\n    setPreviousPerformanceUnavailable(false);\n    void readActiveWorkoutPreviousPerformanceClient({\n      identity,\n      excludeSessionId: sessionId,\n      setNumber: activeSet.setNumber,\n      signal: controller.signal\n    }).then((value) => {\n      setPreviousPerformanceRead(value);\n      setPreviousPerformanceUnavailable(false);\n    }).catch((error) => {\n      if (error instanceof DOMException && error.name === "AbortError") return;\n      setPreviousPerformanceRead(null);\n      setPreviousPerformanceUnavailable(true);\n    }).finally(() => {\n      if (!controller.signal.aborted) setPreviousPerformanceLoading(false);\n    });\n    return () => controller.abort();\n  }, [activeExercise, activeSet, executionCapability.supported, sessionId]);''', '''  const executionCapability = useMemo(\n    () => resolveActiveWorkoutExecutionCapability(executionCursorItems),\n    [executionCursorItems]\n  );\n  const previousPerformanceIdentity = stablePreviousPerformanceIdentity(activeExercise);\n  const previousPerformanceIdentityKind = previousPerformanceIdentity?.kind ?? null;\n  const previousPerformanceIdentityValue = previousPerformanceIdentity?.value ?? null;\n  const previousPerformanceSetNumber = activeSet?.setNumber ?? null;\n  const previousPerformanceLookupKey = previousPerformanceIdentityKind && previousPerformanceIdentityValue && sessionId && previousPerformanceSetNumber\n    ? `${previousPerformanceIdentityKind}:${previousPerformanceIdentityValue}:${sessionId}:${previousPerformanceSetNumber}`\n    : null;\n  const previousPerformanceReadForCurrentKey = previousPerformanceResolvedKey === previousPerformanceLookupKey\n    ? previousPerformanceRead\n    : null;\n  const previousPerformanceUnavailable = previousPerformanceUnavailableKey === previousPerformanceLookupKey;\n\n  useEffect(() => {\n    if (\n      !previousPerformanceIdentityKind\n      || !previousPerformanceIdentityValue\n      || !previousPerformanceSetNumber\n      || !previousPerformanceLookupKey\n      || !sessionId\n      || !executionHydratedRef.current\n      || !executionCapability.supported\n    ) {\n      setPreviousPerformanceRead(null);\n      setPreviousPerformanceResolvedKey(null);\n      setPreviousPerformanceLoading(false);\n      setPreviousPerformanceUnavailableKey(null);\n      return;\n    }\n    const controller = new AbortController();\n    setPreviousPerformanceLoading(true);\n    setPreviousPerformanceUnavailableKey(null);\n    void readActiveWorkoutPreviousPerformanceClient({\n      identity: { kind: previousPerformanceIdentityKind, value: previousPerformanceIdentityValue },\n      excludeSessionId: sessionId,\n      setNumber: previousPerformanceSetNumber,\n      signal: controller.signal\n    }).then((value) => {\n      setPreviousPerformanceRead(value);\n      setPreviousPerformanceResolvedKey(previousPerformanceLookupKey);\n      setPreviousPerformanceUnavailableKey(null);\n    }).catch((error) => {\n      if (error instanceof DOMException && error.name === "AbortError") return;\n      setPreviousPerformanceRead(null);\n      setPreviousPerformanceResolvedKey(previousPerformanceLookupKey);\n      setPreviousPerformanceUnavailableKey(previousPerformanceLookupKey);\n    }).finally(() => {\n      if (!controller.signal.aborted) setPreviousPerformanceLoading(false);\n    });\n    return () => controller.abort();\n  }, [\n    executionCapability.supported,\n    previousPerformanceIdentityKind,\n    previousPerformanceIdentityValue,\n    previousPerformanceLookupKey,\n    previousPerformanceSetNumber,\n    sessionId\n  ]);''')
          replace_exact(core, '''  const activePreviousPerformance: ActiveWorkoutPreviousPerformance | null = previousPerformanceRead ? {\n    lastWeightKg: previousPerformanceRead.weightKg,\n    lastReps: previousPerformanceRead.reps,\n    lastBestSet: [\n      previousPerformanceRead.weightKg === null ? null : formatters.measurement(previousPerformanceRead.weightKg, "kg"),\n      previousPerformanceRead.reps === null ? null : `${formatters.integer(previousPerformanceRead.reps)} ${tr("units.reps")}`\n    ].filter((value): value is string => Boolean(value)).join(" × ") || null,\n    lastPerformedAt: previousPerformanceRead.performedAt\n  } : null;''', '''  const activePreviousPerformance: ActiveWorkoutPreviousPerformance | null = previousPerformanceReadForCurrentKey ? {\n    lastWeightKg: previousPerformanceReadForCurrentKey.weightKg,\n    lastReps: previousPerformanceReadForCurrentKey.reps,\n    lastBestSet: [\n      previousPerformanceReadForCurrentKey.weightKg === null ? null : formatters.measurement(previousPerformanceReadForCurrentKey.weightKg, "kg"),\n      previousPerformanceReadForCurrentKey.reps === null ? null : `${formatters.integer(previousPerformanceReadForCurrentKey.reps)} ${tr("units.reps")}`\n    ].filter((value): value is string => Boolean(value)).join(" × ") || null,\n    lastPerformedAt: previousPerformanceReadForCurrentKey.performedAt\n  } : null;''')
          replace_exact(core, '    previous_performance: previousPerformanceRead,', '    previous_performance: previousPerformanceReadForCurrentKey,')
          replace_exact(core, '    if (!item || !targetSet || exerciseIndex !== activeExerciseIndex || setIndex !== activeSetIndex || !previousPerformanceRead) {', '    if (!item || !targetSet || exerciseIndex !== activeExerciseIndex || setIndex !== activeSetIndex || !previousPerformanceReadForCurrentKey) {')
          replace_exact(core, '''      reps: previousPerformanceRead.reps === null ? targetSet.reps : String(previousPerformanceRead.reps),\n      weightKg: previousPerformanceRead.weightKg === null ? targetSet.weightKg : String(previousPerformanceRead.weightKg)''', '''      reps: previousPerformanceReadForCurrentKey.reps === null ? targetSet.reps : String(previousPerformanceReadForCurrentKey.reps),\n      weightKg: previousPerformanceReadForCurrentKey.weightKg === null ? targetSet.weightKg : String(previousPerformanceReadForCurrentKey.weightKg)''')
          replace_exact(core, '  function startRestTimer(seconds: number) {', '''  function queueAfterPendingSetCompletion(action: () => void) {\n    const pendingCompletion = pendingSetCompletionPromiseRef.current;\n    if (!pendingCompletion) {\n      action();\n      return;\n    }\n    void pendingCompletion.then((acknowledged) => {\n      if (acknowledged) action();\n    });\n  }\n\n  function startRestTimer(seconds: number) {''')
          replace_exact(core, '''    if (userId && sessionId && executionHydratedRef.current) {\n      void dispatchExecutionBackground(\n        "start_rest",\n        { duration_seconds: safeSeconds, controller_device_id: controllerDeviceIdRef.current },\n        { rollback: () => restoreRestTimer(previous) }\n      );\n    }\n  }\n\n  function stopRestTimer() {''', '''    if (userId && sessionId && executionHydratedRef.current) {\n      queueAfterPendingSetCompletion(() => {\n        void dispatchExecutionBackground(\n          "start_rest",\n          { duration_seconds: safeSeconds, controller_device_id: controllerDeviceIdRef.current },\n          { rollback: () => restoreRestTimer(previous) }\n        );\n      });\n    }\n  }\n\n  function stopRestTimer() {''')
          replace_exact(core, '''    if (userId && sessionId && executionHydratedRef.current) {\n      void dispatchExecutionBackground(\n        "clear_rest",\n        {\n          view_state: "set_entry",\n          completion_reason: "user_skipped",\n          controller_device_id: controllerDeviceIdRef.current\n        },\n        { rollback: () => restoreRestTimer(previous) }\n      );\n    }\n  }''', '''    if (userId && sessionId && executionHydratedRef.current) {\n      queueAfterPendingSetCompletion(() => {\n        void dispatchExecutionBackground(\n          "clear_rest",\n          {\n            view_state: "set_entry",\n            completion_reason: "user_skipped",\n            controller_device_id: controllerDeviceIdRef.current\n          },\n          { rollback: () => restoreRestTimer(previous) }\n        );\n      });\n    }\n  }''')
          replace_exact(core, '    const operation = (async () => {', '    const operation = (async (): Promise<boolean> => {')
          p = Path(core)
          text = p.read_text()
          op_start = text.index('    const operation = (async (): Promise<boolean> => {')
          success_marker = '        bumpMuscleLoadRefreshRevision();\n      } catch (error) {'
          success_pos = text.index(success_marker, op_start)
          text = text[:success_pos] + success_marker.replace('\n      } catch', '\n        return true;\n      } catch') + text[success_pos + len(success_marker):]
          failure_marker = '          feedbackError();\n        }\n      } finally {'
          failure_pos = text.index(failure_marker, op_start)
          text = text[:failure_pos] + failure_marker.replace('\n      } finally', '\n        return false;\n      } finally') + text[failure_pos + len(failure_marker):]
          p.write_text(text)
          replace_exact(core, '''  const primaryActionDisabled = Boolean(\n    completedSummary || isSaving || isStarting || !tabLeader || controllerConflictDeviceId !== null || !sessionId\n    || (!isPaused && !restActive && !isFinished && Boolean(activeSet.completedAt))\n  );''', '''  const optimisticRestInteraction = Boolean(restActive && optimisticCompletion && isSaving);\n  const primaryActionDisabled = Boolean(\n    completedSummary || (isSaving && !optimisticRestInteraction) || isStarting || !tabLeader || controllerConflictDeviceId !== null || !sessionId\n    || (!isPaused && !restActive && !isFinished && Boolean(activeSet.completedAt))\n  );\n  const restControlsDisabled = Boolean(\n    isStarting || !tabLeader || controllerConflictDeviceId !== null || !sessionId || (isSaving && !optimisticCompletion)\n  );''')
          replace_exact(core, '        restActive={restActive}\n        restLabel={formatters.timer(timerLeft)}', '        restActive={restActive}\n        restControlsDisabled={restControlsDisabled}\n        restLabel={formatters.timer(timerLeft)}')
          replace_exact(core, '        setPathLabel={tr("set.path")}', '        setPathLabel={tr("set.labelPlural")}')
          replace_exact(core, '        restPresetSectionLabel={tr("actions.timerControls")}', '        restPresetSectionLabel={tr("rest.label")}')
          replace_exact(core, '        previousPerformanceLoading={previousPerformanceLoading}', '        previousPerformanceLoading={previousPerformanceLoading && previousPerformanceResolvedKey !== previousPerformanceLookupKey}')
          replace_exact(core, '        onUsePrevious={previousPerformanceRead ? () => applyPreviousSet(activeExerciseIndex, activeSetIndex) : undefined}', '        onUsePrevious={previousPerformanceReadForCurrentKey ? () => applyPreviousSet(activeExerciseIndex, activeSetIndex) : undefined}')

          details = 'components/workouts/active-workout/active-workout-details-bridge.tsx'
          replace_exact(details, '  const adjustTodayRef = useRef<HTMLHeadingElement>(null);', '  const adjustTodayRef = useRef<HTMLElement>(null);')
          replace_exact(details, '''      : effectiveSection === "adjust-today"\n        ? tr("details.adjustToday")\n        : tr("chatGPT.ask");\n  const dialogDescription = effectiveSection === "current-set"\n    ? tr("set.label", { count: formatters.integer(activeSet.setNumber) })\n    : dialogTitle;''', '''      : effectiveSection === "adjust-today"\n        ? tr("actions.replaceToday")\n        : tr("chatGPT.ask");\n  const dialogDescription = effectiveSection === "current-set"\n    ? tr("set.label", { count: formatters.integer(activeSet.setNumber) })\n    : effectiveSection === "adjust-today"\n      ? tr("actions.replaceTodayDescription")\n      : dialogTitle;''')
          replace_exact(details, '''      const sectionRefs: Record<ActiveWorkoutDetailsSection, RefObject<HTMLHeadingElement | null>> = {\n        "current-set": currentSetRef,\n        "muscle-load": muscleLoadRef,\n        "adjust-today": adjustTodayRef,\n        assistance: assistanceRef\n      };\n      const requested = sectionRefs[effectiveSection].current;''', '''      const requested = effectiveSection === "current-set"\n        ? currentSetRef.current\n        : effectiveSection === "muscle-load"\n          ? muscleLoadRef.current\n          : effectiveSection === "adjust-today"\n            ? adjustTodayRef.current\n            : assistanceRef.current;''')
          replace_exact(details, '''                <section\n                  data-aw6-details-adjust-today\n                hidden={effectiveSection !== "adjust-today"}\n                  aria-labelledby="aw6-details-adjust-today-title"\n                  className="scroll-mt-4 py-5"\n                >\n                  <h3\n                    id="aw6-details-adjust-today-title"\n                    ref={adjustTodayRef}\n                    tabIndex={-1}\n                    className="text-base font-semibold outline-none focus-visible:ring-2 focus-visible:ring-ring"\n                  >\n                    {tr("details.adjustToday")}\n                  </h3>\n                  <p className="mt-2 text-sm text-muted-foreground">\n                    {tr("actions.replaceTodayDescription")}\n                  </p>''', '''                <section\n                  ref={adjustTodayRef}\n                  tabIndex={-1}\n                  data-aw6-details-adjust-today\n                  hidden={effectiveSection !== "adjust-today"}\n                  aria-label={tr("actions.replaceToday")}\n                  className="scroll-mt-4 py-5 outline-none focus-visible:ring-2 focus-visible:ring-ring"\n                >''')

          replace_exact('messages/en.json', '      "resting": "Resting",', '      "resting": "Resting",\n      "label": "Rest",')
          replace_exact('messages/de.json', '      "resting": "Pause",', '      "resting": "Pause",\n      "label": "Pause",')
          replace_exact('messages/ar.json', '      "resting": "وقت الراحة",', '      "resting": "وقت الراحة",\n      "label": "راحة",')

          test_path = Path('lib/product/active-workout-pr144-correction-authority.test.ts')
          if test_path.exists():
              raise SystemExit(f'{test_path} already exists')
          test_path.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nconst shell = readFileSync("components/workouts/active-workout/active-workout-execution-shell.tsx", "utf8");\nconst core = readFileSync("components/workouts/active-workout/active-workout-core-session-implementation.tsx", "utf8");\nconst details = readFileSync("components/workouts/active-workout/active-workout-details-bridge.tsx", "utf8");\nconst en = JSON.parse(readFileSync("messages/en.json", "utf8"));\nconst de = JSON.parse(readFileSync("messages/de.json", "utf8"));\nconst ar = JSON.parse(readFileSync("messages/ar.json", "utf8"));\n\ndescribe("PR #144 focused correction authority", () => {\n  it("keeps execution inputs together and bounds compact exercise titles", () => {\n    expect(shell).toContain('grid grid-cols-2 gap-3 sm:gap-4');\n    expect(shell.match(/text-center text-xl font-semibold tabular-nums/g)).toHaveLength(2);\n    expect(shell).toContain('line-clamp-2 min-w-0 break-words lg:line-clamp-none');\n    expect(shell).toContain('aria-label={exerciseName}');\n    expect(shell).toContain('data-aw10-reps-field');\n    expect(shell).toContain('data-aw10-weight-field');\n  });\n\n  it("keys Previous Performance only from stable semantic primitives", () => {\n    expect(core.indexOf('if (item.exercise.source_workout_id)')).toBeLessThan(core.indexOf('if (item.prescriptionItem.sourcePlanActivityId)'));\n    expect(core).toContain('const previousPerformanceLookupKey =');\n    expect(core).toContain('previousPerformanceIdentityKind,');\n    expect(core).toContain('previousPerformanceIdentityValue,');\n    expect(core).toContain('previousPerformanceSetNumber,');\n    expect(core).not.toContain('}, [activeExercise, activeSet, executionCapability.supported, sessionId]);');\n    expect(core).toContain('previousPerformanceReadForCurrentKey');\n    expect(core).toContain('previousPerformanceResolvedKey !== previousPerformanceLookupKey');\n  });\n\n  it("queues safe Rest follow-ups behind pending set acknowledgement without opening navigation", () => {\n    expect(core).toContain('pendingSetCompletionPromiseRef = useRef<Promise<boolean> | null>(null)');\n    expect(core).toContain('function queueAfterPendingSetCompletion(action: () => void)');\n    expect(core).toContain('if (acknowledged) action();');\n    expect(core).toContain('const optimisticRestInteraction = Boolean(restActive && optimisticCompletion && isSaving)');\n    expect(core).toContain('const restControlsDisabled = Boolean(');\n    expect(core).toContain('isSaving || isStarting || !sessionId || !userId || !executionHydratedRef.current');\n    expect(shell).toContain('disabled={restControlsDisabled}');\n  });\n\n  it("uses one replacement hierarchy and member-facing localized Rest/Sets language", () => {\n    expect(details).toContain('? tr("actions.replaceToday")');\n    expect(details).toContain('? tr("actions.replaceTodayDescription")');\n    expect(details).not.toContain('{tr("details.adjustToday")}');\n    expect(core).toContain('setPathLabel={tr("set.labelPlural")}');\n    expect(core).toContain('restPresetSectionLabel={tr("rest.label")}');\n    expect(en.activeWorkout.rest.label).toBe("Rest");\n    expect(de.activeWorkout.rest.label).toBe("Pause");\n    expect(ar.activeWorkout.rest.label).toBe("راحة");\n    expect(en.activeWorkout.set.labelPlural).toBe("Sets");\n    expect(de.activeWorkout.set.labelPlural).toBe("Sätze");\n    expect(ar.activeWorkout.set.labelPlural).toBe("المجموعات");\n  });\n\n  it("completes the declared ARIA menu keyboard model and skips disabled items", () => {\n    for (const key of ["ArrowDown", "ArrowUp", "Home", "End", "Escape"]) expect(shell).toContain(key);\n    expect(shell).toContain("filter((item) => !item.disabled)");\n    expect(shell).toContain("enabledItems[nextIndex]?.focus()");\n    expect(shell).toContain('role="menu"');\n    expect(shell).toContain('role="menuitem"');\n  });\n});\n''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Focused correction contracts
        run: npx vitest run lib/product/active-workout-pr144-correction-authority.test.ts lib/product/active-workout-aw10-closure.test.ts
      - name: Typecheck bounded implementation
        run: npm run typecheck
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit clean correction implementation
        shell: bash
        run: |
          rm .github/workflows/pr144-correction-authority-apply-v2.yml
