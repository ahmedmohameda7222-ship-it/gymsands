name: P8A Notes Pagination Correction

on:
  push:
    branches:
      - feat/p8a-single-workout-pdf-report
    paths:
      - .github/workflows/p8a-pagination-correction.yml

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/p8a-single-workout-pdf-report

      - name: Apply exact notes-block preflight and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          render = Path("lib/reports/workout/render.ts")
          text = render.read_text(encoding="utf-8")
          old = '''    if (model.notes) {
              composer.sectionHeading(copy.notes, 44);
              composer.drawText(model.notes, { size: 9, lineHeight: 13.5 });
            }
          '''
          new = '''    if (model.notes) {
              const noteStyle = { size: 9, lineHeight: 13.5 } as const;
              const noteHeight = composer.wrappedHeight(
                model.notes,
                PDF_LAYOUT.contentWidth,
                noteStyle,
              );
              composer.sectionHeading(copy.notes, noteHeight + 22);
              composer.drawText(model.notes, noteStyle);
            }
          '''
          if text.count(old) != 1:
              raise SystemExit("Unexpected notes rendering authority")
          render.write_text(text.replace(old, new), encoding="utf-8")

          render_test = Path("lib/reports/workout/render.test.ts")
          test_text = render_test.read_text(encoding="utf-8")
          anchor = '''      expect(result.pageCount).toBeGreaterThan(0);
              expect(result.pageCount).toBeLessThanOrEqual(40);
          '''
          replacement = '''      expect(result.pageCount).toBeGreaterThan(0);
              if (language === "en") expect(result.pageCount).toBe(1);
              expect(result.pageCount).toBeLessThanOrEqual(40);
          '''
          if test_text.count(anchor) != 1:
              raise SystemExit("Unexpected core page-count assertion authority")
          render_test.write_text(test_text.replace(anchor, replacement), encoding="utf-8")

          evidence_test = Path("lib/reports/workout/render-evidence.test.ts")
          evidence = evidence_test.read_text(encoding="utf-8")
          old_assertion = '''    expect(loaded.getPageCount()).toBeGreaterThan(0);
              if (testCase.language !== "en") {
                expect(loaded.getPageCount()).toBeGreaterThan(1);
              }
          '''
          new_assertion = '''    expect(loaded.getPageCount()).toBeGreaterThan(0);
              if (testCase.language === "en") {
                expect(loaded.getPageCount()).toBe(1);
              } else {
                expect(loaded.getPageCount()).toBeGreaterThan(1);
              }
          '''
          if evidence.count(old_assertion) != 1:
              raise SystemExit("Unexpected evidence page-count assertion authority")
          evidence_test.write_text(
              evidence.replace(old_assertion, new_assertion),
              encoding="utf-8",
          )
          PY
          git diff --check -- \
            lib/reports/workout/render.ts \
            lib/reports/workout/render.test.ts \
            lib/reports/workout/render-evidence.test.ts

      - name: Set up repository Node authority
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install unchanged repository lock
        run: npm ci

      - name: Run exact focused and type contracts
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run --config vitest.unit.config.mjs \
            lib/reports/workout/render.test.ts \
            lib/reports/workout/model.test.ts \
            lib/reports/pdf/text-direction.test.ts \
            lib/reports/pdf/fonts.test.ts
          npm run typecheck

      - name: Generate and rasterize corrected multilingual evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=/tmp/p8a-pagination-evidence
          mkdir -p "$evidence"
          P8A_PDF_EVIDENCE_DIR="$evidence" \
            npx vitest run --config vitest.unit.config.mjs \
              lib/reports/workout/render-evidence.test.ts
          command -v pdftoppm >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          }
          for pdf in "$evidence"/*.pdf; do
            pdftoppm -png -r 150 "$pdf" "${pdf%.pdf}"
          done
          test "$(find "$evidence" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          test "$(find "$evidence" -maxdepth 1 -name '*.png' | wc -l)" -ge 3

      - name: Commit and push only corrected implementation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plaivra Implementation Authority"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            lib/reports/workout/render.ts \
            lib/reports/workout/render.test.ts \
            lib/reports/workout/render-evidence.test.ts
          test -z "$(git diff --cached --name-only -- '.github/workflows/**')"
          git diff --cached --check
          git commit -m "fix(reports): avoid orphan workout notes pages"
          git push origin HEAD:feat/p8a-single-workout-pdf-report

      - name: Upload corrected PDF evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8a-corrected-pagination-evidence-${{ github.run_id }}
          path: /tmp/p8a-pagination-evidence
          if-no-files-found: error
          retention-days: 14
