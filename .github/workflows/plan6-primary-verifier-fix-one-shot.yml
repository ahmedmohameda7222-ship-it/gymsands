name: Plan 6 Primary Verifier Lease Fix One Shot

on:
  push:
    branches:
      - feat/food-catalog-governance-plan6

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Align primary verifier with lease-token outbox contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/verification/food-catalog-governance-control-plane.sql')
          s=p.read_text()
          old="""select public.food_catalog_claim_governance_outbox('66000000-0000-4000-8000-000000000422');
select public.food_catalog_finish_governance_outbox('66000000-0000-4000-8000-000000000422',false,'fixture failure');
select public.food_catalog_claim_governance_outbox('66000000-0000-4000-8000-000000000422');
select public.food_catalog_finish_governance_outbox('66000000-0000-4000-8000-000000000422',true,null);"""
          new="""select (public.food_catalog_claim_governance_outbox('66000000-0000-4000-8000-000000000422','governance-worker',300))->>'leaseToken' as primary_retry_lease_a \\gset
select public.food_catalog_finish_governance_outbox('66000000-0000-4000-8000-000000000422',:'primary_retry_lease_a',false,'fixture failure',0);
select (public.food_catalog_claim_governance_outbox('66000000-0000-4000-8000-000000000422','governance-worker',300))->>'leaseToken' as primary_retry_lease_b \\gset
select public.food_catalog_finish_governance_outbox('66000000-0000-4000-8000-000000000422',:'primary_retry_lease_b',true,null,0);"""
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old outbox verifier block, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit verifier correction and retire one-shot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/plan6-primary-verifier-fix-one-shot.yml
          git add supabase/verification/food-catalog-governance-control-plane.sql
          git commit -m "test(plan6): exercise leased outbox finish in primary verifier"
          git push origin HEAD:feat/food-catalog-governance-plan6
