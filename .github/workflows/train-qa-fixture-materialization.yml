name: Train QA Fixture Materialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: train-qa-fixture-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw3b-structured-set-details'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Materialize deterministic muscle-analysis fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-train-layout-qa.mjs')
          source = path.read_text()
          needle = '  await context.addCookies([{ name: "plaivra.language.v1", value: language, url: baseUrl, sameSite: "Lax" }]);\n'
          fixture = '''  await context.route(/\\/api\\/workouts\\/sessions\\/[^/]+\\/muscle-analysis(?:\\?.*)?$/, async (requestRoute) => {
            await requestRoute.fulfill({
              status: 200,
              contentType: "application/json",
              headers: { "cache-control": "private, no-store", "x-plaivra-qa-fixture": "session-muscle-analysis" },
              body: JSON.stringify({
                sessionId: "20000000-0000-4000-8000-000000000001",
                snapshotId: "60000000-0000-4000-8000-000000000001",
                snapshotSchemaVersion: "workout_session_muscle_snapshot_v1",
                frozenAt: "2026-07-22T08:00:00.000Z",
                source: "session_start",
                snapshotCompleteness: "complete",
                reasonCodes: [],
                effectiveCompleteness: "complete",
                effectiveWarnings: [],
                analysis: {
                  schemaVersion: "muscle_analysis_result_v1",
                  taxonomyVersion: "muscle_taxonomy_v1",
                  engineVersion: "muscle_load_resistance_sets_v1",
                  thresholdVersion: "muscle_load_thresholds_v1",
                  mode: "planned",
                  period: { kind: "session" },
                  completeness: "complete",
                  muscles: [],
                  contributionBreakdown: [],
                  mappingVersionsUsed: [],
                  coverage: { totalItemCount: 1, includedItemCount: 1, unmappedItemCount: 0, unsupportedItemCount: 0 },
                  warnings: []
                }
              })
            });
          });
'''
          if source.count(needle) != 1:
              raise SystemExit('Expected one language-cookie insertion point.')
          if 'x-plaivra-qa-fixture": "session-muscle-analysis' in source:
              raise SystemExit('Fixture is already materialized.')
          path.write_text(source.replace(needle, needle + fixture, 1))
          PY
          node --check scripts/run-train-layout-qa.mjs

      - name: Create exact source blob
        shell: bash
        run: |
          set -euo pipefail
          base64 -w0 scripts/run-train-layout-qa.mjs > /tmp/source.b64
          jq -n --rawfile content /tmp/source.b64 '{content:$content,encoding:"base64"}' > /tmp/blob-request.json
          sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob-request.json --jq .sha)"
          printf 'scripts/run-train-layout-qa.mjs=%s\n' "$sha" | tee /tmp/blobs.txt

      - name: Upload materialized source evidence
        uses: actions/upload-artifact@v4
        with:
          name: train-qa-fixture-${{ github.event.pull_request.head.sha }}
          path: |
            scripts/run-train-layout-qa.mjs
            /tmp/blobs.txt
          if-no-files-found: error
          retention-days: 1
