name: Ops PR97 Exact Release Monitor

on:
  push:
    branches:
      - ops/pr97-exact-release-0e9e08ac

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ops-pr97-exact-release-monitor
  cancel-in-progress: false

jobs:
  recover-monitor-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    env:
      GH_TOKEN: ${{ github.token }}
      OPS_BRANCH: ops/pr97-exact-release-0e9e08ac
      TARGET_BRANCH: feat/workout-history-program
      REVIEWED_COMMIT: 0e9e08ac2a5fda053612035762613ef94128e815
      COMPARISON_BASE: edf06318994121928dc1d1aaa70e51214525926f
      QUALITY_RUN_ID: "30726502954"
      PR_NUMBER: "97"
      EARLIEST_RUN: "2026-08-02T10:20:00Z"
    steps:
      - name: Verify target and announce monitor
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$OPS_BRANCH"
          target_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq .object.sha)"
          test "$target_sha" = "$REVIEWED_COMMIT"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "OPS_EXACT_RELEASE_MONITOR_STARTED

- reviewed_commit: \`$REVIEWED_COMMIT\`
- quality_run_id: \`$QUALITY_RUN_ID\`"

      - name: Find or dispatch Exact Release
        id: exact
        shell: bash
        run: |
          set -euo pipefail

          find_candidate() {
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow exact-release-quality-validation.yml \
              --branch "$TARGET_BRANCH" \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId,headSha,status,conclusion,url,createdAt \
              | jq -c --arg sha "$REVIEWED_COMMIT" --arg earliest "$EARLIEST_RUN" \
                '[.[] | select(.headSha == $sha and .createdAt >= $earliest)] | sort_by(.createdAt) | last // empty'
          }

          candidate=""
          for attempt in $(seq 1 15); do
            candidate="$(find_candidate)"
            [[ -n "$candidate" ]] && break
            sleep 2
          done

          if [[ -z "$candidate" ]]; then
            jq -n \
              --arg ref "$TARGET_BRANCH" \
              --arg reviewed_commit "$REVIEWED_COMMIT" \
              --arg comparison_base "$COMPARISON_BASE" \
              --arg quality_run_id "$QUALITY_RUN_ID" \
              '{ref:$ref,inputs:{reviewed_commit:$reviewed_commit,comparison_base:$comparison_base,quality_run_id:$quality_run_id}}' \
              | gh api --method POST \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/exact-release-quality-validation.yml/dispatches" \
                  --input -

            for attempt in $(seq 1 90); do
              candidate="$(find_candidate)"
              [[ -n "$candidate" ]] && break
              sleep 2
            done
          fi

          test -n "$candidate"
          run_id="$(jq -r .databaseId <<<"$candidate")"
          run_url="$(jq -r .url <<<"$candidate")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Wait and record Exact Release result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ steps.exact.outputs.run_id }}"
          run_url="${{ steps.exact.outputs.run_url }}"

          set +e
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          watch_status=$?
          set -e

          conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "OPS_EXACT_RELEASE_RESULT

- reviewed_commit: \`$REVIEWED_COMMIT\`
- quality_run_id: \`$QUALITY_RUN_ID\`
- exact_release_run_id: \`$run_id\`
- conclusion: \`$conclusion\`
- run: $run_url"

          test "$watch_status" -eq 0
          test "$conclusion" = "success"

      - name: Delete temporary operations branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$OPS_BRANCH"
