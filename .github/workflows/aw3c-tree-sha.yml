name: AW-3C Tree Identity

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw3c-prescription-snapshots
          fetch-depth: 1
      - name: Persist tree identity
        run: |
          set -euo pipefail
          git rev-parse 'HEAD^{tree}' > aw3c-tree-sha.txt
          git add aw3c-tree-sha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(aw3c): record tree identity'
          git push origin HEAD:feat/active-workout-aw3c-prescription-snapshots
