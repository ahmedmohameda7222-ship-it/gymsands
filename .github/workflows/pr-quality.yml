name: AW-10 final sync materializer
run-name: AW-10 final sync materializer / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw10-final-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-final-sync:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw8-aw9-aw10-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw8-aw9-aw10-closure
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and validate final AW-10 sync corrections
        run: |
          set -euo pipefail
          node .github/aw10-final-sync-fix.cjs
          git rm -f .github/aw10-final-sync-fix.cjs
          git diff --check
          node --check scripts/run-aw10-active-workout-closure-qa.mjs
          npm ci
          npm run typecheck
          npx vitest run --config vitest.unit.config.mjs \
            lib/workouts/active-session-store/store.test.ts \
            lib/workouts/active-session-sync/fallback-lease.test.ts \
            lib/workouts/active-session-sync/leadership.test.ts \
            lib/product/active-workout-aw9-offline-contract.test.ts \
            components/workouts/active-workout/active-workout-runtime-model.test.ts
      - name: Commit validated final AW-10 sync corrections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(active-workout): complete durable reconnect lane"
          git push origin HEAD:feat/active-workout-aw8-aw9-aw10-closure
