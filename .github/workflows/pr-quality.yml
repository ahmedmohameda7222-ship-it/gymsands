name: AW-10 closure materializer
run-name: AW-10 closure materializer / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw10-closure-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-aw10-closure:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw8-aw9-aw10-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw8-aw9-aw10-closure
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and validate canonical AW-10 closure
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/pr-quality.yml > .github/workflows/pr-quality.yml
          node .github/aw10-closure-materialize.cjs
          git rm .github/aw10-closure-materialize.cjs
          git diff --check
          node --check scripts/run-aw10-active-workout-closure-qa.mjs
          npm ci
          npm run typecheck
          npm run test:active-workout:aw8-aw10
      - name: Commit clean AW-10 closure state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test(active-workout): integrate canonical AW-10 closure QA"
          git push origin HEAD:feat/active-workout-aw8-aw9-aw10-closure
