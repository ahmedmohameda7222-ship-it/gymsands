name: PR Quality
run-name: AW-8/AW-9 materializer / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-aw89:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw8-aw9-aw10-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw8-aw9-aw10-closure
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply and validate long-term closure corrections
        run: |
          set -euo pipefail
          test -f .github/aw89-materialize.cjs
          node .github/aw89-materialize.cjs

          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-quality.yml
          git rm .github/workflows/aw89-materialize.yml
          git rm .github/aw89-materialize.cjs
          git diff --check

          npm ci
          npm run test:active-workout:aw8-aw10
          npm run migration:ledger:check

      - name: Commit clean final branch state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(active-workout): close AW-8 and AW-9 reliability contracts"
          git push origin HEAD:feat/active-workout-aw8-aw9-aw10-closure
