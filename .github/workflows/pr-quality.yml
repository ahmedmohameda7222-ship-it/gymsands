name: AW-10 queue drain materializer
run-name: AW-10 queue drain materializer / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw10-queue-drain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-queue-drain:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw8-aw9-aw10-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw8-aw9-aw10-closure
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and validate queue drain correction
        run: |
          set -euo pipefail
          node .github/aw10-queue-drain-fix.cjs
          git rm -f .github/aw10-queue-drain-fix.cjs
          git diff --check
          npm ci
          npm run typecheck
          npx vitest run --config vitest.unit.config.mjs \
            lib/product/active-workout-aw10-closure.test.ts \
            lib/workouts/active-session-store/store.test.ts \
            lib/workouts/active-session-sync/leadership.test.ts
      - name: Commit validated queue drain correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/workouts/active-session-sync/coordinator.ts \
            lib/product/active-workout-aw10-closure.test.ts \
            .github/aw10-queue-drain-fix.cjs
          git commit -m "fix(active-workout): drain durable sync queue deterministically"
          git push origin HEAD:feat/active-workout-aw8-aw9-aw10-closure
