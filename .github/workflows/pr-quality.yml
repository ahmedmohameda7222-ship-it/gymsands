name: PR Quality
run-name: PR Quality / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_USE_MOCK_AUTH: "true"
  PLAIVRA_MCP_BASE_URL: http://localhost:3000/api/mcp
  PLAIVRA_MCP_TOKEN_SECRET: ci-placeholder-token-secret-that-is-long-enough
  PLAIVRA_CHATGPT_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
  PLAIVRA_CIMD_ALLOWED_ORIGINS: https://chatgpt.com
  PLAIVRA_RELEASE_ENVIRONMENT: ci
  PLAIVRA_SCHEMA_COMPATIBILITY_VERSION: "2"
  PLAIVRA_ACTIVITY_CATALOG_MODE: library_v2_with_legacy_fallback
  PLAIVRA_ACTIVITY_CATALOG_BASE_URL: https://plaivra-activity-catalog-api.vercel.app
  PLAIVRA_ACTIVITY_CATALOG_API_KEY: ci-placeholder-catalog-key-long-enough
  PLAIVRA_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  classify:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      core: ${{ steps.scope.outputs.core }}
      database: ${{ steps.scope.outputs.database }}
      ui: ${{ steps.scope.outputs.ui }}
      ci: ${{ steps.scope.outputs.ci }}
      build: ${{ steps.scope.outputs.build }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      fallback: ${{ steps.scope.outputs.fallback }}
      rendered_general: ${{ steps.scope.outputs.rendered_general }}
      rendered_train: ${{ steps.scope.outputs.rendered_train }}
      rendered_active_workout: ${{ steps.scope.outputs.rendered_active_workout }}
      rendered_workout_history: ${{ steps.scope.outputs.rendered_workout_history }}
      changed_count: ${{ steps.scope.outputs.changed_count }}
      scope_summary: ${{ steps.scope.outputs.scope_summary }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Classify changed paths conservatively
        id: scope
        env:
          PLAIVRA_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLAIVRA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-change-scope.mjs

  integrity:
    name: integrity
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact identity and clean diff
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse "$EXPECTED_BASE^{commit}")" = "$EXPECTED_BASE"
          git diff --check "$EXPECTED_BASE...$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"

  core:
    name: core
    needs: classify
    if: needs.classify.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: node scripts/run-ci-check.mjs --name lint -- npm run lint
      - name: Typecheck
        run: node scripts/run-ci-check.mjs --name typecheck -- npm run typecheck
      - name: Unit tests
        run: |
          set -euo pipefail
          heavy_test="components/workouts/active-workout/active-workout-core-session.identity.test.tsx"
          node scripts/run-ci-check.mjs --name unit-active-workout-core-identity -- \
            ./node_modules/.bin/vitest run --config vitest.unit.config.mjs \
            --pool=threads --maxWorkers=1 "$heavy_test"
          for shard in $(seq 1 32); do
            node scripts/run-ci-check.mjs --name "unit-${shard}-of-32" -- \
              ./node_modules/.bin/vitest run --config vitest.unit.config.mjs \
              --exclude "$heavy_test" --shard="${shard}/32"
          done
      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-core-failure-${{ github.run_id }}
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 7

  database:
    name: database
    needs: classify
    if: needs.classify.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}
      - name: Chronological migration replay
        run: >-
          node scripts/run-ci-check.mjs --name migration-replay --
          node scripts/replay-local-migration-chain.mjs
          --log ci-reports/database-validation.log --prove-future-order
      - name: Database lint
        run: >-
          node scripts/run-ci-check.mjs --name database-lint --
          supabase db lint --local --schema public --level error --fail-on error
      - name: Database verification SQL
        run: node scripts/run-ci-check.mjs --name database-verification -- node scripts/run-database-verification.mjs
      - name: Migration ledger
        run: node scripts/run-ci-check.mjs --name migration-ledger -- npm run migration:ledger:check
      - name: Database integration tests
        env:
          PLAIVRA_AW2A_TEST_DATABASE_URL: ${{ env.PLAIVRA_LOCAL_DATABASE_URL }}
        run: node scripts/run-ci-check.mjs --name integration -- npm run test:integration
      - name: Workout History integration tests
        env:
          PLAIVRA_AW2A_TEST_DATABASE_URL: ${{ env.PLAIVRA_LOCAL_DATABASE_URL }}
        run: node scripts/run-ci-check.mjs --name workout-history-integration -- npm run test:workout-history:integration
      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-database-failure-${{ github.run_id }}
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: ui-and-i18n
    needs: classify
    if: >-
      needs.classify.outputs.rendered_general == 'true' ||
      needs.classify.outputs.rendered_train == 'true' ||
      needs.classify.outputs.rendered_active_workout == 'true' ||
      needs.classify.outputs.rendered_workout_history == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QA_SERVER_MODE: production
      QA_MOCK_AUTH_BUILD_VALUE: "true"
      QA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      QA_WORKFLOW_RUN_ID: ${{ github.run_id }}
      QA_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create rendered QA report directory
        run: mkdir -p ci-reports
      - name: Build mock-auth QA application
        run: NEXT_PUBLIC_USE_MOCK_AUTH=true NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA=true npm run build
      - name: Start production QA server
        run: |
          NEXT_PUBLIC_USE_MOCK_AUTH=true npm run start > ci-reports/qa-server.log 2>&1 &
          echo "$!" > /tmp/pr-quality-qa-server.pid
      - name: Wait for production QA server
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ci-reports/qa-server.log
          exit 1
      - name: General rendered QA
        if: needs.classify.outputs.rendered_general == 'true'
        env:
          QA_EVIDENCE_DIR: ci-reports/rendered-qa-evidence
        run: node scripts/run-ci-check.mjs --name rendered-qa -- npm run qa:rendered
      - name: Train rendered QA
        if: >-
          needs.classify.outputs.rendered_general == 'true' ||
          needs.classify.outputs.rendered_train == 'true'
        env:
          QA_TRAIN_EVIDENCE_DIR: ci-reports/train-qa-evidence
        run: node scripts/run-ci-check.mjs --name train-rendered-qa -- npm run qa:train
      - name: Active Workout rendered QA
        if: >-
          needs.classify.outputs.rendered_general == 'true' ||
          needs.classify.outputs.rendered_active_workout == 'true'
        env:
          QA_AW10_EVIDENCE_DIR: ci-reports/active-workout-aw10-evidence
        run: >-
          node scripts/run-ci-check.mjs --name active-workout-rendered-qa --
          node scripts/run-aw10-active-workout-closure-qa-entry.mjs
      - name: Workout History rendered QA
        if: >-
          needs.classify.outputs.rendered_general == 'true' ||
          needs.classify.outputs.rendered_workout_history == 'true'
        env:
          QA_WORKOUT_HISTORY_EVIDENCE_DIR: ci-reports/workout-history-qa-evidence
        run: node scripts/run-ci-check.mjs --name workout-history-rendered-qa -- npm run qa:workout-history
      - name: Stop production QA server
        if: always()
        run: |
          if [ -f /tmp/pr-quality-qa-server.pid ]; then
            kill "$(cat /tmp/pr-quality-qa-server.pid)" 2>/dev/null || true
          fi
      - name: Upload successful rendered evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-rendered-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            ci-reports/rendered-qa-evidence/
            ci-reports/train-qa-evidence/
            ci-reports/active-workout-aw10-evidence/
            ci-reports/workout-history-qa-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-ui-failure-${{ github.run_id }}
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 7

  ci-contracts:
    name: ci-contracts
    needs: classify
    if: needs.classify.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repository script contracts
        run: node scripts/run-ci-check.mjs --name script-contracts -- npm run test:scripts
      - name: Telemetry contracts
        run: node scripts/run-ci-check.mjs --name telemetry -- npm run test:telemetry
      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-ci-failure-${{ github.run_id }}
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    needs: classify
    if: needs.classify.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production environment contract
        run: >-
          node scripts/run-ci-check.mjs --name environment -- bash -lc
          'set -euo pipefail;
          export PLAIVRA_VALIDATE_PRODUCTION_ENV=true;
          export PLAIVRA_RELEASE_ENVIRONMENT=production;
          export NEXT_PUBLIC_APP_URL=https://app.plaivra.com;
          export NEXT_PUBLIC_USE_MOCK_AUTH=false;
          export PLAIVRA_MCP_BASE_URL=https://app.plaivra.com/api/mcp;
          export PLAIVRA_OAUTH_ISSUER=https://app.plaivra.com;
          export PLAIVRA_CIMD_ALLOWED_ORIGINS=https://chatgpt.com;
          export CRON_SECRET=ci-placeholder-cron-secret-that-is-long-enough;
          npm run validate:env'
      - name: Production build
        run: node scripts/run-ci-check.mjs --name build -- bash -lc 'NEXT_PUBLIC_USE_MOCK_AUTH=false npm run build'
      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-build-failure-${{ github.run_id }}
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 7

  dependencies:
    name: dependency-audit
    needs: classify
    if: needs.classify.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Runtime dependency audit
        run: node scripts/run-ci-check.mjs --name dependency-audit -- npm audit --package-lock-only --omit=dev --audit-level=moderate
      - name: Upload focused failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-dependency-failure-${{ github.run_id }}
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: required-summary
    if: always()
    needs:
      - classify
      - integrity
      - core
      - database
      - ui
      - ci-contracts
      - build
      - dependencies
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJson(needs) }}
      SCOPE_JSON: ${{ needs.classify.outputs.scope_summary }}
    steps:
      - name: Publish concise scope and result summary
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const scope = JSON.parse(process.env.SCOPE_JSON || "{}");
          const lines = ["## PR Quality", "", `Scope: \`${JSON.stringify(scope)}\``, "", "| Job | Result |", "|---|---|"];
          let failed = false;
          for (const [name, value] of Object.entries(needs)) {
            lines.push(`| ${name} | ${value.result} |`);
            if (value.result === "failure" || value.result === "cancelled") failed = true;
          }
          require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          if (failed) process.exitCode = 1;
          NODE
