name: AW-10 non-workflow materializer
run-name: AW-10 non-workflow materializer / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw10-nonworkflow-materializer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-aw10-files:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw8-aw9-aw10-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw8-aw9-aw10-closure
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and validate non-workflow AW-10 files
        run: |
          set -euo pipefail
          node .github/aw10-closure-materialize.cjs
          git rm -f .github/aw10-closure-materialize.cjs .github/aw10-materializer-fix.cjs
          git diff --check
          node --check scripts/run-aw10-active-workout-closure-qa.mjs
          npm ci
          npm run typecheck
          npx vitest run --config vitest.unit.config.mjs \
            lib/workouts/derived-metrics/session.test.ts \
            lib/workouts/session-engine/aw9-controller.test.ts \
            lib/workouts/session-engine/contracts.test.ts \
            lib/workouts/session-engine/commands.test.ts \
            lib/workouts/session-engine/reducer.test.ts \
            lib/workouts/active-session-store/store.test.ts \
            lib/workouts/active-session-sync/fallback-lease.test.ts \
            lib/workouts/active-session-sync/leadership.test.ts \
            lib/product/active-workout-aw9-migration.test.ts \
            lib/product/active-workout-aw9-offline-contract.test.ts \
            components/workouts/active-workout/active-workout-runtime-model.test.ts \
            components/workouts/active-workout/active-workout-core-session.identity.test.tsx \
            components/workouts/active-workout-minimized-bar.test.tsx \
            lib/product/active-workout-aw7-minimize-review-completion.test.ts \
            lib/i18n/active-workout-message-contract.test.ts
      - name: Commit validated non-workflow AW-10 files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test(active-workout): materialize AW-10 closure files"
          git push origin HEAD:feat/active-workout-aw8-aw9-aw10-closure
