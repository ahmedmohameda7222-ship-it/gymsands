name: AW-10 bootstrap harness materializer
run-name: AW-10 bootstrap harness materializer / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw10-bootstrap-harness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-bootstrap-harness:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw8-aw9-aw10-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw8-aw9-aw10-closure
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and validate AW-10 bootstrap harness correction
        run: |
          set -euo pipefail
          node .github/aw10-bootstrap-harness-fix.cjs
          git rm -f .github/aw10-bootstrap-harness-fix.cjs
          git diff --check
          node --check scripts/train-layout-qa-fixture.mjs
          node --check scripts/run-aw10-active-workout-closure-qa.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const fixture = fs.readFileSync('scripts/train-layout-qa-fixture.mjs', 'utf8');
          const runner = fs.readFileSync('scripts/run-aw10-active-workout-closure-qa.mjs', 'utf8');
          if (!fixture.includes('Those documents have no storage authority')) {
            throw new Error('Origin-less storage guard missing.');
          }
          if (!runner.includes('controllerCount: document.querySelectorAll("[data-active-workout-controller]").length')) {
            throw new Error('Logical controller count contract missing.');
          }
          NODE
          npm ci
          npm run typecheck
          npx vitest run --config vitest.unit.config.mjs \
            lib/workouts/derived-metrics/session.test.ts \
            lib/workouts/active-session-store/store.test.ts \
            lib/workouts/active-session-sync/fallback-lease.test.ts \
            lib/workouts/active-session-sync/leadership.test.ts \
            lib/product/active-workout-aw9-offline-contract.test.ts \
            components/workouts/active-workout/active-workout-runtime-model.test.ts
      - name: Commit validated AW-10 harness correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test(active-workout): harden AW-10 bootstrap harness"
          git push origin HEAD:feat/active-workout-aw8-aw9-aw10-closure
