name: AW-10 set confirmation materializer
run-name: AW-10 set confirmation materializer / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw10-set-confirmation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_USE_MOCK_AUTH: "true"
  NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA: "true"

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw8-aw9-aw10-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw8-aw9-aw10-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply and validate correction
        run: |
          set -euo pipefail
          node .github/aw10-set-confirmation-fix.cjs
          git rm -f .github/aw10-set-confirmation-fix.cjs
          git diff --check
          npm run typecheck
          npx vitest run --config vitest.unit.config.mjs \
            lib/workouts/active-session-sync/contracts.test.ts \
            lib/workouts/active-session-store/store.test.ts
          node - <<'NODE'
          const fs = require('node:fs');
          const contracts = fs.readFileSync('lib/workouts/active-session-sync/contracts.ts', 'utf8');
          const coordinator = fs.readFileSync('lib/workouts/active-session-sync/coordinator.ts', 'utf8');
          const runner = fs.readFileSync('scripts/run-aw10-active-workout-closure-qa.mjs', 'utf8');
          const contractTest = fs.readFileSync('lib/product/active-workout-aw10-closure.test.ts', 'utf8');
          for (const expected of [
            'serializeWorkoutSetLogs([log])[0]',
            'stableSqlSetValue(log)',
            'semanticSetDetails',
            'semanticSegments'
          ]) {
            if (!contracts.includes(expected)) throw new Error(`Missing fingerprint contract: ${expected}`);
          }
          if (!coordinator.includes('Stop immediately so no stale')) {
            throw new Error('Terminal lane stop contract is missing.');
          }
          for (const expected of [
            'waitForNoPendingOperations',
            'stableZeroObservations >= 3'
          ]) {
            if (!runner.includes(expected)) throw new Error(`Missing stable queue proof: ${expected}`);
            if (!contractTest.includes(expected)) throw new Error(`Missing AW-10 regression assertion: ${expected}`);
          }
          NODE

          cp scripts/run-aw10-active-workout-closure-qa.mjs /tmp/aw10-runner-after-fix.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/run-aw10-active-workout-closure-qa.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            '}));\n\nfunction visible',
            `})).filter(({ name }) => new Set([\n  "21-reconnect-flush-mobile-en-390x844",\n  "23-server-terminal-wins-desktop-en-1440x900",\n  "30-data-conflict-use-local-desktop-en-1440x900"\n]).has(name));\n\nfunction visible`,
          );
          if (!source.includes(')).filter(({ name })')) {
            throw new Error('Focused AW-10 scenario filter was not installed.');
          }
          fs.writeFileSync(path, source);
          NODE
          node --check scripts/run-aw10-active-workout-closure-qa.mjs
          mkdir -p ci-reports/active-workout-aw10-focused
          NEXT_PUBLIC_USE_MOCK_AUTH=true NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA=true npm run build
          NEXT_PUBLIC_USE_MOCK_AUTH=true npm run start > ci-reports/aw10-focused-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          set +e
          QA_SERVER_MODE=production \
          QA_BUILD_COMMAND="NEXT_PUBLIC_USE_MOCK_AUTH=true NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA=true npm run build" \
          QA_START_COMMAND="npm run start" \
          QA_MOCK_AUTH_BUILD_VALUE=true \
          QA_HEAD_SHA="$(git rev-parse HEAD)" \
          QA_WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          QA_BASE_URL=http://localhost:3000 \
          QA_AW10_EVIDENCE_DIR=ci-reports/active-workout-aw10-focused \
          npm run qa:active-workout:aw10
          focused_status=$?
          set -e
          test -f ci-reports/active-workout-aw10-focused/aw10-active-workout-closure-results.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(
            'ci-reports/active-workout-aw10-focused/aw10-active-workout-closure-results.json',
            'utf8',
          ));
          if (report.results.length !== 3) {
            throw new Error(`Expected 3 focused scenarios, found ${report.results.length}.`);
          }
          const failed = report.results.filter((result) => result.failures.length);
          if (failed.length) {
            throw new Error(`Focused AW-10 failures: ${JSON.stringify(failed)}`);
          }
          console.log('Focused AW-10 durable scenarios passed 3/3.');
          NODE
          echo "Focused runner expected aggregate status: $focused_status"
          cp /tmp/aw10-runner-after-fix.mjs scripts/run-aw10-active-workout-closure-qa.mjs
          rm -rf ci-reports
          git diff --check
      - name: Commit validated correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(active-workout): confirm durable canonical set writes"
          git push origin HEAD:feat/active-workout-aw8-aw9-aw10-closure
