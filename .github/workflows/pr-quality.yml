name: AW-8 AW-9 final correction materializer
run-name: AW-8 AW-9 final correction materializer / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aw89-final-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-aw89-final-corrections:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw8-aw9-aw10-closure'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-aw8-aw9-aw10-closure
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and validate final AW-8 AW-9 corrections
        run: |
          set -euo pipefail
          node .github/aw89-final-correction-materialize.cjs
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-quality.yml
          git rm .github/aw89-final-correction-materialize.cjs
          git diff --check
          npm ci
          npm run typecheck
          npm run test:active-workout:aw8-aw10
      - name: Commit clean final correction state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(active-workout): isolate verification and rendered QA realtime"
          git push origin HEAD:feat/active-workout-aw8-aw9-aw10-closure
