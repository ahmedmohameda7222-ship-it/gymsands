name: AW-10 durable operation diagnostic
run-name: AW-10 durable operation diagnostic / pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aw10-durable-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key-long-enough
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-long-enough
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_USE_MOCK_AUTH: "true"
  NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA: "true"

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feat/active-workout-aw8-aw9-aw10-closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Instrument three remaining scenarios
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/run-aw10-active-workout-closure-qa.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            '}));\n\nfunction visible',
            `})).filter(({ name }) => new Set([\n  "21-reconnect-flush-mobile-en-390x844",\n  "23-server-terminal-wins-desktop-en-1440x900",\n  "30-data-conflict-use-local-desktop-en-1440x900"\n]).has(name));\n\nfunction visible`,
          );
          source = source.replace(
            'async function mutateFirstOperation(page, patch) {',
            `async function operationDiagnostics(page) {\n  await openDatabase(page);\n  return page.evaluate(async () => {\n    const request = indexedDB.open("plaivra-active-workout-v1", 1);\n    const database = await new Promise((resolve, reject) => {\n      request.onsuccess = () => resolve(request.result);\n      request.onerror = () => reject(request.error);\n    });\n    const transaction = database.transaction("operations", "readonly");\n    const allRequest = transaction.objectStore("operations").getAll();\n    const operations = await new Promise((resolve, reject) => {\n      allRequest.onsuccess = () => resolve(allRequest.result);\n      allRequest.onerror = () => reject(allRequest.error);\n    });\n    database.close();\n    return operations.sort((a, b) => a.sequence - b.sequence).map((operation) => ({\n      id: operation.id,\n      sequence: operation.sequence,\n      state: operation.state,\n      kind: operation.payload?.kind ?? null,\n      commandType: operation.payload?.request?.commandType ?? null,\n      expectedRevision: operation.payload?.request?.expectedRevision ?? null,\n      attemptCount: operation.attemptCount,\n      nextRetryAt: operation.nextRetryAt,\n      lastErrorCode: operation.lastErrorCode,\n      targetIdentity: operation.targetIdentity,\n      baseTargetFingerprint: operation.baseTargetFingerprint\n    }));\n  });\n}\n\nasync function mutateFirstOperation(page, patch) {`,
          );
          source = source.replace(
            '      requestCount: requestHistory.length,\n      failures',
            '      requestCount: requestHistory.length,\n      operationDiagnostics: await operationDiagnostics(capturePage),\n      failures',
          );
          if (!source.includes('operationDiagnostics: await operationDiagnostics')) {
            throw new Error('AW-10 diagnostic instrumentation failed.');
          }
          fs.writeFileSync(path, source);
          NODE
          node --check scripts/run-aw10-active-workout-closure-qa.mjs
      - name: Run focused production diagnostic
        run: |
          set -euo pipefail
          npm run build
          npm run start > ci-reports/aw10-diagnostic-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then break; fi
            sleep 1
          done
          set +e
          QA_SERVER_MODE=production \
          QA_BUILD_COMMAND="NEXT_PUBLIC_USE_MOCK_AUTH=true NEXT_PUBLIC_PLAIVRA_PRODUCTION_QA=true npm run build" \
          QA_START_COMMAND="npm run start" \
          QA_MOCK_AUTH_BUILD_VALUE=true \
          QA_HEAD_SHA="${{ github.event.pull_request.head.sha }}" \
          QA_WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          QA_BASE_URL=http://localhost:3000 \
          QA_AW10_EVIDENCE_DIR=ci-reports/active-workout-aw10-diagnostic \
          npm run qa:active-workout:aw10
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('ci-reports/active-workout-aw10-diagnostic/aw10-active-workout-closure-results.json', 'utf8'));
          for (const result of report.results) {
            console.log(JSON.stringify({
              name: result.name,
              failures: result.failures,
              checks: result.checks,
              measured: result.measured,
              operationDiagnostics: result.operationDiagnostics
            }, null, 2));
          }
          NODE
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: aw10-durable-operation-diagnostic-${{ github.run_id }}
          path: ci-reports/active-workout-aw10-diagnostic/
          if-no-files-found: error
          retention-days: 3
