name: PCS3C2 Docs Closure One-Shot

on:
  push:
    branches:
      - docs/pcs3c2-production-closure
    paths:
      - ".github/workflows/pcs3c2-docs-closure-one-shot.yml"

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/pcs3c2-production-closure
          fetch-depth: 0

      - name: Apply bounded reconciliation
        run: |
          echo '' | base64 -d > /tmp/pcs3c2_patch.py
          python /tmp/pcs3c2_patch.py

      - name: Validate and commit docs-only closure
        run: |
          git diff --check
          git rm .github/workflows/pcs3c2-docs-closure-one-shot.yml
          python - <<'PY'
          import subprocess
          expected = {
            "docs/control/PLAIVRA_CURRENT_STATE.md",
            "docs/control/PLAIVRA_DECISIONS.md",
            "docs/control/PLAIVRA_MASTER_PLAN.md",
            "docs/performance/pcs3-production-measurement.md",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f"unexpected generated diff: {sorted(changed)}")
          print("PCS3C2_DOCS_ONLY_VALIDATED")
          PY
          git add docs/control/PLAIVRA_CURRENT_STATE.md docs/control/PLAIVRA_DECISIONS.md docs/control/PLAIVRA_MASTER_PLAN.md docs/performance/pcs3-production-measurement.md
          git config user.name "ahmedmohameda7222-ship-it"
          git config user.email "ahmed.mohameda7222@gmail.com"
          git commit -m "docs(control): close PCS-3 with Production evidence"
          git push origin HEAD:docs/pcs3c2-production-closure
