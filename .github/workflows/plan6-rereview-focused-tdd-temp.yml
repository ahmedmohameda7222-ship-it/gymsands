name: Plan 6 Re-review Focused TDD Temp

on:
  push:
    branches:
      - feat/food-catalog-governance-plan6

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Align primary verifier with lease-token outbox contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/verification/food-catalog-governance-control-plane.sql')
          s=p.read_text()
          old="\n".join([
              "select public.food_catalog_claim_governance_outbox('66000000-0000-4000-8000-000000000422');",
              "select public.food_catalog_finish_governance_outbox('66000000-0000-4000-8000-000000000422',false,'fixture failure');",
              "select public.food_catalog_claim_governance_outbox('66000000-0000-4000-8000-000000000422');",
              "select public.food_catalog_finish_governance_outbox('66000000-0000-4000-8000-000000000422',true,null);",
          ])
          new="\n".join([
              "select (public.food_catalog_claim_governance_outbox('66000000-0000-4000-8000-000000000422','governance-worker',300))->>'leaseToken' as primary_retry_lease_a \\gset",
              "select public.food_catalog_finish_governance_outbox('66000000-0000-4000-8000-000000000422',:'primary_retry_lease_a',false,'fixture failure',0);",
              "select (public.food_catalog_claim_governance_outbox('66000000-0000-4000-8000-000000000422','governance-worker',300))->>'leaseToken' as primary_retry_lease_b \\gset",
              "select public.food_catalog_finish_governance_outbox('66000000-0000-4000-8000-000000000422',:'primary_retry_lease_b',true,null,0);",
          ])
          if old in s:
              p.write_text(s.replace(old,new))
          elif "primary_retry_lease_a" not in s:
              raise SystemExit('primary verifier has neither old nor corrected outbox block')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Plan 6 re-review focused unit contracts
        run: >-
          ./node_modules/.bin/vitest run --config vitest.unit.config.mjs
          lib/product/food-catalog-governance-plan6-rereview.test.ts
          lib/food-catalog/governance/canonical-commands.test.ts
          lib/food-catalog/governance/evidence.test.ts
          lib/food-catalog/governance/outbox.test.ts
          lib/food-catalog/governance/personal-overrides.test.ts
      - name: Commit verifier correction and remove failed one-shot helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/plan6-primary-verifier-fix-one-shot.yml ]; then
            git rm .github/workflows/plan6-primary-verifier-fix-one-shot.yml
          fi
          git add supabase/verification/food-catalog-governance-control-plane.sql
          if git diff --cached --quiet; then
            echo "Verifier already aligned; no commit needed"
            exit 0
          fi
          git commit -m "test(plan6): exercise leased outbox finish in primary verifier"
          git push origin HEAD:feat/food-catalog-governance-plan6
