name: P8A Notes Pagination Correction V3

on:
  push:
    branches:
      - feat/p8a-single-workout-pdf-report
    paths:
      - .github/workflows/p8a-pagination-correction-v3.yml

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/p8a-single-workout-pdf-report

      - name: Apply exact notes preflight and inter-exercise spacing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          render = Path("lib/reports/workout/render.ts")
          text = render.read_text(encoding="utf-8")

          notes_pattern = re.compile(
              r'''    if \(model\.notes\) \{\n'''
              r'''      composer\.sectionHeading\(copy\.notes, 44\);\n'''
              r'''      composer\.drawText\(model\.notes, \{ size: 9, lineHeight: 13\.5 \}\);\n'''
              r'''    \}'''
          )
          notes_replacement = '''    if (model.notes) {
              const noteStyle = { size: 9, lineHeight: 13.5 } as const;
              const noteHeight = composer.wrappedHeight(
                model.notes,
                PDF_LAYOUT.contentWidth,
                noteStyle,
              );
              composer.sectionHeading(copy.notes, noteHeight + 22);
              composer.drawText(model.notes, noteStyle);
            }'''
          text, notes_count = notes_pattern.subn(notes_replacement, text, count=1)
          if notes_count != 1:
              raise SystemExit("Unexpected notes rendering authority")

          trailing = '''  composer.gap(6);
          }

          export async function renderWorkoutReport'''
          trailing_replacement = '''}

          export async function renderWorkoutReport'''
          if text.count(trailing) != 1:
              raise SystemExit("Unexpected trailing exercise gap authority")
          text = text.replace(trailing, trailing_replacement, 1)

          loop = '''    composer.sectionHeading(copy.exercises, 48);
              for (const exercise of model.exercises) {
                drawExercise(composer, model, exercise);
              }
          '''
          loop_replacement = '''    composer.sectionHeading(copy.exercises, 48);
              model.exercises.forEach((exercise, index) => {
                drawExercise(composer, model, exercise);
                if (index < model.exercises.length - 1) composer.gap(6);
              });
          '''
          loop = "\n".join(line[6:] if line.startswith("      ") else line for line in loop.splitlines()) + "\n"
          loop_replacement = "\n".join(line[6:] if line.startswith("      ") else line for line in loop_replacement.splitlines()) + "\n"
          if text.count(loop) != 1:
              raise SystemExit("Unexpected exercise iteration authority")
          text = text.replace(loop, loop_replacement, 1)
          render.write_text(text, encoding="utf-8")

          render_test = Path("lib/reports/workout/render.test.ts")
          test_text = render_test.read_text(encoding="utf-8")
          anchor = "      expect(result.pageCount).toBeGreaterThan(0);\n      expect(result.pageCount).toBeLessThanOrEqual(40);"
          replacement_test = "      expect(result.pageCount).toBeGreaterThan(0);\n      if (language === \"en\") expect(result.pageCount).toBe(1);\n      expect(result.pageCount).toBeLessThanOrEqual(40);"
          if test_text.count(anchor) != 1:
              raise SystemExit("Unexpected core page-count assertion authority")
          render_test.write_text(test_text.replace(anchor, replacement_test), encoding="utf-8")

          evidence_test = Path("lib/reports/workout/render-evidence.test.ts")
          evidence = evidence_test.read_text(encoding="utf-8")
          evidence_pattern = re.compile(
              r'''    expect\(loaded\.getPageCount\(\)\)\.toBeGreaterThan\(0\);\n'''
              r'''    if \(testCase\.language !== "en"\) \{\n'''
              r'''      expect\(loaded\.getPageCount\(\)\)\.toBeGreaterThan\(1\);\n'''
              r'''    \}'''
          )
          evidence_replacement = '''    expect(loaded.getPageCount()).toBeGreaterThan(0);
              if (testCase.language === "en") {
                expect(loaded.getPageCount()).toBe(1);
              } else {
                expect(loaded.getPageCount()).toBeGreaterThan(1);
              }'''
          evidence, evidence_count = evidence_pattern.subn(
              evidence_replacement,
              evidence,
              count=1,
          )
          if evidence_count != 1:
              raise SystemExit("Unexpected evidence page-count assertion authority")
          evidence_test.write_text(evidence, encoding="utf-8")
          PY
          git diff --check -- \
            lib/reports/workout/render.ts \
            lib/reports/workout/render.test.ts \
            lib/reports/workout/render-evidence.test.ts

      - name: Set up repository Node authority
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install unchanged repository lock
        run: npm ci

      - name: Run focused tests and typecheck
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run --config vitest.unit.config.mjs \
            lib/reports/workout/render.test.ts \
            lib/reports/workout/model.test.ts \
            lib/reports/pdf/text-direction.test.ts \
            lib/reports/pdf/fonts.test.ts
          npm run typecheck

      - name: Generate and rasterize corrected evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=/tmp/p8a-pagination-evidence
          mkdir -p "$evidence"
          P8A_PDF_EVIDENCE_DIR="$evidence" \
            npx vitest run --config vitest.unit.config.mjs \
              lib/reports/workout/render-evidence.test.ts
          command -v pdftoppm >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          }
          for pdf in "$evidence"/*.pdf; do
            pdftoppm -png -r 150 "$pdf" "${pdf%.pdf}"
          done
          test "$(find "$evidence" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          test "$(find "$evidence" -maxdepth 1 -name '*.png' | wc -l)" -ge 3

      - name: Commit only corrected implementation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plaivra Implementation Authority"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            lib/reports/workout/render.ts \
            lib/reports/workout/render.test.ts \
            lib/reports/workout/render-evidence.test.ts
          test -z "$(git diff --cached --name-only -- '.github/workflows/**')"
          git diff --cached --check
          git commit -m "fix(reports): avoid orphan workout notes pages"
          git push origin HEAD:feat/p8a-single-workout-pdf-report

      - name: Upload corrected PDF evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8a-corrected-pagination-evidence-${{ github.run_id }}
          path: /tmp/p8a-pagination-evidence
          if-no-files-found: error
          retention-days: 14
