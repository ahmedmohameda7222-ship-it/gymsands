name: PR144 Correction QA Patch Run

on:
  push:
    branches:
      - feat/active-workout-full-implementation
    paths:
      - .github/workflows/pr144-correction-qa-patch-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply staged QA patch
        run: python scripts/pr144-correction-qa-patch.py
      - name: Syntax check
        run: node --check scripts/run-active-workout-full-authority-qa.mjs
      - name: Install dependencies
        run: npm ci
      - name: Correction source contracts
        run: npx vitest run lib/product/active-workout-pr144-correction-authority.test.ts lib/product/active-workout-aw10-closure.test.ts
      - name: Commit QA source and retire patch script
        shell: bash
        run: |
          rm scripts/pr144-correction-qa-patch.py
          git config user.name "Plaivra Repository Delivery"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/run-active-workout-full-authority-qa.mjs scripts/pr144-correction-qa-patch.py
          git diff --cached --check
          git commit -m "test: strengthen PR144 correction rendered authority"
          git push origin HEAD:feat/active-workout-full-implementation
