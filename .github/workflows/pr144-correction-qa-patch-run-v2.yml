name: PR144 Correction QA Patch Run V2

on:
  push:
    branches:
      - feat/active-workout-full-implementation
    paths:
      - .github/workflows/pr144-correction-qa-patch-run-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/active-workout-full-implementation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Preserve canonical scenario identity and apply staged QA patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/pr144-correction-qa-patch.py')
          text = path.read_text()
          old = 'name: "transient-menu-mutual-exclusion-keyboard-390x844"'
          new = 'name: "transient-menu-mutual-exclusion-390x844-keyboard"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one scenario-name staging marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python scripts/pr144-correction-qa-patch.py
      - name: Syntax check
        run: node --check scripts/run-active-workout-full-authority-qa.mjs
      - name: Install dependencies
        run: npm ci
      - name: Correction and canonical source contracts
        run: npx vitest run lib/product/active-workout-pr144-correction-authority.test.ts lib/product/active-workout-aw10-closure.test.ts
      - name: Commit QA source and retire patch script
        shell: bash
        run: |
          rm scripts/pr144-correction-qa-patch.py
          git config user.name "Plaivra Repository Delivery"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/run-active-workout-full-authority-qa.mjs scripts/pr144-correction-qa-patch.py
          git diff --cached --check
          git commit -m "test: strengthen PR144 correction rendered authority"
          git push origin HEAD:feat/active-workout-full-implementation
