name: Planner PR143 Correction

on:
  push:
    branches:
      - feat/active-workout-redesign
    paths:
      - .github/workflows/planner-pr143-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: feat/active-workout-redesign
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply exact Planner corrections
        run: python3 scripts/planner-pr143-correction.py
      - name: Targeted regression tests
        run: >-
          npx vitest run
          components/workouts/active-workout/active-workout-execution-capability.test.ts
          lib/product/active-workout-redesign-contract.test.ts
          lib/product/active-workout-aw5-ui-core.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Diff integrity
        run: git diff --check
      - name: Commit corrected branch
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No correction diff produced" >&2
            exit 1
          fi
          git config user.name "Plaivra Planner QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(active-workout): align final Planner authority"
          git push origin HEAD:feat/active-workout-redesign
