name: Temporary Plan 7 FULL_DR RPO implementation

on:
  push:
    branches: [tmp-plan7-full-dr-rpo-red]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/food-catalog-plan7-workstream1-portability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact starting SHA
        run: test "$(git rev-parse HEAD)" = "468cc24d42ce441155aa81401abae3d7930b310a"
      - run: npm ci
      - name: Apply focused three-file implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/verify-food-catalog-integrated-restore.mjs')
          text = script.read_text()
          replacements = [
              ('function parseArgs(argv) {', 'export function parseIntegratedRestoreArgs(argv) {'),
              ('    else if (value === "--expected-head") options.expectedHead = next();\n    else if (value === "--output") options.output = next();',
               '    else if (value === "--expected-head") options.expectedHead = next();\n    else if (value === "--max-artifact-age-ms") options.maxArtifactAgeMs = next();\n    else if (value === "--output") options.output = next();'),
              ('  const required = ["sourceArtifactDir","targetArtifactDir","targetUrl","restoreEvidencePath","sourceSecurityPath","targetSecurityPath","targetServiceAuthorityPath","sourceSearchPath","targetSearchPath","consumerReferencePath","expectedHead","output"];',
               '  const required = ["sourceArtifactDir","targetArtifactDir","targetUrl","restoreEvidencePath","sourceSecurityPath","targetSecurityPath","targetServiceAuthorityPath","sourceSearchPath","targetSearchPath","consumerReferencePath","expectedHead","maxArtifactAgeMs","output"];'),
              ('  if (!SHA40.test(options.expectedHead)) throw new Error("Integrated restore verifier expected head must be an exact commit SHA.");\n  return options;',
               '  if (!SHA40.test(options.expectedHead)) throw new Error("Integrated restore verifier expected head must be an exact commit SHA.");\n  const maxArtifactAgeMs = Number(options.maxArtifactAgeMs);\n  if (!Number.isFinite(maxArtifactAgeMs) || !Number.isInteger(maxArtifactAgeMs) || maxArtifactAgeMs <= 0) {\n    throw new Error("Integrated restore verifier max artifact age must be a finite positive integer in milliseconds.");\n  }\n  options.maxArtifactAgeMs = maxArtifactAgeMs;\n  return options;'),
              ('      recoveryEvaluation: Object.freeze({\n        evaluationTime: new Date().toISOString(),\n      }),',
               '      recoveryEvaluation: Object.freeze({\n        evaluationTime: new Date().toISOString(),\n        maxArtifactAgeMs: options.maxArtifactAgeMs,\n      }),'),
              ('  const options = parseArgs(process.argv.slice(2));', '  const options = parseIntegratedRestoreArgs(process.argv.slice(2));'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one script replacement, found {text.count(old)}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          script.write_text(text)

          test = Path('scripts/verify-food-catalog-integrated-restore.test.mjs')
          text = test.read_text()
          block = r'''

          it("requires an explicit positive integer max artifact age for canonical FULL_DR invocation", async () => {
            const verifier = await import("./verify-food-catalog-integrated-restore.mjs");
            assert.equal(typeof verifier.parseIntegratedRestoreArgs, "function");
            const base = [
              "--source-artifact-dir", "source",
              "--target-artifact-dir", "target",
              "--target-url", "postgresql://postgres:postgres@127.0.0.1:54322/postgres",
              "--restore-evidence", "restore.json",
              "--source-security", "source-security.json",
              "--target-security", "target-security.json",
              "--target-service-authority", "service.json",
              "--source-search", "source-search.json",
              "--target-search", "target-search.json",
              "--consumer-reference", "consumer.json",
              "--expected-head", "a".repeat(40),
              "--output", "output.json",
            ];
            assert.throws(() => verifier.parseIntegratedRestoreArgs(base), /max.*artifact.*age|required/i);
            assert.throws(() => verifier.parseIntegratedRestoreArgs([...base, "--max-artifact-age-ms", "nope"]), /max.*artifact.*age|positive|integer/i);
            assert.throws(() => verifier.parseIntegratedRestoreArgs([...base, "--max-artifact-age-ms", "0"]), /max.*artifact.*age|positive|integer/i);
            assert.throws(() => verifier.parseIntegratedRestoreArgs([...base, "--max-artifact-age-ms", "-1"]), /max.*artifact.*age|positive|integer/i);
            const parsed = verifier.parseIntegratedRestoreArgs([...base, "--max-artifact-age-ms", "3600000"]);
            assert.equal(parsed.maxArtifactAgeMs, 3600000);
          });
          '''
          marker = '\n});\n'
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('test suite terminator not found')
          text = text[:pos] + block + text[pos:]
          test.write_text(text)

          workflow = Path('.github/workflows/food-catalog-plan7-integrated-full-dr.yml')
          text = workflow.read_text()
          old = '          node scripts/verify-food-catalog-integrated-restore.mjs \\\n'
          new = '          # 1h applies only to fresh same-run FULL_DR CI certification; other recovery/cutover callers must set their own explicit RPO.\n          node scripts/verify-food-catalog-integrated-restore.mjs \\\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one integrated verifier invocation, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '            --consumer-reference "test/fixtures/food-catalog/plan7-consumer-reference-v1.json" \\\n            --expected-head "$expected" \\\n            --output "$RUNNER_TEMP/plan7-integrated-evidence.json"'
          new = '            --consumer-reference "test/fixtures/food-catalog/plan7-consumer-reference-v1.json" \\\n            --expected-head "$expected" \\\n            --max-artifact-age-ms 3600000 \\\n            --output "$RUNNER_TEMP/plan7-integrated-evidence.json"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one verifier arg block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = "          if (!value.restoreVerified || !value.trusted || !value.protectedSegmentsVerified || !value.searchVerified || !value.drReady) process.exit(1);"
          new = "          if (!value.restoreVerified || !value.trusted || !value.protectedSegmentsVerified || !value.searchVerified || !value.drReady) process.exit(1);\n          if (value.recoveryEligible !== true || value.recoveryEligibility?.agePolicyApplied !== true || value.recoveryEligibility?.maxArtifactAgeMs !== 3600000) process.exit(1);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one final certification assertion, found {text.count(old)}')
          text = text.replace(old, new, 1)
          workflow.write_text(text)
          PY
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/food-catalog-plan7-integrated-full-dr.yml scripts/verify-food-catalog-integrated-restore.mjs scripts/verify-food-catalog-integrated-restore.test.mjs "
      - name: Focused GREEN verification
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/verify-food-catalog-integrated-restore.test.mjs
          npx vitest run lib/food-catalog/portability/recovery-eligibility.test.ts lib/food-catalog/portability/certification-boundary.test.ts
      - name: Commit exactly once from starting SHA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ahmedmohameda7222-ship-it"
          git config user.email "ahmed.mohameda7222@gmail.com"
          git add scripts/verify-food-catalog-integrated-restore.mjs scripts/verify-food-catalog-integrated-restore.test.mjs .github/workflows/food-catalog-plan7-integrated-full-dr.yml
          git commit -m "fix(plan7): require explicit full-dr recovery age policy"
          test "$(git rev-parse HEAD^)" = "468cc24d42ce441155aa81401abae3d7930b310a"
          git push origin HEAD:feat/food-catalog-plan7-workstream1-portability
