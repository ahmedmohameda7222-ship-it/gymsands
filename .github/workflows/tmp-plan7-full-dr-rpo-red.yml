name: Temporary Plan 7 FULL_DR RPO final verification

on:
  push:
    branches: [tmp-plan7-full-dr-rpo-red]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7493f3685d3a76a9ca4742933e0bb85c87f01c4a
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exact final focused verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7493f3685d3a76a9ca4742933e0bb85c87f01c4a"
          node --test scripts/verify-food-catalog-integrated-restore.test.mjs
          npx vitest run lib/food-catalog/portability/recovery-eligibility.test.ts lib/food-catalog/portability/certification-boundary.test.ts
