name: Temporary Plan 7 FULL_DR RPO object

on:
  push:
    branches: [tmp-plan7-full-dr-rpo-red]

permissions:
  contents: write

jobs:
  object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/food-catalog-plan7-workstream1-portability
          fetch-depth: 0
      - name: Verify exact starting SHA
        run: test "$(git rev-parse HEAD)" = "468cc24d42ce441155aa81401abae3d7930b310a"
      - name: Recreate verified three-file implementation commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          script = Path('scripts/verify-food-catalog-integrated-restore.mjs')
          text = script.read_text()
          replacements = [
              ('function parseArgs(argv) {', 'export function parseIntegratedRestoreArgs(argv) {'),
              ('    else if (value === "--expected-head") options.expectedHead = next();\n    else if (value === "--output") options.output = next();', '    else if (value === "--expected-head") options.expectedHead = next();\n    else if (value === "--max-artifact-age-ms") options.maxArtifactAgeMs = next();\n    else if (value === "--output") options.output = next();'),
              ('  const required = ["sourceArtifactDir","targetArtifactDir","targetUrl","restoreEvidencePath","sourceSecurityPath","targetSecurityPath","targetServiceAuthorityPath","sourceSearchPath","targetSearchPath","consumerReferencePath","expectedHead","output"];', '  const required = ["sourceArtifactDir","targetArtifactDir","targetUrl","restoreEvidencePath","sourceSecurityPath","targetSecurityPath","targetServiceAuthorityPath","sourceSearchPath","targetSearchPath","consumerReferencePath","expectedHead","maxArtifactAgeMs","output"];'),
              ('  if (!SHA40.test(options.expectedHead)) throw new Error("Integrated restore verifier expected head must be an exact commit SHA.");\n  return options;', '  if (!SHA40.test(options.expectedHead)) throw new Error("Integrated restore verifier expected head must be an exact commit SHA.");\n  const maxArtifactAgeMs = Number(options.maxArtifactAgeMs);\n  if (!Number.isFinite(maxArtifactAgeMs) || !Number.isInteger(maxArtifactAgeMs) || maxArtifactAgeMs <= 0) {\n    throw new Error("Integrated restore verifier max artifact age must be a finite positive integer in milliseconds.");\n  }\n  options.maxArtifactAgeMs = maxArtifactAgeMs;\n  return options;'),
              ('      recoveryEvaluation: Object.freeze({\n        evaluationTime: new Date().toISOString(),\n      }),', '      recoveryEvaluation: Object.freeze({\n        evaluationTime: new Date().toISOString(),\n        maxArtifactAgeMs: options.maxArtifactAgeMs,\n      }),'),
              ('  const options = parseArgs(process.argv.slice(2));', '  const options = parseIntegratedRestoreArgs(process.argv.slice(2));'),
          ]
          for old, new in replacements:
              assert text.count(old) == 1
              text = text.replace(old, new, 1)
          script.write_text(text)
          test = Path('scripts/verify-food-catalog-integrated-restore.test.mjs')
          text = test.read_text()
          block = r'''

          it("requires an explicit positive integer max artifact age for canonical FULL_DR invocation", async () => {
            const verifier = await import("./verify-food-catalog-integrated-restore.mjs");
            assert.equal(typeof verifier.parseIntegratedRestoreArgs, "function");
            const base = [
              "--source-artifact-dir", "source", "--target-artifact-dir", "target",
              "--target-url", "postgresql://postgres:postgres@127.0.0.1:54322/postgres",
              "--restore-evidence", "restore.json", "--source-security", "source-security.json",
              "--target-security", "target-security.json", "--target-service-authority", "service.json",
              "--source-search", "source-search.json", "--target-search", "target-search.json",
              "--consumer-reference", "consumer.json", "--expected-head", "a".repeat(40),
              "--output", "output.json",
            ];
            assert.throws(() => verifier.parseIntegratedRestoreArgs(base), /max.*artifact.*age|required/i);
            assert.throws(() => verifier.parseIntegratedRestoreArgs([...base, "--max-artifact-age-ms", "nope"]), /max.*artifact.*age|positive|integer/i);
            assert.throws(() => verifier.parseIntegratedRestoreArgs([...base, "--max-artifact-age-ms", "0"]), /max.*artifact.*age|positive|integer/i);
            assert.throws(() => verifier.parseIntegratedRestoreArgs([...base, "--max-artifact-age-ms", "-1"]), /max.*artifact.*age|positive|integer/i);
            const parsed = verifier.parseIntegratedRestoreArgs([...base, "--max-artifact-age-ms", "3600000"]);
            assert.equal(parsed.maxArtifactAgeMs, 3600000);
          });
          '''
          pos = text.rfind('\n});')
          assert pos >= 0
          test.write_text(text[:pos] + block + text[pos:])
          workflow = Path('.github/workflows/food-catalog-plan7-integrated-full-dr.yml')
          text = workflow.read_text()
          old = '          node scripts/verify-food-catalog-integrated-restore.mjs \\\n'
          assert text.count(old) == 1
          text = text.replace(old, '          # 1h applies only to fresh same-run FULL_DR CI certification; other recovery/cutover callers must set their own explicit RPO.\n' + old, 1)
          old = '            --consumer-reference "test/fixtures/food-catalog/plan7-consumer-reference-v1.json" \\\n            --expected-head "$expected" \\\n            --output "$RUNNER_TEMP/plan7-integrated-evidence.json"'
          assert text.count(old) == 1
          text = text.replace(old, '            --consumer-reference "test/fixtures/food-catalog/plan7-consumer-reference-v1.json" \\\n            --expected-head "$expected" \\\n            --max-artifact-age-ms 3600000 \\\n            --output "$RUNNER_TEMP/plan7-integrated-evidence.json"', 1)
          old = "          if (!value.restoreVerified || !value.trusted || !value.protectedSegmentsVerified || !value.searchVerified || !value.drReady) process.exit(1);"
          assert text.count(old) == 1
          text = text.replace(old, old + "\n          if (value.recoveryEligible !== true || value.recoveryEligibility?.agePolicyApplied !== true || value.recoveryEligibility?.maxArtifactAgeMs !== 3600000) process.exit(1);", 1)
          workflow.write_text(text)
          PY
          git config user.name "ahmedmohameda7222-ship-it"
          git config user.email "ahmed.mohameda7222@gmail.com"
          git add scripts/verify-food-catalog-integrated-restore.mjs scripts/verify-food-catalog-integrated-restore.test.mjs .github/workflows/food-catalog-plan7-integrated-full-dr.yml
          git commit -m "fix(plan7): require explicit full-dr recovery age policy"
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "TREE_SHA=$(git rev-parse HEAD^{tree})"
          set +e
          git push origin HEAD:feat/food-catalog-plan7-workstream1-portability
          echo "PUSH_STATUS=$?"
          exit 0
