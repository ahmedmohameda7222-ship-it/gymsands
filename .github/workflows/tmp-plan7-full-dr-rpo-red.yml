name: Temporary Plan 7 FULL_DR RPO RED

on:
  push:
    branches: [tmp-plan7-full-dr-rpo-red]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 468cc24d42ce441155aa81401abae3d7930b310a
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove missing explicit max-age parser contract
        shell: bash
        run: |
          set +e
          node --input-type=module -e "import('./scripts/verify-food-catalog-integrated-restore.mjs').then((m)=>{if(typeof m.parseIntegratedRestoreArgs!=='function') throw new Error('MISSING_EXPLICIT_MAX_AGE_PARSER')})" > red.log 2>&1
          status=$?
          cat red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected starting SHA to lack the explicit FULL_DR max-age CLI contract." >&2
            exit 1
          fi
          grep 'MISSING_EXPLICIT_MAX_AGE_PARSER' red.log >/dev/null
          echo 'EXPECTED_RED_CONFIRMED'
