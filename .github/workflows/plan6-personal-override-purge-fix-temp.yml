name: Plan 6 Personal Override Purge Fix Temp
on:
  push:
    branches:
      - feat/food-catalog-governance-plan6
    paths:
      - .github/workflows/plan6-personal-override-purge-fix-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extend account purge for Plan 6 personal overrides
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const migrationPath = 'supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql';
          let migration = fs.readFileSync(migrationPath, 'utf8');
          const migrationAnchor = `create or replace function public.food_catalog_governance_metrics()`;
          if (!migration.includes(migrationAnchor)) throw new Error('Plan 6 metrics anchor missing.');
          const purgeBlock = `-- Extend the canonical Nutrition account-deletion lifecycle to Plan 6 personal overrides.\nalter function public.purge_account_application_data_atomic(uuid) set schema private;\nalter function private.purge_account_application_data_atomic(uuid)\n  rename to food_catalog_governance_core_purge_account_application_data_atomic;\n\ncreate function public.purge_account_application_data_atomic(p_user_id uuid)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = ''\nas $function$\ndeclare\n  v_result jsonb;\n  v_food_personal_overrides integer := 0;\n  v_food_personal_override_revisions integer := 0;\nbegin\n  -- Delete the current pointer first because it RESTRICT-references the revision history.\n  delete from public.food_personal_overrides where user_id = p_user_id;\n  get diagnostics v_food_personal_overrides = row_count;\n\n  delete from public.food_personal_override_revisions where user_id = p_user_id;\n  get diagnostics v_food_personal_override_revisions = row_count;\n\n  if exists (\n    select 1 from public.food_personal_overrides where user_id = p_user_id\n    union all\n    select 1 from public.food_personal_override_revisions where user_id = p_user_id\n  ) then\n    raise exception 'Food Catalog Plan 6 personal override purge left owner rows behind.' using errcode='23514';\n  end if;\n\n  v_result := private.food_catalog_governance_core_purge_account_application_data_atomic(p_user_id);\n  return v_result || jsonb_build_object(\n    'food_personal_overrides_deleted', v_food_personal_overrides,\n    'food_personal_override_revisions_deleted', v_food_personal_override_revisions\n  );\nend\n$function$;\n\nrevoke all on function public.purge_account_application_data_atomic(uuid) from public, anon, authenticated, service_role;\ngrant execute on function public.purge_account_application_data_atomic(uuid) to service_role;\n\n`;
          migration = migration.replace(migrationAnchor, purgeBlock + migrationAnchor);
          fs.writeFileSync(migrationPath, migration);

          const verifierPath = 'supabase/verification/food-catalog-governance-control-plane.sql';
          let verifier = fs.readFileSync(verifierPath, 'utf8');
          const verifierAnchor = `-- Duplicate resolution requires approved evidence and preserves the source Food/history.`;
          if (!verifier.includes(verifierAnchor)) throw new Error('Plan 6 duplicate verifier anchor missing.');
          const verifierBlock = `-- Plan 6 personal override purge follows the existing account-deletion lifecycle.\nset local role service_role;\nselect set_config('request.jwt.claim.role','service_role',true);\nselect public.purge_account_application_data_atomic(:'other_id') as plan6_personal_override_purge \\gset\nreset role;\nselect pg_temp.plan6_assert(not exists(select 1 from public.food_personal_overrides where user_id=:'other_id'),'Plan 6 personal override purge removed current pointer');\nselect pg_temp.plan6_assert(not exists(select 1 from public.food_personal_override_revisions where user_id=:'other_id'),'Plan 6 personal override purge removed revision history');\nselect pg_temp.plan6_assert(exists(select 1 from public.food_personal_overrides where user_id=:'member_id' and food_id=:'food_a'),'Plan 6 personal override purge preserved another member owner scope');\nselect pg_temp.plan6_assert((:'plan6_personal_override_purge'::jsonb->>'food_personal_overrides_deleted')::integer=1 and (:'plan6_personal_override_purge'::jsonb->>'food_personal_override_revisions_deleted')::integer=1,'Plan 6 personal override purge reports deleted owner rows');\nselect pg_temp.plan6_assert((select calories is null and protein_g is null from public.food_items where id=:'food_a'),'Plan 6 personal override purge did not mutate canonical Food');\n\n`;
          verifier = verifier.replace(verifierAnchor, verifierBlock + verifierAnchor);
          fs.writeFileSync(verifierPath, verifier);
          NODE
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260908100000_food_catalog_governance_control_plane.sql supabase/verification/food-catalog-governance-control-plane.sql
          git commit -m "fix: include Plan 6 overrides in account purge"
          git push origin HEAD:feat/food-catalog-governance-plan6
