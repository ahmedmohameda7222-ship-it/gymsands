name: Production owner alert routing

on:
  workflow_run:
    workflows:
      - Production uptime synthetic
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-owner-alert-routing
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.name == 'Production uptime synthetic' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Route Production synthetic result to owner incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/production-alert-routing.mjs
          --event "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --api-url "$GITHUB_API_URL"
